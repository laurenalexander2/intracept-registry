[package]
name = "intracept-registry"
version = "0.1.0"
edition = "2021"
description = "Translate shell commands into plain English using the Intracept registry."
license = "MIT"
readme = "README.md"
keywords = ["cli", "security", "shell", "translation"]
categories = ["command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ahash = "0.8"

[dev-dependencies]
serde_json = "1"
