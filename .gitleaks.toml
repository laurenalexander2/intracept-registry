# gitleaks configuration for the Intracept registry.
# Inherits the default ruleset and adds one tightened rule for Anthropic API
# keys (which were the documented near-miss leak from the coverage scraper).

[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{32,}'''
keywords = ["sk-ant-api"]

[allowlist]
description = "Allow registry sample data that intentionally references redacted-shaped keys"
paths = [
  '''tools/.*\.toml''',
]
regexes = [
  # Documented placeholders should not flag.
  '''sk-ant-api03-XXXXX''',
  '''sk-ant-api03-redacted''',
]
