# tools/mount_smbfs.toml — SMB/CIFS filesystem mount

[[command]]
path = "mount_smbfs"
translation = "Mount a shared folder from an SMB file server."
verdict = "allow"
rationale = "Attaches a remote network share to the local directory tree, enabling read-write access by default."
risk_class = "novel"

[[flag]]
applies_to = "mount_smbfs"
flag = "-N"
translation_modifier = "without prompting for a password"
verdict = "allow"
rationale = "Skips the password prompt; credentials must be provided another way."
arity = "Boolean"
