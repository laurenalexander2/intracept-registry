# tools/gcore.toml

[[command]]
path = "gcore"
translation = "Create a core dump file from a running process."
verdict = "allow"
rationale = "Captures the full memory state of a process, which may include sensitive data like passwords or keys."

[[flag]]
applies_to = "gcore"
flag = "-s"
translation_modifier = "suspending the process while capturing the core dump"
verdict = "allow"
rationale = "Pauses the target process during capture, which may disrupt its operation."

[[flag]]
applies_to = "gcore"
flag = "-o"
translation_modifier = "writing the core file to a specific path"
verdict = "allow"
rationale = "Only changes the output destination."

[[flag]]
applies_to = "gcore"
flag = "-x"
translation_modifier = "selecting which types of memory pages to include"
verdict = "allow"
rationale = "Controls the scope of the core dump content; the compact option produces smaller files."
