# tools/lpq.toml

[[command]]
path = "lpq"
translation = "Display the status of a printer queue."
verdict = "allow"
rationale = "Read-only display of queued print jobs."
risk_class = "novel"

[[flag]]
applies_to = "lpq"
flag = "-a"
translation_modifier = "showing jobs on all printers"
verdict = "allow"
rationale = "Only widens the read-only display to include all printers."
arity = "Boolean"

[[flag]]
applies_to = "lpq"
flag = "-l"
translation_modifier = "showing detailed information about each job"
verdict = "allow"
rationale = "Only increases the verbosity of the output."
arity = "Boolean"

[[flag]]
applies_to = "lpq"
flag = "-P"
translation_modifier = "showing jobs on a specific printer"
verdict = "allow"
rationale = "Only filters which printer's queue is displayed."
arity = "Boolean"

[[flag]]
applies_to = "lpq"
flag = "-E"
translation_modifier = "using an encrypted connection to the print server"
verdict = "allow"
rationale = "Only changes connection security; does not affect the display."
arity = "Boolean"
