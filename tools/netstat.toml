# tools/netstat.toml

[[command]]
path = "netstat"
translation = "Display network connections, routing tables, interface statistics, and protocol information."
verdict = "allow"
rationale = "Read-only display of network status information; modifies nothing."

[[flag]]
applies_to = "netstat"
flag = "-a"
translation_modifier = "including server (listening) connections"
verdict = "allow"
rationale = "Shows additional connection information; still read-only."

[[flag]]
applies_to = "netstat"
flag = "-n"
translation_modifier = "showing addresses as numbers instead of resolving hostnames"
verdict = "allow"
rationale = "Changes output format; still read-only."

[[flag]]
applies_to = "netstat"
flag = "-r"
translation_modifier = "showing the routing table"
verdict = "allow"
rationale = "Read-only display of routing information."

[[flag]]
applies_to = "netstat"
flag = "-s"
translation_modifier = "showing per-protocol statistics"
verdict = "allow"
rationale = "Read-only display of protocol statistics."

[[flag]]
applies_to = "netstat"
flag = "-i"
translation_modifier = "showing network interface state"
verdict = "allow"
rationale = "Read-only display of interface information."

[[flag]]
applies_to = "netstat"
flag = "-l"
translation_modifier = "showing full IPv6 addresses without truncation"
verdict = "allow"
rationale = "Only changes address display format; still read-only."

[[flag]]
applies_to = "netstat"
flag = "-p"
translation_modifier = "limited to a specific network protocol"
verdict = "allow"
rationale = "Filters output to one protocol; still read-only."

[[flag]]
applies_to = "netstat"
flag = "-f"
translation_modifier = "limited to a specific address family"
verdict = "allow"
rationale = "Filters output to one address family; still read-only."

[[flag]]
applies_to = "netstat"
flag = "-L"
translation_modifier = "showing the size of connection listen queues"
verdict = "allow"
rationale = "Read-only display of queue information."

[[flag]]
applies_to = "netstat"
flag = "-W"
translation_modifier = "showing full addresses without truncating"
verdict = "allow"
rationale = "Only changes output formatting; still read-only."

[[flag]]
applies_to = "netstat"
flag = "-b"
translation_modifier = "showing byte counts for each interface"
verdict = "allow"
rationale = "Adds byte count information to the display; still read-only."

[[flag]]
applies_to = "netstat"
flag = "-w"
translation_modifier = "refreshing the display at a specified interval in seconds"
verdict = "allow"
rationale = "Continuously displays updated statistics; still read-only."

[[flag]]
applies_to = "netstat"
flag = "-g"
translation_modifier = "showing multicast group memberships"
verdict = "allow"
rationale = "Read-only display of multicast information."

[[flag]]
applies_to = "netstat"
flag = "-m"
translation_modifier = "showing memory buffer statistics"
verdict = "allow"
rationale = "Read-only display of memory management information."
