# tools/lp.toml

[[command]]
path = "lp"
translation = "Send a file to a printer for printing."
verdict = "allow"
rationale = "Submits a print job; the original file is not modified."

[[flag]]
applies_to = "lp"
flag = "-d"
translation_modifier = "sending the job to a specific printer"
verdict = "allow"
rationale = "Only changes which printer receives the job."

[[flag]]
applies_to = "lp"
flag = "-n"
translation_modifier = "printing a specific number of copies"
verdict = "allow"
rationale = "Only affects the number of copies printed; does not change the document content or printer settings."

[[flag]]
applies_to = "lp"
flag = "-E"
translation_modifier = "using an encrypted connection to the print server"
verdict = "allow"
rationale = "Enables encryption for the connection; does not change what is printed."

[[flag]]
applies_to = "lp"
flag = "-q"
translation_modifier = "setting the job priority from 1 (lowest) to 100 (highest)"
verdict = "allow"
rationale = "Only changes the scheduling priority of the print job."

[[flag]]
applies_to = "lp"
flag = "-H hold"
translation_modifier = "holding the job in the queue instead of printing it immediately"
verdict = "allow"
rationale = "Delays printing; the job can be resumed later."

[[flag]]
applies_to = "lp"
flag = "-P"
translation_modifier = "printing only specific pages"
verdict = "allow"
rationale = "Limits output to selected pages; does not alter the original file."

[[flag]]
applies_to = "lp"
flag = "-t"
translation_modifier = "setting a custom job name"
verdict = "allow"
rationale = "Only changes the display name of the print job."

[[flag]]
applies_to = "lp"
flag = "-m"
translation_modifier = "sending an email notification when the job completes"
verdict = "allow"
rationale = "Only adds a notification; does not affect printing behavior."
