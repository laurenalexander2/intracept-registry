# tools/bioutil.toml

[[command]]
path = "bioutil"
translation = "Manage Touch ID fingerprint data on macOS."
verdict = "ask"
rationale = "Modifies biometric authentication data, which controls system access."
risk_class = "novel"

[[flag]]
applies_to = "bioutil"
flag = "--delete"
translation_modifier = "deleting biometric enrollment data"
verdict = "ask"
rationale = "Permanently removes biometric data; re-enrollment required."
arity = "Boolean"
[[flag]]
applies_to = "bioutil"
flag = "--purge"
translation_modifier = "purging all biometric data from the system"
verdict = "ask"
rationale = "Destroys all biometric enrollment data; full re-enrollment required for all users."
arity = "Boolean"
