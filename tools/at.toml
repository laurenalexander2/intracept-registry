# tools/at.toml

[[command]]
path = "at"
translation = "Schedule a command to run once at a specified time."
verdict = "require_approval"
rationale = "Schedules arbitrary commands for later execution without further confirmation."

[[flag]]
applies_to = "at"
flag = "-f"
translation_modifier = "reading the command from a file instead of typed input"
verdict = "allow"
rationale = "Runs the contents of a file as a scheduled job; risk depends on the file contents."

[[flag]]
applies_to = "at"
flag = "-m"
translation_modifier = "sending an email when the job finishes even if there was no output"
verdict = "allow"
rationale = "Only adds a notification; does not change what the job does."

[[flag]]
applies_to = "at"
flag = "-l"
translation_modifier = "listing scheduled jobs instead of creating one"
verdict = "allow"
rationale = "Read-only listing of pending jobs."

[[flag]]
applies_to = "at"
flag = "-r"
translation_modifier = "removing a scheduled job instead of creating one"
verdict = "allow"
rationale = "Deletes a pending job, which cannot be recovered but prevents unwanted execution."

[[flag]]
applies_to = "at"
flag = "-c"
translation_modifier = "displaying the contents of a scheduled job"
verdict = "allow"
rationale = "Read-only display of a job's commands."

[[flag]]
applies_to = "at"
flag = "-q"
translation_modifier = "using a specific named queue"
verdict = "allow"
rationale = "Only changes which queue the job is placed in; does not affect what runs."

[[flag]]
applies_to = "at"
flag = "-t"
translation_modifier = "specifying the time in numeric year-month-day-hour-minute format"
verdict = "allow"
rationale = "Only changes how the scheduled time is specified; does not affect what runs."

[[flag]]
applies_to = "at"
flag = "-v"
translation_modifier = "showing the time the job will run"
verdict = "allow"
rationale = "Only adds informational output; does not change behavior."
