# tools/pg_recvlogical.toml — PostgreSQL utility

[[command]]
path = "pg_recvlogical"
translation = "Stream logical replication changes from a PostgreSQL server."
verdict = "allow"
rationale = "Receives logical decoding output; does not modify the source database."
risk_class = "novel"

[[flag]]
applies_to = "pg_recvlogical"
flag = "--drop"
translation_modifier = "dropping the replication slot before starting"
verdict = "ask"
rationale = "Destroys an existing replication slot, which may break replication."
arity = "Boolean"
