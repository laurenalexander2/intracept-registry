# tools/jest.toml

[[command]]
path = "jest"
translation = "Run JavaScript and TypeScript tests using the Jest test framework."
verdict = "allow"
rationale = "Executes test suites that may have side effects depending on the tests, but the primary purpose is validation."
tags.scope = "local"
tags.effect = ["read", "execute"]
tags.reversibility = "trivial"
tags.target = ["process", "filesystem"]
tags.safety_override = false

[[flag]]
applies_to = "jest"
flag = "--coverage"
translation_modifier = "collecting and reporting code coverage statistics"
verdict = "allow"
rationale = "Adds coverage instrumentation and writes a coverage report; does not change test behavior."

[[flag]]
applies_to = "jest"
flag = "--verbose"
translation_modifier = "showing detailed results for each individual test"
verdict = "allow"
rationale = "Increases output detail; does not change test execution."

[[flag]]
applies_to = "jest"
flag = "--watch"
translation_modifier = "continuously re-running tests when source files change"
verdict = "allow"
rationale = "Keeps Jest running as a long-lived process that re-runs on file changes."

[[flag]]
applies_to = "jest"
flag = "--watchAll"
translation_modifier = "continuously re-running all tests when any file changes"
verdict = "allow"
rationale = "Like --watch but re-runs all tests instead of only affected ones."

[[flag]]
applies_to = "jest"
flag = "--bail"
translation_modifier = "stopping after the first test failure"
verdict = "allow"
rationale = "Reduces execution scope on failure; a time-saving option."

[[flag]]
applies_to = "jest"
flag = "--ci"
translation_modifier = "running in continuous integration mode with stricter snapshot behavior"
verdict = "allow"
rationale = "Fails on new snapshots instead of creating them; a safety-enhancing option for CI."

[[flag]]
applies_to = "jest"
flag = "--forceExit"
translation_modifier = "forcefully terminating the process after all tests complete"
verdict = "allow"
rationale = "Kills lingering async handles; may mask resource leaks but does not add destructive capability."

[[flag]]
applies_to = "jest"
flag = "--updateSnapshot"
translation_modifier = "overwriting existing test snapshots with new values"
verdict = "allow"
rationale = "Rewrites snapshot files, which changes the expected test output baseline."
tag_modifiers.effect = ["read", "write", "execute"]

[[flag]]
applies_to = "jest"
flag = "--config"
translation_modifier = "using a specified configuration file"
verdict = "allow"
rationale = "Selects which configuration to use; does not change Jest's capabilities."

# ── Combos ───────────────────────────────────────────────────────────────────

[[combo]]
path = "jest --coverage --verbose"
translation = "Run all tests with detailed per-test results and collect code coverage statistics."
verdict = "allow"
rationale = "Comprehensive test run with full visibility into individual results and coverage metrics."
tags.scope = "local"
tags.effect = ["read", "execute"]
tags.reversibility = "trivial"
tags.target = ["process", "filesystem"]
tags.safety_override = false

[[combo]]
path = "jest --watch"
translation = "Run tests related to changed files and continuously re-run them whenever source files change."
verdict = "allow"
rationale = "Long-lived development mode that provides fast feedback on code changes."
tags.scope = "local"
tags.effect = ["read", "execute"]
tags.reversibility = "trivial"
tags.target = ["process", "filesystem"]
tags.safety_override = false
