# tools/sed.toml

[[command]]
path = "sed"
translation = "Find and replace text, or apply other editing rules, across lines of input."
verdict = "allow"
rationale = "By default, outputs transformed text to the terminal without modifying the original file."

[[flag]]
applies_to = "sed"
flag = "-i"
translation_modifier = "editing each file directly on disk instead of printing to the terminal"
verdict = "require_approval"
rationale = "Overwrites the original file in place; without a backup extension, the original content is permanently lost."

[[flag]]
applies_to = "sed"
flag = "-I"
translation_modifier = "editing files directly on disk while treating all files as one continuous stream"
verdict = "require_approval"
rationale = "Overwrites files in place with shared line numbering and address ranges across files, which can produce unexpected changes in multi-file edits."

[[flag]]
applies_to = "sed"
flag = "-e"
translation_modifier = "applying a specified editing command"
verdict = "allow"
rationale = "Specifies which transformation to run; output goes to the terminal by default."

[[flag]]
applies_to = "sed"
flag = "-f"
translation_modifier = "reading editing commands from a file"
verdict = "allow"
rationale = "Loads editing instructions from a script file; does not change whether the input is modified."

[[flag]]
applies_to = "sed"
flag = "-n"
translation_modifier = "suppressing automatic output of each line"
verdict = "allow"
rationale = "Only prints lines that are explicitly selected; does not modify any files."

[[flag]]
applies_to = "sed"
flag = "-E"
translation_modifier = "using extended regular expression syntax"
verdict = "allow"
rationale = "Changes which pattern syntax is accepted; does not affect whether files are modified."

[[flag]]
applies_to = "sed"
flag = "-r"
translation_modifier = "using extended regular expression syntax"
verdict = "allow"
rationale = "GNU-compatible alias for -E; does not affect whether files are modified."

[[flag]]
applies_to = "sed"
flag = "-a"
translation_modifier = "delaying the creation of output files until a write command actually matches"
verdict = "allow"
rationale = "Prevents premature creation or truncation of output files used by the 'w' function; a safety improvement over the default behavior."

[[flag]]
applies_to = "sed"
flag = "-l"
translation_modifier = "using line-buffered output"
verdict = "allow"
rationale = "Changes buffering behavior; does not affect whether files are modified."

[[flag]]
applies_to = "sed"
flag = "-u"
translation_modifier = "using unbuffered output"
verdict = "allow"
rationale = "Disables output buffering for real-time processing; does not affect whether files are modified."
