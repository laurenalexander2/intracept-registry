# tools/df.toml

[[command]]
path = "df"
translation = "Show how much disk space is free on each mounted storage volume."
verdict = "allow"
rationale = "Read-only display of disk usage statistics that does not modify anything."

[[flag]]
applies_to = "df"
flag = "-h"
translation_modifier = ""
verdict = "allow"
rationale = "Displays sizes in human-readable units like megabytes and gigabytes; still read-only."

[[flag]]
applies_to = "df"
flag = "-H"
translation_modifier = ""
verdict = "allow"
rationale = "Displays sizes in human-readable units using powers of 1000; still read-only."

[[flag]]
applies_to = "df"
flag = "-a"
translation_modifier = "including all mounted volumes, even hidden system ones"
verdict = "allow"
rationale = "Shows additional mount points that are normally hidden; still read-only."

[[flag]]
applies_to = "df"
flag = "-i"
translation_modifier = "including counts of used and free file slots"
verdict = "allow"
rationale = "Adds file-slot usage statistics to the output; still read-only."

[[flag]]
applies_to = "df"
flag = "-l"
translation_modifier = "showing only locally attached storage volumes"
verdict = "allow"
rationale = "Filters out network-mounted volumes; still read-only."

[[flag]]
applies_to = "df"
flag = "-T"
translation_modifier = "showing only volumes of a specified type"
verdict = "allow"
rationale = "Filters output to specific volume types; still read-only."

[[flag]]
applies_to = "df"
flag = "-k"
translation_modifier = ""
verdict = "allow"
rationale = "Shows sizes in kilobyte blocks; still read-only."

[[flag]]
applies_to = "df"
flag = "-c"
translation_modifier = "showing a grand total across all volumes"
verdict = "allow"
rationale = "Adds a summary total row to the output; still read-only."

[[flag]]
applies_to = "df"
flag = "-Y"
translation_modifier = ""
verdict = "allow"
rationale = "Adds a column showing each volume's storage type; still read-only."
