# tools/chown.toml

[[command]]
path = "chown"
translation = "Change the owner and group of files or directories."
verdict = "allow"
rationale = "Modifies file ownership, which affects who can read, write, or execute the files."

[[flag]]
applies_to = "chown"
flag = "-R"
translation_modifier = "recursively through all subdirectories"
verdict = "require_approval"
rationale = "Applies ownership changes to an entire directory tree, greatly increasing the blast radius."

[[flag]]
applies_to = "chown"
flag = "-f"
translation_modifier = "suppressing error messages for files that cannot be changed"
verdict = "allow"
rationale = "Silences errors but does not change what ownership is modified."

[[flag]]
applies_to = "chown"
flag = "-v"
translation_modifier = "showing each file as its ownership is changed"
verdict = "allow"
rationale = "Adds verbose output without changing what ownership is modified."

[[flag]]
applies_to = "chown"
flag = "-h"
translation_modifier = "changing the ownership of the symbolic link itself instead of its target"
verdict = "allow"
rationale = "Targets the link rather than the linked file; a narrow scope change."

[[flag]]
applies_to = "chown"
flag = "-H"
translation_modifier = "following symbolic links on the command line but not in subdirectories"
verdict = "allow"
rationale = "Causes ownership changes to affect the targets of explicitly named symbolic links when used with -R."

[[flag]]
applies_to = "chown"
flag = "-L"
translation_modifier = "following all symbolic links during recursive traversal"
verdict = "require_approval"
rationale = "When combined with -R, ownership changes can reach files outside the intended directory tree via symbolic links."

[[flag]]
applies_to = "chown"
flag = "-P"
translation_modifier = "without following any symbolic links during recursive traversal"
verdict = "allow"
rationale = "The default behavior with -R; avoids reaching files outside the directory tree."

[[flag]]
applies_to = "chown"
flag = "-n"
translation_modifier = "interpreting owner and group as numeric IDs instead of names"
verdict = "allow"
rationale = "Changes how the owner and group arguments are parsed but does not affect scope."

[[flag]]
applies_to = "chown"
flag = "-x"
translation_modifier = "without crossing filesystem mount points"
verdict = "allow"
rationale = "Limits the scope of recursive traversal to the current filesystem."
