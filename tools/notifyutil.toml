# tools/notifyutil.toml — macOS notification utility

[[command]]
path = "notifyutil"
translation = "Post, monitor, or inspect macOS system notifications and their state values."
verdict = "allow"
rationale = "Interacts with the notification system for debugging; does not modify files or services."

[[flag]]
applies_to = "notifyutil"
flag = "-p"
translation_modifier = "posting a notification for a specified key"
verdict = "allow"
rationale = "Sends a notification event; may trigger registered listeners."

[[flag]]
applies_to = "notifyutil"
flag = "-w"
translation_modifier = "waiting and watching for notifications on a specified key"
verdict = "allow"
rationale = "Read-only monitoring of notification events."

[[flag]]
applies_to = "notifyutil"
flag = "-g"
translation_modifier = "getting the current state value for a specified key"
verdict = "allow"
rationale = "Read-only retrieval of a notification state value."

[[flag]]
applies_to = "notifyutil"
flag = "-s"
translation_modifier = "setting the state value for a specified key"
verdict = "allow"
rationale = "Sets a notification state value; only affects the notification system, not files or services."
