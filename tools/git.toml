# ── Combos ───────────────────────────────────────────────────────────────────
arity = "Boolean"


[[combo]]
path = "git push --force"
translation = "Force-upload local commits to a remote repository, overwriting its history even if other contributors have pushed since."
verdict = "ask"
rationale = "Rewrites the remote branch's commit history, which can permanently discard other contributors' work."
risk_class = "destructive"

[[combo]]
path = "git push --force-with-lease"
translation = "Upload local commits to a remote repository, overwriting its history only if no one else has pushed since your last fetch."
verdict = "ask"
rationale = "Safer than --force but still rewrites remote history; fails if the remote has diverged since your last fetch."
risk_class = "destructive"

[[combo]]
path = "git push --dry-run"
translation = "Simulate uploading local commits to a remote repository without actually sending any data."
verdict = "allow"
rationale = "No data is transmitted; only shows what would happen."
risk_class = "net_egress"

[[combo]]
path = "git push --force --no-verify"
translation = "Force-upload local commits to a remote repository, overwriting its history and skipping all pre-push hooks."
verdict = "ask"
rationale = "Combines history rewriting with hook bypass, removing both the remote safety net and local pre-push checks."
risk_class = "priv_esc"

[[combo]]
path = "git reset --hard"
translation = "Discard all uncommitted changes and move the current branch to a specified commit, permanently erasing staged and working-directory modifications."
verdict = "ask"
rationale = "Permanently deletes uncommitted work with no built-in recovery mechanism."
risk_class = "destructive"

[[combo]]
path = "git reset --soft"
translation = "Move the current branch pointer to a specified commit while keeping all changes staged for a new commit."
verdict = "allow"
rationale = "Only moves the branch pointer; all file contents remain intact in the staging area."
risk_class = "destructive"

[[combo]]
path = "git clean -f"
translation = "Permanently delete all untracked files from the working directory."
verdict = "ask"
rationale = "Untracked files are not stored in Git history and cannot be recovered once deleted."
risk_class = "destructive"

[[combo]]
path = "git clean -d -f"
translation = "Permanently delete all untracked files and directories from the working directory."
verdict = "ask"
rationale = "Extends deletion to entire untracked directory trees, increasing the scope of irrecoverable data loss."
risk_class = "destructive"

[[combo]]
path = "git checkout --force"
translation = "Switch branches or restore files, discarding all uncommitted local changes without warning."
verdict = "ask"
rationale = "Permanently throws away uncommitted work in the working tree without confirmation."
risk_class = "destructive"

[[combo]]
path = "git add --all"
translation = "Stage every change in the entire working tree — new files, modifications, and deletions."
verdict = "allow"
rationale = "May unintentionally stage files the user did not mean to include, such as secrets or build artifacts, but only affects the staging area."
risk_class = "safe"

[[combo]]
path = "git rm --force"
translation = "Remove files from both the working directory and the repository index, even if they have uncommitted changes."
verdict = "ask"
rationale = "Deletes files with unstaged or staged modifications that may not be recoverable from Git history."
risk_class = "destructive"

[[combo]]
path = "git stash drop"
translation = "Permanently delete a stash entry, discarding the saved changes with no way to recover them."
verdict = "allow"
rationale = "The stash entry is permanently removed; recovery is only possible via reflog before garbage collection."
risk_class = "destructive"
