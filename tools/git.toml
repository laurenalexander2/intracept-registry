arity = "Boolean"


[[command]]
path = "git status"
translation = "Show which files have been modified, staged, or are untracked in the working tree."
verdict = "allow"
rationale = "Read-only display of working tree state."
risk_class = "safe"

[[command]]
path = "git show"
translation = "Display the details and content changes of a specific commit."
verdict = "allow"
rationale = "Read-only display of commit data."
risk_class = "safe"

[[command]]
path = "git blame"
translation = "Show which commit and author last modified each line of a file."
verdict = "allow"
rationale = "Read-only annotation of file history."
risk_class = "safe"

[[command]]
path = "git grep"
translation = "Search for a text pattern in tracked files."
verdict = "allow"
rationale = "Read-only search that does not modify files."
risk_class = "safe"

[[command]]
path = "git stash show"
translation = "Show a summary of changes in a stash entry."
verdict = "allow"
rationale = "Read-only display of stash contents."
