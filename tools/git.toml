# exemplars/git.toml — flagship exemplar for the intracept-registry

# ── Base command ──────────────────────────────────────────────────────────────

[[command]]
path = "git"
translation = "Run the Git version control system."
verdict = "allow"
rationale = "The bare command prints help text and modifies nothing."
# ── Working area ──────────────────────────────────────────────────────────────
risk_class = "safe"


[[command]]
path = "git init"
translation = "Create a new empty Git repository in the current directory."
verdict = "allow"
rationale = "Creates a .git directory; safe to run in an existing repo without data loss."
risk_class = "safe"

[[command]]
path = "git clone"
translation = "Download a remote repository and create a local copy."
verdict = "allow"
rationale = "Creates a new directory; does not modify any existing files."
risk_class = "net_egress"

[[command]]
path = "git add"
translation = "Stage file changes for the next commit."
verdict = "allow"
rationale = "Only updates the staging area; no committed data is changed."
risk_class = "safe"

[[flag]]
applies_to = "git add"
flag = "--all"
translation_modifier = "including all modified, deleted, and new files in the entire repository"
verdict = "allow"
rationale = "May unintentionally stage files the user did not mean to include, such as secrets or build artifacts."
arity = "Boolean"

[[flag]]
applies_to = "git add"
flag = "-A"
translation_modifier = "including all modified, deleted, and new files in the entire repository"
verdict = "allow"
rationale = "Alias for --all; may unintentionally stage files the user did not mean to include."
arity = "Boolean"

[[flag]]
applies_to = "git add"
flag = "--force"
translation_modifier = "including files that are normally ignored by .gitignore"
verdict = "allow"
rationale = "Bypasses .gitignore rules, which may cause secrets or build artifacts to be tracked."
arity = "Boolean"

[[flag]]
applies_to = "git add"
flag = "--patch"
translation_modifier = "interactively choosing individual hunks to stage"
verdict = "allow"
rationale = "Gives fine-grained control over what is staged; reduces accidental inclusion."
arity = "Boolean"

[[flag]]
applies_to = "git add"
flag = "--dry-run"
translation_modifier = "simulating the operation without actually staging anything"
verdict = "allow"
rationale = "No changes are made; only shows what would be staged."
arity = "Boolean"

[[flag]]
applies_to = "git add"
flag = "--update"
translation_modifier = "only for files already tracked by Git"
verdict = "allow"
rationale = "Limits scope to tracked files; will not add new untracked files."
# ── Committing ────────────────────────────────────────────────────────────────
arity = "Boolean"


[[command]]
path = "git commit"
translation = "Save the staged changes as a new commit in the repository history."
verdict = "allow"
rationale = "Creates a local commit that can be amended or reset; does not affect the remote."
risk_class = "safe"

[[flag]]
applies_to = "git commit"
flag = "--amend"
translation_modifier = "replacing the most recent commit instead of creating a new one"
verdict = "allow"
rationale = "Rewrites the last commit; dangerous if that commit has already been pushed to a shared branch."
arity = "Boolean"

[[flag]]
applies_to = "git commit"
flag = "--no-verify"
translation_modifier = "skipping all pre-commit and commit-msg hook checks"
verdict = "allow"
rationale = "Bypasses safety hooks that may enforce linting, tests, or secret detection."
arity = "Boolean"
risk_class_override = "priv_esc"

[[flag]]
applies_to = "git commit"
flag = "--all"
translation_modifier = "automatically staging all modified and deleted tracked files before committing"
verdict = "allow"
rationale = "May commit changes the user did not intend to include."
# ── Remote operations ─────────────────────────────────────────────────────────
arity = "Boolean"


[[command]]
path = "git push"
translation = "Upload local commits to a remote repository."
verdict = "ask"
rationale = "Publishes local changes to a shared remote; incorrect pushes can disrupt collaborators."
risk_class = "net_egress"

[[flag]]
applies_to = "git push"
flag = "--force"
translation_modifier = "overwriting remote history"
verdict = "ask"
rationale = "Rewrites the remote branch's commit history, which can permanently discard other contributors' work."
arity = "Boolean"
risk_class_override = "destructive"

[[flag]]
applies_to = "git push"
flag = "--force-with-lease"
translation_modifier = "overwriting remote history only if no one else has pushed"
verdict = "ask"
rationale = "Safer than --force but still rewrites history; fails if the remote has diverged."
arity = "Boolean"
risk_class_override = "destructive"

[[flag]]
applies_to = "git push"
flag = "--delete"
translation_modifier = "deleting the specified branch or tag on the remote"
verdict = "ask"
rationale = "Permanently removes a remote ref, which may disrupt other contributors' workflows."
arity = "Boolean"

[[flag]]
applies_to = "git push"
flag = "--all"
translation_modifier = "pushing all local branches to the remote"
verdict = "allow"
rationale = "May push branches that were not intended to be shared."
arity = "Boolean"

[[flag]]
applies_to = "git push"
flag = "--tags"
translation_modifier = "including all local tags"
verdict = "allow"
rationale = "Publishes all tags, including ones that may not be ready for release."
arity = "Boolean"

[[flag]]
applies_to = "git push"
flag = "--no-verify"
translation_modifier = "skipping the pre-push hook checks"
verdict = "allow"
rationale = "Bypasses pre-push hooks that may enforce CI checks or branch protections."
arity = "Boolean"
risk_class_override = "priv_esc"

[[flag]]
applies_to = "git push"
flag = "--dry-run"
translation_modifier = "simulating the push without actually sending data"
verdict = "allow"
rationale = "No data is transmitted; only shows what would happen."
arity = "Boolean"

[[flag]]
applies_to = "git push"
flag = "--prune"
translation_modifier = "deleting remote branches that no longer exist locally"
verdict = "allow"
rationale = "Only removes remote refs the user has already deleted locally; the intent is explicit cleanup."
arity = "Boolean"

[[flag]]
applies_to = "git push"
flag = "--mirror"
translation_modifier = "making the remote an exact mirror of the local repository, deleting all non-matching refs"
verdict = "ask"
rationale = "Destructively overwrites the entire remote to match local state, removing branches, tags, and history."
arity = "Boolean"
risk_class_override = "destructive"

[[command]]
path = "git pull"
translation = "Download changes from a remote repository and merge them into the current branch."
verdict = "allow"
rationale = "Modifies the working tree and branch history; can introduce merge conflicts."
risk_class = "net_egress"

[[flag]]
applies_to = "git pull"
flag = "--rebase"
translation_modifier = "replaying local commits on top of the remote changes instead of merging"
verdict = "allow"
rationale = "Rewrites local commit hashes, which can cause issues if those commits were already shared."
arity = "Boolean"

[[flag]]
applies_to = "git pull"
flag = "--force"
translation_modifier = "overwriting local tracking refs even when they are not ancestors"
verdict = "ask"
rationale = "Forces reference updates that may discard local-only changes or cause unexpected history changes."
arity = "Boolean"
risk_class_override = "destructive"

[[command]]
path = "git fetch"
translation = "Download new commits and branch information from a remote repository without modifying local branches."
verdict = "allow"
rationale = "Only updates remote-tracking references; the working tree and local branches are unchanged."
risk_class = "net_egress"

[[flag]]
applies_to = "git fetch"
flag = "--all"
translation_modifier = "from all configured remotes"
verdict = "allow"
rationale = "Fetches from every remote but still does not modify local branches."
arity = "Boolean"

[[flag]]
applies_to = "git fetch"
flag = "--prune"
translation_modifier = "removing local remote-tracking branches that no longer exist on the remote"
verdict = "allow"
rationale = "Cleans up stale tracking refs; does not affect local branches or uncommitted work."
arity = "Boolean"

[[flag]]
applies_to = "git fetch"
flag = "--force"
translation_modifier = "overwriting local refs even if the update is not a fast-forward"
verdict = "allow"
rationale = "Allows non-fast-forward ref updates which could cause confusion about remote history."
arity = "Boolean"
risk_class_override = "destructive"

[[command]]
path = "git remote"
translation = "List the remote repositories connected to this repository."
verdict = "allow"
rationale = "Read-only listing of configured remotes."
risk_class = "safe"

[[command]]
path = "git remote add"
translation = "Register a new remote repository under a given name."
verdict = "allow"
rationale = "Adds a configuration entry; does not transfer any data."
risk_class = "safe"

[[command]]
path = "git remote remove"
translation = "Unregister a remote repository and delete its tracking branches."
verdict = "allow"
rationale = "Removes the remote configuration and all associated remote-tracking refs."
# ── Branching and switching ───────────────────────────────────────────────────
risk_class = "safe"


[[command]]
path = "git branch"
translation = "List, create, or manage branches."
verdict = "allow"
rationale = "Without flags, lists branches; creating a branch is trivially reversible."
risk_class = "safe"

[[flag]]
applies_to = "git branch"
flag = "-d"
translation_modifier = "deleting a branch that has been fully merged"
verdict = "allow"
rationale = "Deletes a merged branch; the commits remain reachable but the branch name is lost."
arity = "Boolean"

[[flag]]
applies_to = "git branch"
flag = "-D"
translation_modifier = "forcefully deleting a branch even if it has unmerged commits"
verdict = "ask"
rationale = "Deletes a branch regardless of merge status; unmerged commits may become unreachable."
arity = "Boolean"
risk_class_override = "destructive"

[[flag]]
applies_to = "git branch"
flag = "--force"
translation_modifier = "resetting the branch pointer even if the branch already exists"
verdict = "allow"
rationale = "Moves an existing branch to a new commit, discarding its previous position."
arity = "Boolean"
risk_class_override = "destructive"

[[flag]]
applies_to = "git branch"
flag = "--all"
translation_modifier = "including both local and remote-tracking branches"
verdict = "allow"
rationale = "Only affects the listing display; no branches are modified."
arity = "Boolean"

[[command]]
path = "git checkout"
translation = "Switch branches or restore files in the working tree."
verdict = "allow"
rationale = "Modifies the working tree; uncommitted changes on conflicting paths may be overwritten."
risk_class = "safe"

[[flag]]
applies_to = "git checkout"
flag = "--force"
translation_modifier = "discarding any uncommitted local changes that conflict"
verdict = "ask"
rationale = "Permanently throws away uncommitted work in the working tree without confirmation."
arity = "Boolean"
risk_class_override = "destructive"

[[flag]]
applies_to = "git checkout"
flag = "-b"
translation_modifier = "creating a new branch at the current commit"
verdict = "allow"
rationale = "Creates a new branch and switches to it; fully reversible."
# ── Merging and rebasing ─────────────────────────────────────────────────────
arity = "Boolean"


[[command]]
path = "git merge"
translation = "Combine another branch's changes into the current branch."
verdict = "allow"
rationale = "Modifies the current branch and working tree; can produce merge conflicts."
risk_class = "safe"

[[flag]]
applies_to = "git merge"
flag = "--no-commit"
translation_modifier = "without automatically creating a merge commit"
verdict = "allow"
rationale = "Gives the user a chance to inspect the merge result before committing."
arity = "Boolean"

[[flag]]
applies_to = "git merge"
flag = "--squash"
translation_modifier = "squashing all incoming commits into a single set of changes without a merge commit"
verdict = "allow"
rationale = "Discards individual commit history from the merged branch."
arity = "Boolean"

[[flag]]
applies_to = "git merge"
flag = "--abort"
translation_modifier = "aborting the current merge and restoring the previous state"
verdict = "allow"
rationale = "Safely cancels a merge in progress and returns to the pre-merge state."
arity = "Boolean"

[[flag]]
applies_to = "git merge"
flag = "--no-verify"
translation_modifier = "skipping the pre-merge and commit-msg hook checks"
verdict = "allow"
rationale = "Bypasses safety hooks that may enforce code quality or policy."
arity = "Boolean"
risk_class_override = "priv_esc"

[[command]]
path = "git rebase"
translation = "Reapply commits from the current branch onto a different base commit."
verdict = "allow"
rationale = "Rewrites commit history; can cause data loss if used on shared branches."
risk_class = "safe"

[[flag]]
applies_to = "git rebase"
flag = "--interactive"
translation_modifier = "allowing individual commits to be reordered, edited, squashed, or dropped"
verdict = "allow"
rationale = "Gives more control over the rebase than the default; the risk of history rewriting is already in the base command."
arity = "Boolean"

[[flag]]
applies_to = "git rebase"
flag = "--abort"
translation_modifier = "aborting the rebase and restoring the branch to its original state"
verdict = "allow"
rationale = "Safely cancels a rebase in progress; no commits are lost."
arity = "Boolean"

[[flag]]
applies_to = "git rebase"
flag = "--continue"
translation_modifier = "continuing after resolving conflicts in the current step"
verdict = "allow"
rationale = "Proceeds with the rebase; the user should verify conflict resolutions are correct."
arity = "Boolean"

[[flag]]
applies_to = "git rebase"
flag = "--force-rebase"
translation_modifier = "rewriting all commits even if they could be fast-forwarded"
verdict = "allow"
rationale = "Creates new commit hashes unnecessarily, but does not add destructive capability beyond what rebase already does."
# ── Resetting and reverting ──────────────────────────────────────────────────
arity = "Boolean"


[[command]]
path = "git reset"
translation = "Move the current branch pointer to a different commit."
verdict = "allow"
rationale = "Changes which commit the branch points to; can unstage changes or rewrite local history."
risk_class = "destructive"

[[flag]]
applies_to = "git reset"
flag = "--soft"
translation_modifier = "keeping all changes staged for commit"
verdict = "allow"
rationale = "Only moves the branch pointer; staged and working tree files are untouched."
arity = "Boolean"

[[flag]]
applies_to = "git reset"
flag = "--mixed"
translation_modifier = "unstaging changes but keeping them in the working directory"
verdict = "allow"
rationale = "Default mode; preserves working tree changes while resetting the staging area."
arity = "Boolean"

[[flag]]
applies_to = "git reset"
flag = "--hard"
translation_modifier = "discarding all uncommitted changes in the working directory"
verdict = "ask"
rationale = "Permanently deletes uncommitted work with no built-in recovery mechanism."
arity = "Boolean"

[[command]]
path = "git revert"
translation = "Create a new commit that undoes the changes from a previous commit."
verdict = "allow"
rationale = "Modifies the branch by adding a new commit; safe because it does not rewrite history."
risk_class = "safe"

[[flag]]
applies_to = "git revert"
flag = "--no-commit"
translation_modifier = "applying the revert to the working tree without creating a commit"
verdict = "allow"
rationale = "Lets the user inspect the reverted changes before committing."
arity = "Boolean"

[[flag]]
applies_to = "git revert"
flag = "--abort"
translation_modifier = "aborting the revert and restoring the previous state"
verdict = "allow"
rationale = "Safely cancels a revert in progress."
arity = "Boolean"

[[command]]
path = "git cherry-pick"
translation = "Apply the changes from a specific commit onto the current branch."
verdict = "allow"
rationale = "Creates a new commit on the current branch; may produce conflicts."
risk_class = "safe"

[[flag]]
applies_to = "git cherry-pick"
flag = "--no-commit"
translation_modifier = "applying the changes to the working tree without creating a commit"
verdict = "allow"
rationale = "Lets the user inspect the result before committing."
arity = "Boolean"

[[flag]]
applies_to = "git cherry-pick"
flag = "--abort"
translation_modifier = "aborting the cherry-pick and restoring the previous state"
verdict = "allow"
rationale = "Safely cancels a cherry-pick in progress."
# ── Stashing ─────────────────────────────────────────────────────────────────
arity = "Boolean"


[[command]]
path = "git stash"
translation = "Temporarily save uncommitted changes and revert the working tree to a clean state."
verdict = "allow"
rationale = "Changes are stored in the stash and can be reapplied later."
risk_class = "safe"

[[command]]
path = "git stash pop"
translation = "Reapply the most recently stashed changes and remove them from the stash."
verdict = "allow"
rationale = "Modifies the working tree; the stash entry is deleted if applied cleanly, making it harder to retry."
risk_class = "safe"

[[command]]
path = "git stash drop"
translation = "Delete a specific entry from the stash."
verdict = "allow"
rationale = "Permanently removes stashed changes; they cannot be easily recovered."
risk_class = "destructive"

[[command]]
path = "git stash clear"
translation = "Delete all entries from the stash."
verdict = "allow"
rationale = "Permanently removes all stashed changes, but stash is local-only and entries are recoverable from reflog with effort."
risk_class = "destructive"

[[command]]
path = "git stash list"
translation = "List all stashed change sets."
verdict = "allow"
rationale = "Read-only display of stash entries."
risk_class = "safe"

[[command]]
path = "git stash apply"
translation = "Reapply the most recently stashed changes without removing them from the stash."
verdict = "allow"
rationale = "Modifies the working tree but keeps the stash entry intact for later use."
risk_class = "safe"

[[flag]]
applies_to = "git stash"
flag = "--include-untracked"
translation_modifier = "also saving untracked files"
verdict = "allow"
rationale = "Extends the stash to include untracked files; more comprehensive but still reversible."
arity = "Boolean"

[[flag]]
applies_to = "git stash"
flag = "--all"
translation_modifier = "also saving untracked and ignored files"
verdict = "allow"
rationale = "Includes ignored files like build artifacts; the clean step may remove files the user expected to keep."
# ── History and inspection ────────────────────────────────────────────────────
arity = "Boolean"


[[command]]
path = "git log"
translation = "Show the commit history."
verdict = "allow"
rationale = "Read-only display of commit history."
risk_class = "safe"

[[command]]
path = "git diff"
translation = "Show the differences between files or commits."
verdict = "allow"
rationale = "Read-only comparison that modifies nothing."
risk_class = "safe"

[[command]]
path = "git reflog"
translation = "Show a log of every position the branch pointer has been moved to in the local repository."
verdict = "allow"
rationale = "Read-only display useful for recovering lost commits."
risk_class = "safe"

[[command]]
path = "git bisect"
translation = "Use binary search to find the commit that introduced a bug."
verdict = "allow"
rationale = "Navigates history by checking out commits; the original branch is restored with bisect reset."
# ── Removing and moving files ────────────────────────────────────────────────
risk_class = "safe"


[[command]]
path = "git rm"
translation = "Remove files from the working tree and the staging area."
verdict = "allow"
rationale = "Deletes files from disk and stages the removal; recoverable from committed history."
risk_class = "destructive"

[[flag]]
applies_to = "git rm"
flag = "--force"
translation_modifier = "even if the file has uncommitted changes"
verdict = "ask"
rationale = "Deletes files with unstaged or staged modifications that may not be recoverable."
arity = "Boolean"
risk_class_override = "destructive"

[[flag]]
applies_to = "git rm"
flag = "--cached"
translation_modifier = "only removing the file from the staging area while keeping it on disk"
verdict = "allow"
rationale = "Untracks the file without deleting it from the working tree."
arity = "Boolean"

[[flag]]
applies_to = "git rm"
flag = "-r"
translation_modifier = "recursively through all subdirectories"
verdict = "allow"
rationale = "Removes all matching files in subdirectories, increasing the blast radius."
arity = "Boolean"

[[command]]
path = "git mv"
translation = "Move or rename a tracked file, directory, or symbolic link."
verdict = "allow"
rationale = "Renames files in the working tree and staging area; fully reversible."
risk_class = "safe"

[[flag]]
applies_to = "git mv"
flag = "--force"
translation_modifier = "overwriting the destination even if it already exists"
verdict = "allow"
rationale = "Silently overwrites an existing file at the destination path."
# ── Cleaning ─────────────────────────────────────────────────────────────────
arity = "Boolean"
risk_class_override = "destructive"


[[command]]
path = "git clean"
translation = "Remove untracked files from the working tree."
verdict = "ask"
rationale = "Permanently deletes files that are not tracked by Git; no built-in recovery."
risk_class = "destructive"

[[flag]]
applies_to = "git clean"
flag = "-f"
translation_modifier = "proceeding with the actual deletion"
verdict = "ask"
rationale = "Required for git clean to execute; without it the command refuses to run. Risk matches the base command."
arity = "Boolean"

[[flag]]
applies_to = "git clean"
flag = "-d"
translation_modifier = "including untracked directories"
verdict = "ask"
rationale = "Extends deletion to entire directory trees, increasing the scope of data loss."
arity = "Boolean"

[[flag]]
applies_to = "git clean"
flag = "-x"
translation_modifier = "including files normally excluded by .gitignore"
verdict = "ask"
rationale = "Deletes ignored files such as build outputs, IDE configs, and environment files that may be irreplaceable."
arity = "Boolean"
risk_class_override = "destructive"

[[flag]]
applies_to = "git clean"
flag = "-X"
translation_modifier = "only removing files excluded by .gitignore"
verdict = "ask"
rationale = "Targets ignored files specifically, which may include build caches or local configuration."
arity = "Boolean"

[[flag]]
applies_to = "git clean"
flag = "-n"
translation_modifier = "simulating the operation without actually deleting anything"
verdict = "allow"
rationale = "Dry-run mode; only shows what would be removed."
arity = "Boolean"

[[flag]]
applies_to = "git clean"
flag = "-i"
translation_modifier = "interactively selecting which files to delete"
verdict = "allow"
rationale = "Gives the user per-file control, reducing the risk of accidental deletion."
# ── Tags ─────────────────────────────────────────────────────────────────────
arity = "Boolean"


[[command]]
path = "git tag"
translation = "Create, list, or manage tags that mark specific commits."
verdict = "allow"
rationale = "Creating or listing tags is trivially reversible and does not modify branch history."
risk_class = "safe"

[[flag]]
applies_to = "git tag"
flag = "-d"
translation_modifier = "deleting a local tag"
verdict = "allow"
rationale = "Removes the tag locally; the tag can be recreated if the commit hash is known."
arity = "Boolean"

[[flag]]
applies_to = "git tag"
flag = "-f"
translation_modifier = "overwriting an existing tag with the same name"
verdict = "allow"
rationale = "Silently moves a tag to a different commit, which can cause confusion for collaborators."
# ── Submodules ───────────────────────────────────────────────────────────────
arity = "Boolean"
risk_class_override = "destructive"


[[command]]
path = "git submodule"
translation = "Inspect the status of submodules in this repository."
verdict = "allow"
rationale = "Without arguments, shows submodule status; read-only operation."
risk_class = "safe"

[[command]]
path = "git submodule add"
translation = "Register a new submodule and clone it into the working tree."
verdict = "allow"
rationale = "Adds a new dependency; does not modify existing code."
risk_class = "net_egress"

[[command]]
path = "git submodule update"
translation = "Update submodules to the commit recorded in the parent repository."
verdict = "allow"
rationale = "Checks out specific commits in submodules, modifying their working trees."
risk_class = "net_egress"

[[command]]
path = "git submodule deinit"
translation = "Unregister submodules and remove their working tree contents."
verdict = "allow"
rationale = "Removes submodule working tree data; can be re-initialized later."
risk_class = "destructive"

[[flag]]
applies_to = "git submodule deinit"
flag = "--force"
translation_modifier = "even if the submodule has local modifications"
verdict = "ask"
rationale = "Discards local changes in the submodule working tree without confirmation."
arity = "Boolean"
risk_class_override = "destructive"

[[flag]]
applies_to = "git submodule deinit"
flag = "--all"
translation_modifier = "unregistering every submodule in the repository"
verdict = "ask"
rationale = "Removes working tree data for all submodules at once."
arity = "Boolean"

[[flag]]
applies_to = "git submodule update"
flag = "--recursive"
translation_modifier = "including nested submodules at all levels"
verdict = "allow"
rationale = "Extends the update to nested submodules, increasing the scope of changes."
# ── Worktrees ────────────────────────────────────────────────────────────────
arity = "Boolean"


[[command]]
path = "git worktree add"
translation = "Create a new working tree linked to this repository at a different path."
verdict = "allow"
rationale = "Creates a new directory; does not affect the existing working tree."
risk_class = "safe"

[[command]]
path = "git worktree list"
translation = "List all working trees linked to this repository."
verdict = "allow"
rationale = "Read-only listing of worktrees."
risk_class = "safe"

[[command]]
path = "git worktree remove"
translation = "Delete a linked working tree and its administrative files."
verdict = "allow"
rationale = "Removes a working tree directory; uncommitted changes in it will be lost."
risk_class = "destructive"

[[flag]]
applies_to = "git worktree remove"
flag = "--force"
translation_modifier = "even if the working tree has uncommitted changes"
verdict = "ask"
rationale = "Deletes the working tree without checking for uncommitted work."
arity = "Boolean"
risk_class_override = "destructive"

[[command]]
path = "git worktree prune"
translation = "Remove stale working tree administrative data."
verdict = "allow"
rationale = "Cleans up metadata for worktrees that have already been deleted from disk."
# ── Patching ─────────────────────────────────────────────────────────────────
risk_class = "safe"


[[command]]
path = "git am"
translation = "Apply a series of patches from email-formatted files to the current branch."
verdict = "allow"
rationale = "Creates new commits on the current branch; may produce conflicts."
risk_class = "safe"

[[flag]]
applies_to = "git am"
flag = "--no-verify"
translation_modifier = "skipping pre-applypatch and applypatch-msg hook checks"
verdict = "allow"
rationale = "Bypasses safety hooks that may enforce code quality or policy."
arity = "Boolean"
risk_class_override = "priv_esc"

[[flag]]
applies_to = "git am"
flag = "--abort"
translation_modifier = "aborting the patch application and restoring the previous state"
verdict = "allow"
rationale = "Safely cancels the operation and returns to the pre-am state."
arity = "Boolean"

[[command]]
path = "git format-patch"
translation = "Generate patch files from commits for email-based review or sharing."
verdict = "allow"
rationale = "Creates files on disk; does not modify the repository."
# ── Maintenance ──────────────────────────────────────────────────────────────
risk_class = "safe"


[[command]]
path = "git gc"
translation = "Run housekeeping to compress repository data and remove unreachable objects."
verdict = "allow"
rationale = "Permanently deletes unreachable objects after the grace period, making some recovery operations impossible."
risk_class = "destructive"

[[flag]]
applies_to = "git gc"
flag = "--prune"
translation_modifier = "immediately expiring unreachable objects regardless of their age"
verdict = "ask"
rationale = "Removes all unreachable objects without waiting for the default grace period, eliminating recovery options."
arity = "Boolean"
risk_class_override = "destructive"

[[flag]]
applies_to = "git gc"
flag = "--aggressive"
translation_modifier = "spending extra time optimizing the repository more thoroughly"
verdict = "allow"
rationale = "More thorough repacking; safe but can take a very long time on large repositories."
# ── Modern branch and file commands ─────────────────────────────────────────
arity = "Boolean"


[[command]]
path = "git switch"
translation = "Switch to a different branch."
verdict = "allow"
rationale = "Moves to an existing branch; safer than checkout because it refuses to overwrite uncommitted changes by default."
risk_class = "safe"

[[flag]]
applies_to = "git switch"
flag = "-c"
translation_modifier = "creating a new branch at the current commit"
verdict = "allow"
rationale = "Creates a new branch and switches to it; fully reversible."
arity = "Boolean"

[[flag]]
applies_to = "git switch"
flag = "--discard-changes"
translation_modifier = "discarding all uncommitted local changes"
verdict = "ask"
rationale = "Permanently throws away uncommitted work in the working tree without confirmation."
arity = "Boolean"
risk_class_override = "destructive"

[[flag]]
applies_to = "git switch"
flag = "--force"
translation_modifier = "discarding all uncommitted local changes"
verdict = "ask"
rationale = "Alias for --discard-changes; permanently throws away uncommitted work."
arity = "Boolean"
risk_class_override = "destructive"

[[command]]
path = "git restore"
translation = "Restore files in the working tree to a previous state."
verdict = "allow"
rationale = "Overwrites working tree files with versions from another source; uncommitted changes to those files are lost."
risk_class = "safe"

[[flag]]
applies_to = "git restore"
flag = "--staged"
translation_modifier = "unstaging the files without modifying the working tree"
verdict = "allow"
rationale = "Only removes files from the staging area; working tree is untouched."
arity = "Boolean"

[[flag]]
applies_to = "git restore"
flag = "--source"
translation_modifier = "from a specific commit or branch instead of the staging area"
verdict = "allow"
rationale = "Replaces working tree files with content from an arbitrary commit."
arity = "Boolean"

[[flag]]
applies_to = "git restore"
flag = "--worktree"
translation_modifier = "overwriting the files in the working directory"
verdict = "allow"
rationale = "Replaces working tree files; uncommitted changes to those files are permanently lost."
# ── Configuration ───────────────────────────────────────────────────────────
arity = "Boolean"


[[command]]
path = "git config"
translation = "View or modify Git configuration settings."
verdict = "allow"
rationale = "Without arguments, prints help. Reading config values is read-only."
risk_class = "safe"

[[command]]
path = "git config --global"
translation = "View or modify Git configuration settings for all repositories on this machine."
verdict = "allow"
rationale = "Changes apply to every repository the user interacts with, not just the current one."
risk_class = "safe"

[[flag]]
applies_to = "git config"
flag = "--unset"
translation_modifier = "removing a configuration value"
verdict = "allow"
rationale = "Removes a single config entry; can be re-set with the same command."
arity = "Boolean"

[[flag]]
applies_to = "git config"
flag = "--unset-all"
translation_modifier = "removing all values for a configuration key"
verdict = "allow"
rationale = "Removes all entries for a multivalue key; may affect hooks, aliases, or remote configurations."
# ── Low-level ref manipulation ──────────────────────────────────────────────
arity = "Boolean"


[[command]]
path = "git update-ref"
translation = "Directly move a branch pointer or other reference to a different commit."
verdict = "ask"
rationale = "Low-level command that moves branch pointers without the safety checks of normal branch operations."
risk_class = "destructive"

[[flag]]
applies_to = "git update-ref"
flag = "-d"
translation_modifier = "deleting the reference entirely"
verdict = "ask"
rationale = "Removes the reference entirely, which may make commits unreachable."
