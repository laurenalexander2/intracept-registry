risk_class = "safe"


[[flag]]
applies_to = "git rebase"
flag = "--onto"
translation_modifier = "replaying commits onto a specified target commit instead of the upstream"
verdict = "allow"
rationale = "Gives more control over where commits are replayed; the risk of history rewriting is already in the base command."
arity = "Boolean"

[[flag]]
applies_to = "git clone"
flag = "--depth"
translation_modifier = "creating a shallow clone with only the specified number of recent commits"
verdict = "allow"
rationale = "Reduces download size; the clone is functional but has truncated history."
arity = "Boolean"

[[flag]]
applies_to = "git clone"
flag = "--branch"
translation_modifier = "checking out a specific branch or tag instead of the default"
verdict = "allow"
rationale = "Selects which branch to check out; does not affect existing files."
arity = "Boolean"

[[flag]]
applies_to = "git clone"
flag = "--recursive"
translation_modifier = "also cloning all submodules"
verdict = "allow"
rationale = "Downloads additional repositories; no existing data is modified."
arity = "Boolean"

[[flag]]
applies_to = "git log"
flag = "--oneline"
translation_modifier = ""
verdict = "allow"
rationale = "Changes output formatting to one line per commit; read-only operation."
arity = "Boolean"

[[flag]]
applies_to = "git log"
flag = "--graph"
translation_modifier = ""
verdict = "allow"
rationale = "Adds a visual branch graph to the output; read-only operation."
arity = "Boolean"

[[flag]]
applies_to = "git log"
flag = "--all"
translation_modifier = "including commits from all branches and refs"
verdict = "allow"
rationale = "Widens the log output to all branches; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "git diff"
flag = "--staged"
translation_modifier = "showing only changes that have been staged for commit"
verdict = "allow"
