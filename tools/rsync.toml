# tools/rsync.toml

[[command]]
path = "rsync"
translation = "Synchronize files and directories between two locations."
verdict = "ask"
rationale = "Copies and synchronizes files, potentially overwriting files at the destination."
risk_class = "novel"

[[flag]]
applies_to = "rsync"
flag = "-r"
translation_modifier = "recursively through all subdirectories"
verdict = "allow"
rationale = "Synchronizes entire directory trees, increasing the scope of files affected."
arity = "Boolean"

[[flag]]
applies_to = "rsync"
flag = "-a"
translation_modifier = "in archive mode, preserving permissions, timestamps, symbolic links, and recursing into directories"
verdict = "allow"
rationale = "Combines several options for full directory mirroring; commonly used but increases scope."
arity = "Boolean"

[[flag]]
applies_to = "rsync"
flag = "--delete"
translation_modifier = "removing files at the destination that do not exist at the source"
verdict = "ask"
rationale = "Deletes files on the destination that are not in the source, which can cause data loss."
arity = "Boolean"

[[flag]]
applies_to = "rsync"
flag = "--delete-before"
translation_modifier = "deleting destination files before transferring"
verdict = "ask"
rationale = "Removes destination files before the sync starts, risking data loss if the transfer is interrupted."
arity = "Boolean"

[[flag]]
applies_to = "rsync"
flag = "-n"
translation_modifier = "simulating the sync without actually transferring or deleting anything"
verdict = "allow"
rationale = "Dry-run mode; only shows what would happen."
arity = "Boolean"

[[flag]]
applies_to = "rsync"
flag = "--dry-run"
translation_modifier = "simulating the sync without actually transferring or deleting anything"
verdict = "allow"
rationale = "Dry-run mode; only shows what would happen."
arity = "Boolean"

[[flag]]
applies_to = "rsync"
flag = "-e"
translation_modifier = "using a specified remote shell program"
verdict = "allow"
rationale = "Changes the transport method; does not affect the sync behavior."
arity = "Boolean"

[[flag]]
applies_to = "rsync"
flag = "--exclude"
translation_modifier = "skipping files matching a specified pattern"
verdict = "allow"
rationale = "Reduces the scope of the sync; a filtering option."
arity = "Boolean"

[[flag]]
applies_to = "rsync"
flag = "-z"
translation_modifier = "compressing data during transfer"
verdict = "allow"
rationale = "Reduces bandwidth usage; does not change what is transferred."
arity = "Boolean"

[[flag]]
applies_to = "rsync"
flag = "-v"
translation_modifier = ""
verdict = "allow"
rationale = "Increases output verbosity; does not change the sync behavior."
arity = "Boolean"

[[flag]]
applies_to = "rsync"
flag = "--progress"
translation_modifier = ""
verdict = "allow"
rationale = "Shows transfer progress; does not change the sync behavior."
arity = "Boolean"

[[flag]]
applies_to = "rsync"
flag = "--force"
translation_modifier = "forcing deletion of non-empty directories at the destination"
verdict = "allow"
rationale = "Allows deletion of directories that still contain files not in the transfer set."
arity = "Boolean"
