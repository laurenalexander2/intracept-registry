# tools/size.toml

[[command]]
path = "size"
translation = "Print the size of sections in an Apple platform object file."
verdict = "allow"
rationale = "Read-only display of segment and section sizes; modifies nothing."

[[flag]]
applies_to = "size"
flag = "-m"
translation_modifier = "showing segment and section sizes individually"
verdict = "allow"
rationale = "Changes output detail level; no state modification."

[[flag]]
applies_to = "size"
flag = "-l"
translation_modifier = "including addresses and offsets of sections"
verdict = "allow"
rationale = "Adds detail to output; no state modification."

[[flag]]
applies_to = "size"
flag = "-x"
translation_modifier = "displaying values in hexadecimal"
verdict = "allow"
rationale = "Cosmetic output format change; no state modification."
