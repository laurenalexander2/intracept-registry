# tools/umount.toml

[[command]]
path = "umount"
translation = "Unmount a file system from the directory tree."
verdict = "allow"
rationale = "Makes a mounted volume inaccessible; data on the volume is preserved but processes using it may fail."

[[flag]]
applies_to = "umount"
flag = "-f"
translation_modifier = "forcibly unmounting even if the volume is in use"
verdict = "require_approval"
rationale = "Forces unmount which can cause data loss for processes with open files on the volume."
