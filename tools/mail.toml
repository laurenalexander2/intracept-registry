# tools/mail.toml

[[command]]
path = "mail"
translation = "Send and receive email messages from the command line."
verdict = "require_approval"
rationale = "Can send email to external recipients and modify local mailbox files."

[[flag]]
applies_to = "mail"
flag = "-s"
translation_modifier = "setting the subject line of the message"
verdict = "allow"
rationale = "Only changes the subject header of the outgoing email."

[[flag]]
applies_to = "mail"
flag = "-c"
translation_modifier = "sending carbon copies to additional recipients"
verdict = "allow"
rationale = "Adds more recipients who will receive the message."

[[flag]]
applies_to = "mail"
flag = "-b"
translation_modifier = "sending blind carbon copies to additional recipients"
verdict = "allow"
rationale = "Adds hidden recipients who will receive the message."

[[flag]]
applies_to = "mail"
flag = "-e"
translation_modifier = "testing whether the mailbox has any mail without displaying it"
verdict = "allow"
rationale = "Read-only check that exits with a status code; nothing is modified."

[[flag]]
applies_to = "mail"
flag = "-H"
translation_modifier = "showing message headers only without opening the mailbox"
verdict = "allow"
rationale = "Read-only display of message headers."

[[flag]]
applies_to = "mail"
flag = "-E"
translation_modifier = "refusing to send messages with an empty body"
verdict = "allow"
rationale = "Prevents sending blank emails; reduces the chance of accidental sends."

[[flag]]
applies_to = "mail"
flag = "-f"
translation_modifier = "reading mail from a specific mailbox file"
verdict = "allow"
rationale = "Opens and can modify an alternate mailbox file when messages are deleted or moved."

[[flag]]
applies_to = "mail"
flag = "-i"
translation_modifier = "ignoring terminal interrupt signals"
verdict = "allow"
rationale = "Only changes signal handling; does not affect message content."

[[flag]]
applies_to = "mail"
flag = "-v"
translation_modifier = "showing delivery details on the terminal"
verdict = "allow"
rationale = "Only increases output verbosity."

[[flag]]
applies_to = "mail"
flag = "-n"
translation_modifier = "skipping the system-wide startup configuration file"
verdict = "allow"
rationale = "Only changes which settings are loaded; does not affect mail data."

[[flag]]
applies_to = "mail"
flag = "-u"
translation_modifier = "reading another user's mailbox"
verdict = "allow"
rationale = "Accesses another user's mail, which may expose private messages if permissions allow."
