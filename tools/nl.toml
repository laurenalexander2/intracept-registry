# tools/nl.toml

[[command]]
path = "nl"
translation = "Add line numbers to the output of a file."
verdict = "allow"
rationale = "Read-only filter that adds line numbers; does not modify the input file."

[[flag]]
applies_to = "nl"
flag = "-b"
translation_modifier = "selecting which lines to number based on a type rule"
verdict = "allow"
rationale = "Controls which body lines get numbered; no destructive action."

[[flag]]
applies_to = "nl"
flag = "-n"
translation_modifier = "using a specified number format such as left-justified, right-justified, or zero-padded"
verdict = "allow"
rationale = "Only changes the formatting of line numbers."

[[flag]]
applies_to = "nl"
flag = "-s"
translation_modifier = "using a custom separator between line numbers and text"
verdict = "allow"
rationale = "Only changes the delimiter character; no destructive action."

[[flag]]
applies_to = "nl"
flag = "-w"
translation_modifier = "using a specified width for line numbers"
verdict = "allow"
rationale = "Only changes the column width of line numbers."

[[flag]]
applies_to = "nl"
flag = "-v"
translation_modifier = "starting numbering at a specified value"
verdict = "allow"
rationale = "Only changes the initial line number; no destructive action."

[[flag]]
applies_to = "nl"
flag = "-i"
translation_modifier = "incrementing line numbers by a specified value"
verdict = "allow"
rationale = "Only changes the numbering increment; no destructive action."

[[flag]]
applies_to = "nl"
flag = "-p"
translation_modifier = "without restarting numbering at logical page boundaries"
verdict = "allow"
rationale = "Only affects numbering continuity across pages; no destructive action."
