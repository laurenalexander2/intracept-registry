# tools/xsanctl.toml

[[command]]
path = "xsanctl"
translation = "Control and configure Xsan storage area network volumes."
verdict = "ask"
rationale = "Manages storage area network volumes and configuration; incorrect changes can disrupt shared storage access."
risk_class = "novel"

[[flag]]
applies_to = "xsanctl"
flag = "--force"
translation_modifier = "forcing the operation without safety checks"
verdict = "ask"
rationale = "Bypasses safety checks on storage area network operations; may cause data loss on shared storage."
arity = "Boolean"
