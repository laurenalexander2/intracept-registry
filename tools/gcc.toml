# tools/gcc.toml

[[command]]
path = "gcc"
translation = "Compile C and C++ source code into executable programs."
verdict = "allow"
rationale = "Compiles source code into object files or executables; does not execute the compiled output."
risk_class = "novel"

[[flag]]
applies_to = "gcc"
flag = "-o"
translation_modifier = "writing the output to a specific file"
verdict = "allow"
rationale = "Only changes the output destination."
arity = "Boolean"

[[flag]]
applies_to = "gcc"
flag = "-c"
translation_modifier = "compiling to object files without linking"
verdict = "allow"
rationale = "Produces object files only; no executable is created."
arity = "Boolean"

[[flag]]
applies_to = "gcc"
flag = "-Wall"
translation_modifier = "enabling all common compiler warnings"
verdict = "allow"
rationale = "Only changes which warnings are displayed during compilation."
arity = "Boolean"

[[flag]]
applies_to = "gcc"
flag = "-g"
translation_modifier = "including debugging information in the output"
verdict = "allow"
rationale = "Adds debug symbols; does not change program behavior."
arity = "Boolean"

[[flag]]
applies_to = "gcc"
flag = "-O2"
translation_modifier = "enabling standard optimization"
verdict = "allow"
rationale = "Only changes how the code is optimized during compilation."
arity = "Boolean"

[[flag]]
applies_to = "gcc"
flag = "-O3"
translation_modifier = "enabling aggressive optimization"
verdict = "allow"
rationale = "Maximizes optimization; may change timing behavior but does not affect safety."
arity = "Boolean"

[[flag]]
applies_to = "gcc"
flag = "-Wextra"
translation_modifier = "enabling additional compiler warnings beyond the common set"
verdict = "allow"
rationale = "Only adds more diagnostic messages; does not change the compiled output."
arity = "Boolean"

[[flag]]
applies_to = "gcc"
flag = "-Werror"
translation_modifier = "treating all warnings as errors that stop compilation"
verdict = "allow"
rationale = "Makes compilation stricter but does not change the output when it succeeds."
arity = "Boolean"

[[flag]]
applies_to = "gcc"
flag = "-E"
translation_modifier = "only running the preprocessor without compiling"
verdict = "allow"
rationale = "Outputs preprocessed source code; no object file or executable is created."
arity = "Boolean"

[[flag]]
applies_to = "gcc"
flag = "-S"
translation_modifier = "compiling to assembly language without assembling or linking"
verdict = "allow"
rationale = "Produces assembly output only; no binary is created."
arity = "Boolean"

[[flag]]
applies_to = "gcc"
flag = "-I"
translation_modifier = "adding a directory to the header file search path"
verdict = "allow"
rationale = "Only changes where the compiler looks for header files."
arity = "Boolean"

[[flag]]
applies_to = "gcc"
flag = "-L"
translation_modifier = "adding a directory to the library search path"
verdict = "allow"
rationale = "Only changes where the linker looks for libraries."
arity = "Boolean"

[[flag]]
applies_to = "gcc"
flag = "-l"
translation_modifier = "linking against a specific library"
verdict = "allow"
rationale = "Adds a library dependency; does not execute anything."
arity = "Boolean"

[[flag]]
applies_to = "gcc"
flag = "-shared"
translation_modifier = "producing a shared library instead of an executable"
verdict = "allow"
rationale = "Only changes the output file type."
arity = "Boolean"

[[flag]]
applies_to = "gcc"
flag = "-std"
translation_modifier = "compiling for a specific C language standard"
verdict = "allow"
rationale = "Selects which language features are allowed; does not affect safety."
arity = "Boolean"
