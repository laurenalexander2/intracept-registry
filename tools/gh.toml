[[command]]
path = "gh run rerun"
translation = "Re-run a completed workflow run."
verdict = "ask"
rationale = "Triggers a new execution that may deploy code or consume resources."
risk_class = "novel"

[[command]]
path = "gh run delete"
translation = "Delete a workflow run and its logs."
verdict = "ask"
rationale = "Permanently removes run history and artifacts, which may be needed for auditing."
risk_class = "destructive"

# ── Workflows ───────────────────────────────────────────────────────────────

[[command]]
path = "gh workflow"
translation = "Manage GitHub Actions workflows."
verdict = "allow"
rationale = "The bare subcommand prints help text."
risk_class = "safe"

[[command]]
path = "gh workflow list"
