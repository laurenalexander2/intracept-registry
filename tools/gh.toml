[[command]]
path = "gh gist"
translation = "Manage GitHub gists."
verdict = "allow"
rationale = "The bare subcommand prints help text."
risk_class = "safe"

[[command]]
path = "gh gist create"
translation = "Create a new gist on GitHub."
verdict = "ask"
rationale = "Publishes content to GitHub that may be publicly visible."
risk_class = "novel"

[[command]]
path = "gh gist list"
translation = "List your gists."
verdict = "allow"
rationale = "Read-only operation that lists the user's gists without modifying or deleting any of them."
risk_class = "novel"

[[command]]
path = "gh gist view"
translation = "Display the contents of a gist."
verdict = "allow"
rationale = "Read-only display of gist content."
risk_class = "novel"

[[command]]
path = "gh gist edit"
translation = "Modify the contents of a gist."
verdict = "allow"
rationale = "Changes published gist content that others may have linked to."
risk_class = "novel"

[[command]]
path = "gh gist delete"
translation = "Permanently delete a gist from GitHub."
verdict = "ask"
rationale = "Removes the gist and all its files irreversibly; others may have linked to it."
risk_class = "destructive"

# ── Workflow runs ────────────────────────────────────────────────────────────

[[command]]
path = "gh run"
translation = "Manage GitHub Actions workflow runs."
verdict = "allow"
rationale = "The bare subcommand prints help text."
risk_class = "safe"

[[command]]
path = "gh run list"
translation = "List recent workflow runs."
verdict = "allow"
rationale = "Read-only listing of workflow runs."
risk_class = "novel"

[[command]]
path = "gh run view"
translation = "Display details about a workflow run."
verdict = "allow"
rationale = "Read-only display of run details and logs."
risk_class = "novel"

[[command]]
path = "gh run watch"
translation = "Watch a workflow run until it completes."
verdict = "allow"
rationale = "Read-only monitoring of a running workflow."
risk_class = "novel"

[[command]]
path = "gh run download"
translation = "Download artifacts from a workflow run."
verdict = "allow"
rationale = "Downloads files to the local machine; does not modify the remote run."
risk_class = "novel"

[[command]]
path = "gh run cancel"
translation = "Cancel a running workflow."
verdict = "ask"
rationale = "Stops a workflow run that may be performing deployments or other important tasks."
