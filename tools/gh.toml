translation = "Trigger a workflow run by dispatching a workflow event."
verdict = "ask"
rationale = "Starts a new workflow execution that may deploy code, consume resources, or modify infrastructure."
risk_class = "novel"

[[command]]
path = "gh workflow enable"
translation = "Enable a workflow that was previously disabled."
verdict = "allow"
rationale = "Re-enables a workflow; it will only run when triggered by future events."
risk_class = "novel"

[[command]]
path = "gh workflow disable"
translation = "Disable a workflow so it no longer runs automatically."
verdict = "allow"
rationale = "Prevents the workflow from running, which may break CI/CD pipelines that depend on it."
risk_class = "novel"

