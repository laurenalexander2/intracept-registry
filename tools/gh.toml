risk_class = "destructive"

[[flag]]
applies_to = "gh label delete"
flag = "--yes"
translation_modifier = "without asking for confirmation"
verdict = "allow"
rationale = "Skips the confirmation prompt on label deletion."
arity = "Boolean"
risk_class_override = "priv_esc"

# ── SSH keys ────────────────────────────────────────────────────────────────

[[command]]
path = "gh ssh-key"
translation = "Manage SSH keys registered with your GitHub account."
verdict = "allow"
rationale = "The bare subcommand prints help text."
risk_class = "secret_read"

[[command]]
path = "gh ssh-key list"
translation = "List SSH keys registered with your GitHub account."
verdict = "allow"
rationale = "Read-only listing of SSH keys."
risk_class = "secret_read"

[[command]]
path = "gh ssh-key add"
translation = "Add an SSH key to your GitHub account."
verdict = "ask"
rationale = "Grants a new key access to your account for Git operations over SSH."
risk_class = "secret_read"

[[command]]
path = "gh ssh-key delete"
translation = "Remove an SSH key from your GitHub account."
verdict = "ask"
rationale = "Revokes access for that key, which may break automated systems that depend on it."
risk_class = "destructive"

# ── API ──────────────────────────────────────────────────────────────────────

[[command]]
path = "gh api"
translation = "Make an authenticated request to the GitHub API."
verdict = "allow"
rationale = "Can read or modify any GitHub resource the authenticated user has access to."
risk_class = "novel"

[[flag]]
applies_to = "gh api"
flag = "--method"
translation_modifier = "using a specific HTTP method such as POST, PUT, PATCH, or DELETE"
verdict = "allow"
rationale = "Non-GET methods modify or delete remote resources."
arity = "Boolean"
risk_class_override = "destructive"

[[flag]]
applies_to = "gh api"
flag = "--paginate"
translation_modifier = "fetching all pages of results automatically"
verdict = "allow"
rationale = "Follows pagination links to retrieve complete result sets; still read-only when used with GET."
arity = "Boolean"

# ── Combos ──────────────────────────────────────────────────────────────────

[[combo]]
path = "gh pr create"
translation = "Create a new pull request on GitHub, publishing it to repository collaborators for review."
verdict = "allow"
rationale = "Opens a new PR visible to collaborators; can be closed or deleted afterward."
risk_class = "novel"

[[combo]]
path = "gh pr create --draft"
translation = "Create a new pull request on GitHub in draft mode, signaling it is not ready for review or merging."
verdict = "allow"
rationale = "Draft PRs cannot be merged until marked ready, reducing the risk of premature integration."
risk_class = "novel"

[[combo]]
path = "gh pr merge --delete-branch --squash"
translation = "Squash all commits into one and merge the pull request, then delete the source branch from both local and remote."
verdict = "ask"
rationale = "Permanently integrates code into the base branch and removes the source branch, which cannot be undone without force-pushing."
risk_class = "destructive"

[[combo]]
path = "gh pr merge --rebase"
translation = "Rebase the pull request's commits onto the base branch and merge them without a merge commit."
verdict = "ask"
rationale = "Rewrites commit hashes during rebase, permanently altering the repository history on the base branch."
risk_class = "novel"

[[combo]]
path = "gh pr merge --merge"
translation = "Merge the pull request into the base branch using a merge commit that preserves all individual commits."
verdict = "ask"
rationale = "Integrates changes into the shared base branch, modifying the repository history visible to all collaborators."
risk_class = "novel"

[[combo]]
path = "gh repo delete"
translation = "Permanently delete a GitHub repository, destroying all code, issues, pull requests, releases, and settings."
verdict = "ask"
rationale = "Irrecoverable destruction of an entire repository and all its associated data."
risk_class = "destructive"

[[combo]]
path = "gh release create --draft"
translation = "Create a new release on GitHub saved as a draft, invisible to the public until explicitly published."
verdict = "allow"
rationale = "Draft releases are not visible to users and can be edited or deleted before publishing."
risk_class = "novel"

[[combo]]
path = "gh release delete --cleanup-tag --yes"
translation = "Permanently delete a release and its associated Git tag without asking for confirmation."
verdict = "ask"
rationale = "Destroys both the release and the tag in one step with no confirmation prompt, breaking references and automation."
risk_class = "destructive"

[[combo]]
path = "gh api --method"
translation = "Make an authenticated request to the GitHub API using a specific HTTP method, which may create, modify, or delete remote resources."
verdict = "ask"
rationale = "Non-GET methods can mutate any resource the authenticated user has access to; the exact impact depends on the endpoint."
risk_class = "destructive"

[[combo]]
path = "gh auth login"
translation = "Log in to a GitHub account, storing authentication credentials on the local machine."
verdict = "allow"
rationale = "Writes credentials locally; does not modify any remote GitHub resources."
risk_class = "secret_read"

[[combo]]
path = "gh auth logout"
translation = "Log out of a GitHub account, removing stored authentication credentials from the local machine."
verdict = "allow"
rationale = "Deletes local credentials, which may disrupt automated workflows but is trivially reversible by logging in again."
risk_class = "secret_read"

[[combo]]
path = "gh issue create"
translation = "Create a new issue on GitHub, visible to repository collaborators or the public depending on repository visibility."
verdict = "allow"
rationale = "Publishes an issue that can be closed or deleted afterward; no destructive impact."
risk_class = "novel"

[[combo]]
path = "gh issue close"
translation = "Close an issue on GitHub, marking it as resolved without deleting it."
verdict = "allow"
rationale = "Changes the issue state to closed; can be reopened at any time."
risk_class = "novel"

[[combo]]
path = "gh repo clone"
translation = "Download a GitHub repository to the local machine, creating a new directory with a full copy of the code and history."
verdict = "allow"
rationale = "Read-only fetch from remote that creates a local directory; the remote repository is not modified."
risk_class = "novel"

[[combo]]
path = "gh run watch"
translation = "Stream the live output of a GitHub Actions workflow run until it completes."
verdict = "allow"
rationale = "Read-only monitoring that does not affect the workflow's execution or results."
risk_class = "novel"

[[combo]]
path = "gh pr checkout"
translation = "Fetch a pull request's branch from GitHub and check it out locally for testing or review."
verdict = "allow"
rationale = "Downloads the branch and switches the local working tree; the remote repository is not modified."
risk_class = "novel"

[[combo]]
path = "gh pr review --approve"
translation = "Approve a pull request, signaling it meets review requirements and may be eligible for merging."
verdict = "allow"
rationale = "Posts an approval review that may satisfy branch protection rules and trigger auto-merge if configured."
risk_class = "novel"

[[combo]]
path = "gh secret set"
translation = "Create or update a repository or organization secret used by GitHub Actions workflows."
verdict = "ask"
rationale = "Writes a sensitive value that workflows consume; an incorrect value could break deployments or leak credentials."
risk_class = "secret_read"

[[combo]]
path = "gh repo fork"
translation = "Create a personal copy of someone else's repository on GitHub under your account."
verdict = "allow"
rationale = "Creates a new remote repository; the source repository is not modified."
risk_class = "novel"
