# tools/gh.toml

# ── Base command ─────────────────────────────────────────────────────────────

[[command]]
path = "gh"
translation = "Run the GitHub command-line tool."
verdict = "allow"
rationale = "The bare command prints help text and modifies nothing."
risk_class = "safe"

# ── Authentication ───────────────────────────────────────────────────────────

[[command]]
path = "gh auth"
translation = "Manage authentication state for the GitHub CLI."
verdict = "allow"
rationale = "The bare subcommand prints help text."
risk_class = "secret_read"

[[command]]
path = "gh auth login"
translation = "Log in to a GitHub account."
verdict = "allow"
rationale = "Stores credentials locally; does not modify any remote resources."
risk_class = "secret_read"

[[command]]
path = "gh auth logout"
translation = "Log out of a GitHub account."
verdict = "allow"
rationale = "Removes stored credentials, which may disrupt automated workflows that depend on them."
risk_class = "secret_read"

[[command]]
path = "gh auth status"
translation = "Display the current authentication state."
verdict = "allow"
rationale = "Read-only display of login status."
risk_class = "secret_read"

# ── Repositories ─────────────────────────────────────────────────────────────

[[command]]
path = "gh repo"
translation = "Manage GitHub repositories."
verdict = "allow"
rationale = "The bare subcommand prints help text."
risk_class = "safe"

[[command]]
path = "gh repo create"
translation = "Create a new repository on GitHub."
verdict = "ask"
rationale = "Creates a new remote resource visible to others depending on visibility settings."
risk_class = "novel"

[[flag]]
applies_to = "gh repo create"
flag = "--public"
translation_modifier = "making it publicly visible to everyone"
verdict = "allow"
rationale = "Public repositories expose code to the entire internet."
arity = "Boolean"

[[flag]]
applies_to = "gh repo create"
flag = "--private"
translation_modifier = "making it visible only to you and collaborators"
verdict = "allow"
rationale = "Restricts access to the repository owner and explicitly added collaborators."
arity = "Boolean"

[[flag]]
applies_to = "gh repo create"
flag = "--clone"
translation_modifier = "cloning it to the local machine after creation"
verdict = "allow"
rationale = "Creates a local directory; does not affect remote state beyond the initial creation."
arity = "Boolean"

[[command]]
path = "gh repo clone"
translation = "Download a GitHub repository to the local machine."
verdict = "allow"
rationale = "Creates a new local directory; does not modify the remote repository."
risk_class = "novel"

[[command]]
path = "gh repo fork"
translation = "Create a personal copy of someone else's repository on GitHub."
verdict = "allow"
rationale = "Creates a new remote repository under your account."
risk_class = "novel"

[[command]]
path = "gh repo view"
translation = "Display details about a GitHub repository."
verdict = "allow"
rationale = "Read-only display of repository metadata."
risk_class = "novel"

[[command]]
path = "gh repo list"
translation = "List repositories owned by a user or organization."
verdict = "allow"
rationale = "Read-only listing of repositories."
risk_class = "novel"

[[command]]
path = "gh repo edit"
translation = "Modify settings of a GitHub repository."
verdict = "ask"
rationale = "Changes repository configuration such as visibility, description, or features."
risk_class = "novel"

[[command]]
path = "gh repo rename"
translation = "Rename a GitHub repository."
verdict = "ask"
rationale = "Changes the repository URL, which may break existing links and integrations."
risk_class = "novel"

[[command]]
path = "gh repo archive"
translation = "Archive a GitHub repository, making it read-only."
verdict = "allow"
rationale = "Prevents further changes to the repository; reversible via unarchive."
risk_class = "novel"

[[flag]]
applies_to = "gh repo archive"
flag = "--yes"
translation_modifier = "without asking for confirmation"
verdict = "allow"
rationale = "Bypasses the confirmation prompt on archiving, which makes the repository read-only."
arity = "Boolean"
risk_class_override = "priv_esc"

[[command]]
path = "gh repo unarchive"
translation = "Unarchive a GitHub repository, restoring write access."
verdict = "allow"
rationale = "Reverses an archive operation; restores normal repository functionality."
risk_class = "novel"

[[command]]
path = "gh repo delete"
translation = "Permanently delete a GitHub repository."
verdict = "ask"
rationale = "Irrecoverably removes the repository, all issues, pull requests, and settings from GitHub."
risk_class = "destructive"

[[flag]]
applies_to = "gh repo delete"
flag = "--yes"
translation_modifier = "without asking for confirmation"
verdict = "ask"
rationale = "Skips the confirmation prompt on a destructive operation, increasing the chance of accidental deletion."
arity = "Boolean"
risk_class_override = "priv_esc"

[[command]]
path = "gh repo sync"
translation = "Sync a forked repository with its upstream."
verdict = "ask"
rationale = "Updates branch refs to match the upstream, which may overwrite divergent local changes."
risk_class = "novel"

# ── Pull requests ────────────────────────────────────────────────────────────

[[command]]
path = "gh pr"
translation = "Manage GitHub pull requests."
verdict = "allow"
rationale = "The bare subcommand prints help text."
risk_class = "safe"

[[command]]
path = "gh pr create"
translation = "Create a new pull request on GitHub."
verdict = "allow"
rationale = "Publishes a pull request visible to repository collaborators."
risk_class = "novel"

[[flag]]
applies_to = "gh pr create"
flag = "--draft"
translation_modifier = "marking it as a draft that is not ready for review"
verdict = "allow"
rationale = "Creates the PR in draft state, signaling it is not ready to merge."
arity = "Boolean"

[[flag]]
applies_to = "gh pr create"
flag = "--fill"
translation_modifier = "using commit messages for the title and body"
verdict = "allow"
rationale = "Auto-fills PR metadata from commits; still creates the same PR."
arity = "Boolean"

[[flag]]
applies_to = "gh pr create"
flag = "--dry-run"
translation_modifier = "simulating the creation without actually opening a pull request"
verdict = "allow"
rationale = "No pull request is created; only shows what would happen."
arity = "Boolean"

[[command]]
path = "gh pr list"
translation = "List pull requests in a repository."
verdict = "allow"
rationale = "Read-only listing of pull requests."
risk_class = "novel"

[[command]]
path = "gh pr view"
translation = "Display details about a pull request."
verdict = "allow"
rationale = "Read-only display of pull request metadata."
risk_class = "novel"

[[command]]
path = "gh pr checkout"
translation = "Check out a pull request's branch locally."
verdict = "allow"
rationale = "Creates or switches to a local branch; does not modify the remote."
risk_class = "novel"

[[command]]
path = "gh pr diff"
translation = "Show the changes in a pull request."
verdict = "allow"
rationale = "Read-only display of the pull request diff."
risk_class = "novel"

[[command]]
path = "gh pr checks"
translation = "Show the CI check status for a pull request."
verdict = "allow"
rationale = "Read-only display of check run results."
risk_class = "novel"

[[command]]
path = "gh pr status"
translation = "Show the status of pull requests relevant to you."
verdict = "allow"
rationale = "Read-only summary of your pull requests."
risk_class = "novel"

[[command]]
path = "gh pr merge"
translation = "Merge a pull request on GitHub."
verdict = "ask"
rationale = "Integrates changes into the base branch, modifying the shared repository history."
risk_class = "novel"

[[flag]]
applies_to = "gh pr merge"
flag = "--merge"
translation_modifier = "using a merge commit that preserves all individual commits"
verdict = "allow"
rationale = "Selects the default merge strategy; does not increase destructive potential."
arity = "Boolean"

[[flag]]
applies_to = "gh pr merge"
flag = "--squash"
translation_modifier = "squashing all commits into one before merging"
verdict = "allow"
rationale = "Changes the merge strategy but does not increase destructive potential."
arity = "Boolean"

[[flag]]
applies_to = "gh pr merge"
flag = "--rebase"
translation_modifier = "rebasing the commits onto the base branch"
verdict = "allow"
rationale = "Changes the merge strategy; the PR is still merged into the base branch."
arity = "Boolean"

[[flag]]
applies_to = "gh pr merge"
flag = "--delete-branch"
translation_modifier = "deleting the branch after merging"
verdict = "allow"
rationale = "Removes the local and remote branch, which is expected but irreversible without recreating it."
arity = "Boolean"

[[flag]]
applies_to = "gh pr merge"
flag = "--admin"
translation_modifier = "bypassing branch protection requirements"
verdict = "ask"
rationale = "Overrides required checks and reviews, merging code that has not passed safeguards."
arity = "Boolean"
risk_class_override = "priv_esc"

[[flag]]
applies_to = "gh pr merge"
flag = "--auto"
translation_modifier = "enabling auto-merge once requirements are met"
verdict = "allow"
rationale = "Schedules an automatic merge, which will proceed without further human confirmation."
arity = "Boolean"

[[command]]
path = "gh pr close"
translation = "Close a pull request without merging it."
verdict = "allow"
rationale = "Closes the PR, stopping the review process; can be reopened."
risk_class = "novel"

[[flag]]
applies_to = "gh pr close"
flag = "--delete-branch"
translation_modifier = "deleting the local and remote branch after closing"
verdict = "allow"
rationale = "Removes the branch, which may discard unmerged work if not preserved elsewhere."
arity = "Boolean"
risk_class_override = "destructive"

[[command]]
path = "gh pr reopen"
translation = "Reopen a previously closed pull request."
verdict = "allow"
rationale = "Restores a closed PR to open state; no destructive changes."
risk_class = "novel"

[[command]]
path = "gh pr review"
translation = "Add a review to a pull request."
verdict = "allow"
rationale = "Publishes a review visible to collaborators that may approve or block merging."
risk_class = "novel"

[[flag]]
applies_to = "gh pr review"
flag = "--approve"
translation_modifier = "approving the pull request for merging"
verdict = "allow"
rationale = "Signals the PR is ready to merge, which may trigger auto-merge if configured."
arity = "Boolean"

[[flag]]
applies_to = "gh pr review"
flag = "--request-changes"
translation_modifier = "requesting changes that block merging until addressed"
verdict = "allow"
rationale = "Blocks the PR from merging until the review is dismissed or resolved."
arity = "Boolean"

[[flag]]
applies_to = "gh pr review"
flag = "--comment"
translation_modifier = "leaving a comment without approving or requesting changes"
verdict = "allow"
rationale = "Posts a neutral review comment; does not affect merge eligibility."
arity = "Boolean"

[[command]]
path = "gh pr comment"
translation = "Add a comment to a pull request."
verdict = "allow"
rationale = "Posts a publicly visible comment on the pull request."
risk_class = "novel"

[[command]]
path = "gh pr edit"
translation = "Modify a pull request's title, body, or metadata."
verdict = "allow"
rationale = "Updates PR metadata; does not affect code or branch state."
risk_class = "novel"

[[command]]
path = "gh pr revert"
translation = "Create a new pull request that reverts a previously merged pull request."
verdict = "allow"
rationale = "Creates a revert PR that, if merged, undoes changes in the base branch."
risk_class = "novel"

# ── Issues ───────────────────────────────────────────────────────────────────

[[command]]
path = "gh issue"
translation = "Manage GitHub issues."
verdict = "allow"
rationale = "The bare subcommand prints help text."
risk_class = "safe"

[[command]]
path = "gh issue create"
translation = "Create a new issue on GitHub."
verdict = "allow"
rationale = "Publishes an issue visible to repository collaborators or the public."
risk_class = "novel"

[[command]]
path = "gh issue list"
translation = "List issues in a repository."
verdict = "allow"
rationale = "Read-only operation that lists repository issues without modifying or closing any of them."
risk_class = "novel"

[[command]]
path = "gh issue view"
translation = "Display details about an issue."
verdict = "allow"
rationale = "Read-only display of issue metadata."
risk_class = "novel"

[[command]]
path = "gh issue status"
translation = "Show the status of issues relevant to you."
verdict = "allow"
rationale = "Read-only summary of your issues."
risk_class = "novel"

[[command]]
path = "gh issue close"
translation = "Close an issue."
verdict = "allow"
rationale = "Changes the issue state; can be reopened."
risk_class = "novel"

[[command]]
path = "gh issue reopen"
translation = "Reopen a previously closed issue."
verdict = "allow"
rationale = "Restores a closed issue to open state."
risk_class = "novel"

[[command]]
path = "gh issue comment"
translation = "Add a comment to an issue."
verdict = "allow"
rationale = "Posts a publicly visible comment on the issue."
risk_class = "novel"

[[command]]
path = "gh issue edit"
translation = "Modify an issue's title, body, or metadata."
verdict = "allow"
rationale = "Updates issue metadata without deleting anything."
risk_class = "novel"

[[command]]
path = "gh issue delete"
translation = "Permanently delete an issue from GitHub."
verdict = "ask"
rationale = "Removes the issue and all its comments irreversibly."
risk_class = "destructive"

[[flag]]
applies_to = "gh issue delete"
flag = "--yes"
translation_modifier = "without asking for confirmation"
verdict = "allow"
rationale = "Skips the confirmation prompt on a destructive operation."
arity = "Boolean"
risk_class_override = "priv_esc"

[[command]]
path = "gh issue transfer"
translation = "Move an issue to a different repository."
verdict = "allow"
rationale = "Transfers the issue, changing its URL and repository context."
risk_class = "novel"

# ── Releases ─────────────────────────────────────────────────────────────────

[[command]]
path = "gh release"
translation = "Manage GitHub releases."
verdict = "allow"
rationale = "The bare subcommand prints help text."
risk_class = "safe"

[[command]]
path = "gh release create"
translation = "Create a new release on GitHub."
verdict = "ask"
rationale = "Publishes a release with assets visible to repository users; may auto-create a tag."
risk_class = "novel"

[[flag]]
applies_to = "gh release create"
flag = "--draft"
translation_modifier = "saving it as a draft without publishing"
verdict = "allow"
rationale = "The release is not visible to the public until explicitly published."
arity = "Boolean"

[[flag]]
applies_to = "gh release create"
flag = "--prerelease"
translation_modifier = "marking it as a pre-release version"
verdict = "allow"
rationale = "Labels the release as pre-release; does not change its visibility or content."
arity = "Boolean"

[[flag]]
applies_to = "gh release create"
flag = "--generate-notes"
translation_modifier = "auto-generating release notes from commits"
verdict = "allow"
rationale = "Fills in release notes automatically; does not affect the release content or assets."
arity = "Boolean"

[[flag]]
applies_to = "gh release create"
flag = "--verify-tag"
translation_modifier = "aborting if the tag does not already exist on the remote"
verdict = "allow"
rationale = "Adds a safety check that prevents accidental tag creation."
arity = "Boolean"

[[command]]
path = "gh release list"
translation = "List releases in a repository."
verdict = "allow"
rationale = "Read-only listing of releases."
risk_class = "novel"

[[command]]
path = "gh release view"
translation = "Display details about a release."
verdict = "allow"
rationale = "Read-only display of release metadata."
risk_class = "novel"

[[command]]
path = "gh release download"
translation = "Download assets from a GitHub release."
verdict = "allow"
rationale = "Downloads files to the local machine; does not modify the remote release."
risk_class = "novel"

[[command]]
path = "gh release delete"
translation = "Delete a release from GitHub."
verdict = "ask"
rationale = "Permanently removes the release and its metadata; assets may become inaccessible."
risk_class = "destructive"

[[flag]]
applies_to = "gh release delete"
flag = "--yes"
translation_modifier = "without asking for confirmation"
verdict = "allow"
rationale = "Skips the confirmation prompt on a destructive operation."
arity = "Boolean"
risk_class_override = "priv_esc"

[[flag]]
applies_to = "gh release delete"
flag = "--cleanup-tag"
translation_modifier = "also deleting the associated Git tag"
verdict = "ask"
rationale = "Removes the tag in addition to the release, which may break references and automation."
arity = "Boolean"

[[command]]
path = "gh release edit"
translation = "Modify a release's metadata or assets."
verdict = "allow"
rationale = "Changes a published release that users may be consuming."
risk_class = "novel"

