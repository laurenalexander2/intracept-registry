# tools/unzip.toml

[[command]]
path = "unzip"
translation = "Extract files from a zip archive."
verdict = "allow"
rationale = "Extracts files to disk, potentially overwriting existing files at the destination."
risk_class = "novel"

[[flag]]
applies_to = "unzip"
flag = "-o"
translation_modifier = "overwriting existing files without prompting"
verdict = "allow"
rationale = "Silently replaces existing files during extraction."
arity = "Boolean"

[[flag]]
applies_to = "unzip"
flag = "-n"
translation_modifier = "never overwriting existing files"
verdict = "allow"
rationale = "Prevents overwriting; a safety-enhancing option."
arity = "Boolean"

[[flag]]
applies_to = "unzip"
flag = "-l"
translation_modifier = "listing the archive contents without extracting"
verdict = "allow"
rationale = "Read-only listing; no files are created or modified."
arity = "Boolean"

[[flag]]
applies_to = "unzip"
flag = "-d"
translation_modifier = "extracting into a specified directory"
verdict = "allow"
rationale = "Changes the extraction destination; does not add destructive capability."
arity = "Boolean"

[[flag]]
applies_to = "unzip"
flag = "-t"
translation_modifier = "testing the archive integrity without extracting"
verdict = "allow"
rationale = "Read-only integrity check; no files are created or modified."
arity = "Boolean"

[[flag]]
applies_to = "unzip"
flag = "-q"
translation_modifier = ""
verdict = "allow"
rationale = "Suppresses output messages; does not change extraction behavior."
arity = "Boolean"

[[flag]]
applies_to = "unzip"
flag = "-u"
translation_modifier = "updating only files that are newer than existing copies and extracting new files"
verdict = "allow"
rationale = "Overwrites older files and creates new ones during extraction."
arity = "Boolean"

[[flag]]
applies_to = "unzip"
flag = "-f"
translation_modifier = "extracting only files that already exist on disk and are newer in the archive"
verdict = "allow"
rationale = "Overwrites existing files with newer versions from the archive."
arity = "Boolean"

[[flag]]
applies_to = "unzip"
flag = "-p"
translation_modifier = "extracting file data to standard output instead of creating files"
verdict = "allow"
rationale = "Does not create files on disk; data is written to standard output."
arity = "Boolean"

[[flag]]
applies_to = "unzip"
flag = "-j"
translation_modifier = "extracting without recreating the directory structure"
verdict = "allow"
rationale = "Flattens all files into one directory, which may cause files with the same name to overwrite each other."
arity = "Boolean"

[[flag]]
applies_to = "unzip"
flag = "-x"
translation_modifier = "excluding specified files from extraction"
verdict = "allow"
rationale = "Reduces the set of files extracted; a scope-reducing option."
arity = "Boolean"

[[flag]]
applies_to = "unzip"
flag = "-C"
translation_modifier = "matching filenames without regard to uppercase or lowercase"
verdict = "allow"
rationale = "Changes filename matching behavior; does not add destructive capability."
arity = "Boolean"

[[flag]]
applies_to = "unzip"
flag = "-Z"
translation_modifier = "displaying detailed archive information instead of extracting"
verdict = "allow"
rationale = "Read-only display of archive metadata; no files are modified."
arity = "Boolean"
