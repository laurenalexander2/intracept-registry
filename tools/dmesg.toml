# tools/dmesg.toml

[[command]]
path = "dmesg"
translation = "Display the system's kernel message log."
verdict = "allow"
rationale = "Read-only display of kernel log messages; requires administrator privileges but modifies nothing."

[[flag]]
applies_to = "dmesg"
flag = "-M"
translation_modifier = "reading messages from a specific system memory image file"
verdict = "allow"
rationale = "Only changes the source of the log data; still a read-only operation."

[[flag]]
applies_to = "dmesg"
flag = "-N"
translation_modifier = "using a specific kernel image to interpret the messages"
verdict = "allow"
rationale = "Only changes how messages are interpreted; still a read-only operation."
