# tools/fping.toml

[[command]]
path = "fping"
translation = "Send ICMP ping requests to multiple hosts in parallel."
verdict = "allow"
rationale = "Read-only network diagnostic that sends ICMP echo requests and reports responses."

[[flag]]
applies_to = "fping"
flag = "-g"
translation_modifier = "generating a target list from a CIDR range or IP range"
verdict = "allow"
rationale = "Expands the target list; still sends only ICMP echo requests."

[[flag]]
applies_to = "fping"
flag = "-c"
translation_modifier = "sending a specific number of pings to each target"
verdict = "allow"
rationale = "Only changes how many pings are sent; read-only network diagnostic."

[[flag]]
applies_to = "fping"
flag = "-l"
translation_modifier = "continuously pinging targets in a loop"
verdict = "allow"
rationale = "Sends pings indefinitely; still a read-only diagnostic."

[[flag]]
applies_to = "fping"
flag = "-a"
translation_modifier = "showing only hosts that are reachable"
verdict = "allow"
rationale = "Only filters the output; read-only operation."

[[flag]]
applies_to = "fping"
flag = "-u"
translation_modifier = "showing only hosts that are unreachable"
verdict = "allow"
rationale = "Only filters the output; read-only operation."

[[flag]]
applies_to = "fping"
flag = "-q"
translation_modifier = "suppressing per-ping output and showing only summary"
verdict = "allow"
rationale = "Only changes the output format; read-only operation."

[[flag]]
applies_to = "fping"
flag = "--all"
translation_modifier = "pinging all addresses in the specified network range"
verdict = "allow"
rationale = "Sends ICMP packets to all addresses in a range; read-only network probing."
