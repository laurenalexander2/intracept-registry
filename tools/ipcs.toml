# tools/ipcs.toml

[[command]]
path = "ipcs"
translation = "Display information about System V interprocess communication resources."
verdict = "allow"
rationale = "Read-only display of IPC facility status."

[[flag]]
applies_to = "ipcs"
flag = "-a"
translation_modifier = "showing the maximum amount of detail for all inter-process communication types"
verdict = "allow"
rationale = "Only changes the level of detail displayed."

[[flag]]
applies_to = "ipcs"
flag = "-m"
translation_modifier = "showing only shared memory segment information"
verdict = "allow"
rationale = "Only filters the output to shared memory."

[[flag]]
applies_to = "ipcs"
flag = "-q"
translation_modifier = "showing only message queue information"
verdict = "allow"
rationale = "Only filters the output to message queues."

[[flag]]
applies_to = "ipcs"
flag = "-s"
translation_modifier = "showing only synchronization lock information"
verdict = "allow"
rationale = "Only filters the output to synchronization locks."
