# exemplars/terraform.toml — Terraform IaC exemplar

# ── Base command ──────────────────────────────────────────────────────────────

[[command]]
path = "terraform"
translation = "Run the Terraform infrastructure-as-code tool."
verdict = "allow"
rationale = "The bare command prints help text and modifies nothing."
# ── Core workflow ─────────────────────────────────────────────────────────────
risk_class = "safe"


[[command]]
path = "terraform init"
translation = "Initialize a Terraform working directory by downloading providers and modules."
verdict = "allow"
rationale = "Sets up local state and downloads dependencies; safe to run repeatedly."
risk_class = "novel"

[[command]]
path = "terraform validate"
translation = "Check whether the Terraform configuration files are syntactically valid."
verdict = "allow"
rationale = "Read-only validation that does not contact remote services or modify state."
risk_class = "safe"

[[command]]
path = "terraform fmt"
translation = "Reformat Terraform configuration files to the standard style."
verdict = "allow"
rationale = "Modifies only whitespace and formatting in local files; semantics are unchanged."
risk_class = "novel"

[[command]]
path = "terraform plan"
translation = "Generate an execution plan showing what changes Terraform would make to infrastructure."
verdict = "allow"
rationale = "Read-only operation that queries providers but does not modify any infrastructure."
risk_class = "novel"

[[flag]]
applies_to = "terraform plan"
flag = "-destroy"
translation_modifier = "planning the destruction of all managed resources instead of the usual changes"
verdict = "allow"
rationale = "Only generates a destroy plan; no infrastructure is actually destroyed."
arity = "Boolean"

[[flag]]
applies_to = "terraform plan"
flag = "-target"
translation_modifier = "limited to a specific resource and its dependencies"
verdict = "allow"
rationale = "Narrows the plan scope; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "terraform plan"
flag = "-refresh-only"
translation_modifier = "only updating the state file to match real infrastructure without planning changes"
verdict = "allow"
rationale = "Read-only reconciliation of state; no infrastructure is modified."
arity = "Boolean"

[[flag]]
applies_to = "terraform plan"
flag = "-var"
translation_modifier = "with a specific input variable value"
verdict = "allow"
rationale = "Passes a variable; no infrastructure is modified during plan."
arity = "Boolean"

[[flag]]
applies_to = "terraform plan"
flag = "-var-file"
translation_modifier = "using input variable values from a specified file"
verdict = "allow"
rationale = "Loads variables from a file; no infrastructure is modified during plan."
arity = "Boolean"

[[command]]
path = "terraform apply"
translation = "Create or update infrastructure to match the Terraform configuration."
verdict = "ask"
rationale = "Modifies live cloud infrastructure, which may cause service disruption and incur costs."
risk_class = "destructive"

[[flag]]
applies_to = "terraform apply"
flag = "-auto-approve"
translation_modifier = "without asking for interactive confirmation"
verdict = "ask"
rationale = "Skips the confirmation prompt, immediately applying potentially destructive changes."
arity = "Boolean"
risk_class_override = "priv_esc"

[[flag]]
applies_to = "terraform apply"
flag = "-target"
translation_modifier = "limited to a specific resource and its dependencies"
verdict = "allow"
rationale = "Narrows the scope of the apply; reduces blast radius but may leave state inconsistent."
arity = "Boolean"

[[flag]]
applies_to = "terraform apply"
flag = "-var"
translation_modifier = "with a specific input variable value"
verdict = "allow"
rationale = "Passes an input variable; the risk is in what the apply does, not in setting a variable."
arity = "Boolean"

[[flag]]
applies_to = "terraform apply"
flag = "-var-file"
translation_modifier = "using input variable values from a specified file"
verdict = "allow"
rationale = "Loads variables from a file; the risk is in what the apply does, not in loading variables."
arity = "Boolean"

[[flag]]
applies_to = "terraform apply"
flag = "-lock=false"
translation_modifier = "without acquiring a state lock"
verdict = "ask"
rationale = "Allows concurrent modifications, which can corrupt the state file."
arity = "Boolean"
risk_class_override = "priv_esc"

[[flag]]
applies_to = "terraform apply"
flag = "-destroy"
translation_modifier = "destroying all managed infrastructure instead of creating or updating"
verdict = "ask"
rationale = "Equivalent to terraform destroy; removes all managed resources."
arity = "Boolean"

[[flag]]
applies_to = "terraform apply"
flag = "-refresh-only"
translation_modifier = "only updating the state file to match real infrastructure without making changes"
verdict = "allow"
rationale = "Reconciles state with reality; may cause future plans to show unexpected changes."
# ── Destruction ───────────────────────────────────────────────────────────────
arity = "Boolean"


[[command]]
path = "terraform destroy"
translation = "Destroy all infrastructure managed by the current Terraform configuration."
verdict = "ask"
rationale = "Permanently deletes all managed resources including compute, databases, and networking."
risk_class = "destructive"

[[flag]]
applies_to = "terraform destroy"
flag = "-auto-approve"
translation_modifier = "without asking for interactive confirmation"
verdict = "ask"
rationale = "Immediately destroys all managed infrastructure without a confirmation prompt."
arity = "Boolean"
risk_class_override = "priv_esc"

[[flag]]
applies_to = "terraform destroy"
flag = "-target"
translation_modifier = "limited to a specific resource and its dependencies"
verdict = "ask"
rationale = "Limits destruction scope but can leave state inconsistent."
# ── Import ────────────────────────────────────────────────────────────────────
arity = "Boolean"


[[command]]
path = "terraform import"
translation = "Bring an existing infrastructure resource under Terraform management."
verdict = "allow"
rationale = "Modifies the state file to track an existing resource; does not change infrastructure."
risk_class = "novel"

[[flag]]
applies_to = "terraform import"
flag = "-lock=false"
translation_modifier = "without acquiring a state lock"
verdict = "ask"
rationale = "Allows concurrent state modifications, which can corrupt the state file."
# ── State management ─────────────────────────────────────────────────────────
arity = "Boolean"
risk_class_override = "priv_esc"


[[command]]
path = "terraform state"
translation = "Perform advanced operations on the Terraform state file."
verdict = "allow"
rationale = "The bare subcommand prints help text."
risk_class = "safe"

[[command]]
path = "terraform state list"
translation = "List all resources tracked in the Terraform state."
verdict = "allow"
rationale = "Read-only listing of state entries."
risk_class = "safe"

[[command]]
path = "terraform state show"
translation = "Display the attributes of a single resource in the Terraform state."
verdict = "allow"
rationale = "Read-only display of resource details."
risk_class = "safe"

[[command]]
path = "terraform state mv"
translation = "Move a resource to a different address in the Terraform state."
verdict = "ask"
rationale = "Renames or restructures resources in state; incorrect moves can cause resources to be recreated."
risk_class = "novel"

[[flag]]
applies_to = "terraform state mv"
flag = "-dry-run"
translation_modifier = "simulating the move without actually changing the state"
verdict = "allow"
rationale = "No state changes are made; only shows what would be moved."
arity = "Boolean"

[[flag]]
applies_to = "terraform state mv"
flag = "-lock=false"
translation_modifier = "without acquiring a state lock"
verdict = "ask"
rationale = "Allows concurrent state modifications, which can corrupt the state file."
arity = "Boolean"
risk_class_override = "priv_esc"

[[command]]
path = "terraform state rm"
translation = "Remove a resource from Terraform state without destroying the real infrastructure."
verdict = "ask"
rationale = "Terraform forgets the resource, which means it will no longer be managed or protected from drift."
risk_class = "destructive"

[[flag]]
applies_to = "terraform state rm"
flag = "-dry-run"
translation_modifier = "simulating the removal without actually changing the state"
verdict = "allow"
rationale = "No state changes are made; only shows what would be removed."
arity = "Boolean"

[[flag]]
applies_to = "terraform state rm"
flag = "-lock=false"
translation_modifier = "without acquiring a state lock"
verdict = "ask"
rationale = "Allows concurrent state modifications, which can corrupt the state file."
arity = "Boolean"
risk_class_override = "priv_esc"

[[command]]
path = "terraform state pull"
translation = "Download the current remote state and print it to standard output."
verdict = "allow"
rationale = "Read-only retrieval of the state file."
risk_class = "novel"

[[command]]
path = "terraform state push"
translation = "Upload a local state file to the configured remote backend."
verdict = "ask"
rationale = "Overwrites the remote state, which can cause other users to lose track of managed resources."
risk_class = "novel"

[[flag]]
applies_to = "terraform state push"
flag = "-force"
translation_modifier = "even if the state lineage or serial number does not match"
verdict = "ask"
rationale = "Bypasses safety checks that prevent overwriting divergent state, risking total state corruption."
# ── Resource lifecycle ────────────────────────────────────────────────────────
arity = "Boolean"
risk_class_override = "priv_esc"


[[command]]
path = "terraform taint"
translation = "Mark a resource instance as degraded so it will be recreated on the next apply."
verdict = "allow"
rationale = "Does not destroy the resource immediately, but the next apply will replace it."
risk_class = "novel"

[[command]]
path = "terraform untaint"
translation = "Remove the tainted status from a resource instance so it will not be recreated."
verdict = "allow"
rationale = "Removes the taint mark; prevents unnecessary destruction on the next apply."
risk_class = "novel"

[[command]]
path = "terraform refresh"
translation = "Update the Terraform state to match the current real-world infrastructure."
verdict = "allow"
rationale = "Modifies the state file, which may cause future plans to show unexpected changes."
risk_class = "novel"

[[flag]]
applies_to = "terraform refresh"
flag = "-target"
translation_modifier = "limited to a specific resource and its dependencies"
verdict = "allow"
rationale = "Narrows the refresh scope but may leave state partially updated."
arity = "Boolean"

[[flag]]
applies_to = "terraform refresh"
flag = "-lock=false"
translation_modifier = "without acquiring a state lock"
verdict = "ask"
rationale = "Allows concurrent state modifications, which can corrupt the state file."
# ── Output and graph ─────────────────────────────────────────────────────────
arity = "Boolean"
risk_class_override = "priv_esc"


[[command]]
path = "terraform output"
translation = "Display the output values defined in the Terraform configuration."
verdict = "allow"
rationale = "Read-only display of output values from the state."
risk_class = "safe"

[[command]]
path = "terraform graph"
translation = "Generate a visual dependency graph of Terraform resources."
verdict = "allow"
rationale = "Read-only graph generation that does not modify state or infrastructure."
risk_class = "safe"

[[command]]
path = "terraform providers"
translation = "Show the providers required by the current configuration."
verdict = "allow"
rationale = "Read-only display of provider dependencies."
# ── Locking ───────────────────────────────────────────────────────────────────
risk_class = "safe"


[[command]]
path = "terraform force-unlock"
translation = "Manually release a stuck state lock."
verdict = "ask"
rationale = "Forcibly removes the lock, which may allow conflicting operations to corrupt the state."
risk_class = "priv_esc"

[[flag]]
applies_to = "terraform force-unlock"
flag = "-force"
translation_modifier = "without asking for confirmation"
verdict = "allow"
rationale = "Skips the confirmation prompt; the risk is in the base command, not the prompt bypass."
# ── Workspaces ────────────────────────────────────────────────────────────────
arity = "Boolean"


[[command]]
path = "terraform workspace"
translation = "Manage Terraform workspaces for isolating state environments."
verdict = "allow"
rationale = "The bare subcommand prints help text."
risk_class = "safe"

[[command]]
path = "terraform workspace list"
translation = "List all available Terraform workspaces."
verdict = "allow"
rationale = "Read-only listing of workspaces."
risk_class = "safe"

[[command]]
path = "terraform workspace show"
translation = "Display the name of the currently selected workspace."
verdict = "allow"
rationale = "Read-only display of the current workspace."
risk_class = "safe"

[[command]]
path = "terraform workspace new"
translation = "Create a new Terraform workspace."
verdict = "allow"
rationale = "Creates a new isolated state environment; does not affect existing workspaces."
risk_class = "novel"

[[command]]
path = "terraform workspace select"
translation = "Switch to a different Terraform workspace."
verdict = "allow"
rationale = "Changes which state file subsequent commands operate on; the wrong workspace may target production."
risk_class = "novel"

[[command]]
path = "terraform workspace delete"
translation = "Delete a Terraform workspace and its state."
verdict = "ask"
rationale = "Permanently removes the workspace state; resources tracked in it become unmanaged."
# ── Authentication ────────────────────────────────────────────────────────────
risk_class = "destructive"


[[command]]
path = "terraform login"
translation = "Authenticate with a remote Terraform service and save the credentials locally."
verdict = "allow"
rationale = "Stores authentication credentials on disk, which could be exposed if the machine is compromised."
# ── Missing commands ────────────────────────────────────────────────────────
risk_class = "secret_read"


[[command]]
path = "terraform show"
translation = "Display the current state or a saved plan in human-readable form."
verdict = "allow"
rationale = "Read-only display of state or plan data."
risk_class = "safe"

[[command]]
path = "terraform console"
translation = "Open an interactive console for evaluating Terraform expressions."
verdict = "allow"
rationale = "Interactive evaluation environment; does not modify state or infrastructure."
risk_class = "safe"

[[command]]
path = "terraform test"
translation = "Run integration tests defined for Terraform modules."
verdict = "allow"
rationale = "Executes test assertions against the configuration; may create temporary infrastructure in test mode."
risk_class = "novel"

[[command]]
path = "terraform get"
translation = "Download and update the modules referenced in the configuration."
verdict = "allow"
rationale = "Downloads module source code; does not modify state or infrastructure."
risk_class = "novel"

[[command]]
path = "terraform logout"
translation = "Remove locally stored credentials for a remote Terraform service."
verdict = "allow"
rationale = "Deletes local authentication tokens; does not affect remote infrastructure."
risk_class = "secret_read"

[[command]]
path = "terraform state replace-provider"
translation = "Replace the provider recorded in the state for existing resources."
verdict = "ask"
rationale = "Changes which provider manages resources in state; incorrect replacement may cause resources to be recreated."
risk_class = "novel"

[[flag]]
applies_to = "terraform state replace-provider"
flag = "-lock=false"
translation_modifier = "without acquiring a state lock"
verdict = "ask"
rationale = "Allows concurrent state modifications, which can corrupt the state file."
# ── Missing flags on existing commands ──────────────────────────────────────
arity = "Boolean"
risk_class_override = "priv_esc"


[[flag]]
applies_to = "terraform init"
flag = "-upgrade"
translation_modifier = "upgrading provider plugins and modules to the latest allowed versions"
verdict = "allow"
rationale = "May introduce breaking changes from newer provider versions."
arity = "Boolean"

[[flag]]
applies_to = "terraform init"
flag = "-backend=false"
translation_modifier = "skipping backend configuration"
verdict = "allow"
rationale = "Initializes without configuring the backend; useful for module development."
arity = "Boolean"

[[flag]]
applies_to = "terraform init"
flag = "-reconfigure"
translation_modifier = "reconfiguring the backend and ignoring any saved configuration"
verdict = "allow"
rationale = "Discards existing backend configuration, which may disconnect from the current state."
arity = "Boolean"

[[flag]]
applies_to = "terraform init"
flag = "-migrate-state"
translation_modifier = "migrating existing state to the newly configured backend"
verdict = "ask"
rationale = "Moves state between backends; errors during migration can leave state in an inconsistent location."
arity = "Boolean"

[[flag]]
applies_to = "terraform plan"
flag = "-out"
translation_modifier = "saving the plan to a file for later execution"
verdict = "allow"
rationale = "Writes a plan file; no infrastructure is modified."
arity = "Boolean"

[[flag]]
applies_to = "terraform apply"
flag = "-parallelism"
translation_modifier = "limiting the number of concurrent resource operations"
verdict = "allow"
rationale = "Controls concurrency; lower values are safer but slower."
arity = "Boolean"

[[flag]]
applies_to = "terraform destroy"
flag = "-lock=false"
translation_modifier = "without acquiring a state lock"
verdict = "ask"
rationale = "Allows concurrent state modifications during destroy, risking state corruption."
arity = "Boolean"
risk_class_override = "priv_esc"

[[flag]]
applies_to = "terraform fmt"
flag = "-check"
translation_modifier = "only checking if files need formatting without modifying them"
verdict = "allow"
rationale = "Read-only check; no files are modified."
arity = "Boolean"

[[flag]]
applies_to = "terraform fmt"
flag = "-recursive"
translation_modifier = "processing files in subdirectories as well"
verdict = "allow"
rationale = "Extends formatting to subdirectories; only modifies whitespace."
arity = "Boolean"

[[flag]]
applies_to = "terraform validate"
flag = "-json"
translation_modifier = ""
verdict = "allow"
rationale = "Changes output format to JSON; still a read-only validation."
# ── Combos ───────────────────────────────────────────────────────────────────
arity = "Boolean"


[[combo]]
path = "terraform apply -auto-approve"
translation = "Create or update cloud infrastructure immediately without waiting for interactive confirmation, applying all planned changes at once."
verdict = "ask"
rationale = "Modifies live infrastructure with no confirmation prompt, removing the last guardrail before potentially destructive changes take effect."
risk_class = "destructive"

[[combo]]
path = "terraform destroy -auto-approve"
translation = "Destroy all managed cloud infrastructure immediately without waiting for interactive confirmation."
verdict = "ask"
rationale = "Permanently deletes all managed resources including compute, databases, and networking with no confirmation prompt."
risk_class = "destructive"

[[combo]]
path = "terraform state push -force"
translation = "Upload a local state file to the remote backend, overwriting it even if the lineage or serial number does not match."
verdict = "ask"
rationale = "Bypasses all state consistency checks, risking total corruption of the shared state that tracks all managed infrastructure."
risk_class = "priv_esc"

[[combo]]
path = "terraform init -upgrade"
translation = "Reinitialize the Terraform working directory and upgrade all provider plugins and modules to the latest allowed versions."
verdict = "allow"
rationale = "Downloads newer provider versions that may introduce breaking changes or alter infrastructure behavior on the next apply."
risk_class = "novel"

[[combo]]
path = "terraform plan -destroy"
translation = "Generate an execution plan showing what Terraform would delete if a destroy were run, without actually destroying anything."
verdict = "allow"
rationale = "Read-only preview of destruction that helps verify which resources would be removed before committing to a destroy."
risk_class = "novel"

[[combo]]
path = "terraform apply -lock=false"
translation = "Create or update cloud infrastructure without acquiring the state lock, allowing other operations to run concurrently."
verdict = "ask"
rationale = "Concurrent modifications without locking can corrupt the state file, causing Terraform to lose track of managed resources."
risk_class = "destructive"

[[combo]]
path = "terraform destroy -lock=false"
translation = "Destroy all managed cloud infrastructure without acquiring the state lock, allowing other operations to run concurrently."
verdict = "ask"
rationale = "Combines infrastructure destruction with concurrent state access, risking both data loss and state corruption simultaneously."
risk_class = "destructive"

[[combo]]
path = "terraform apply -auto-approve -destroy"
translation = "Destroy all managed cloud infrastructure immediately without confirmation, equivalent to terraform destroy -auto-approve."
verdict = "ask"
rationale = "Permanently deletes all managed resources with no confirmation prompt, combining the most destructive operation with the removal of all safeguards."
risk_class = "destructive"

[[combo]]
path = "terraform apply -auto-approve -lock=false"
translation = "Create or update cloud infrastructure immediately without confirmation and without acquiring the state lock."
verdict = "ask"
rationale = "Removes both the confirmation prompt and state locking safeguards, maximizing the risk of unintended changes and state corruption."
risk_class = "destructive"

[[combo]]
path = "terraform destroy -auto-approve -lock=false"
translation = "Destroy all managed cloud infrastructure immediately without confirmation and without acquiring the state lock."
verdict = "ask"
rationale = "Combines immediate destruction with no locking, risking permanent data loss and state corruption in a single operation."
risk_class = "destructive"
