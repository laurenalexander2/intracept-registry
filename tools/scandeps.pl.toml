# tools/scandeps.pl.toml

[[command]]
path = "scandeps.pl"
translation = "Scan Perl files and report their module dependencies."
verdict = "allow"
rationale = "Read-only static analysis of Perl source files; does not modify anything."

[[flag]]
applies_to = "scandeps.pl"
flag = "-B"
translation_modifier = "including core modules in the output"
verdict = "allow"
rationale = "Expands output to include built-in modules; no state modification."

[[flag]]
applies_to = "scandeps.pl"
flag = "-V"
translation_modifier = "showing all files found during scanning"
verdict = "allow"
rationale = "Verbose output mode; no state modification."

[[flag]]
applies_to = "scandeps.pl"
flag = "-R"
translation_modifier = "without recursing into discovered dependencies"
verdict = "allow"
rationale = "Limits scan depth; no state modification."

[[flag]]
applies_to = "scandeps.pl"
flag = "-x"
translation_modifier = "executing the code and inspecting loaded modules at runtime"
verdict = "allow"
rationale = "Actually runs the scanned code, which may have side effects depending on the script."

[[flag]]
applies_to = "scandeps.pl"
flag = "-c"
translation_modifier = "compiling the code and inspecting loaded modules"
verdict = "allow"
rationale = "Compiles without full execution; startup initialization blocks still run but typical scripts are safe."

[[flag]]
applies_to = "scandeps.pl"
flag = "-e"
translation_modifier = "scanning a string of Perl code instead of a file"
verdict = "allow"
rationale = "Provides inline code for analysis; no file modification."
