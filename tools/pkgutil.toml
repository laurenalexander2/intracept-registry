# tools/pkgutil.toml

[[command]]
path = "pkgutil"
translation = "Query and manipulate macOS installer packages and installation receipts."
verdict = "allow"
rationale = "Primarily reads package metadata and receipt information."

[[flag]]
applies_to = "pkgutil"
flag = "--packages"
translation_modifier = "listing all installed package IDs"
verdict = "allow"
rationale = "Read-only listing of installed packages."

[[flag]]
applies_to = "pkgutil"
flag = "--pkgs-plist"
translation_modifier = "listing all installed package IDs in property list format"
verdict = "allow"
rationale = "Read-only listing in plist format."

[[flag]]
applies_to = "pkgutil"
flag = "--files"
translation_modifier = "listing all files installed by a specific package"
verdict = "allow"
rationale = "Read-only listing of files from a package receipt."

[[flag]]
applies_to = "pkgutil"
flag = "--only-files"
translation_modifier = "listing only files, excluding directories"
verdict = "allow"
rationale = "Filters the file listing to exclude directories."

[[flag]]
applies_to = "pkgutil"
flag = "--only-dirs"
translation_modifier = "listing only directories, excluding files"
verdict = "allow"
rationale = "Filters the file listing to exclude regular files."

[[flag]]
applies_to = "pkgutil"
flag = "--pkg-info"
translation_modifier = "displaying detailed information about a specific package"
verdict = "allow"
rationale = "Read-only display of package metadata."

[[flag]]
applies_to = "pkgutil"
flag = "--pkg-info-plist"
translation_modifier = "displaying detailed package information in property list format"
verdict = "allow"
rationale = "Read-only display of package metadata in plist format."

[[flag]]
applies_to = "pkgutil"
flag = "--export-plist"
translation_modifier = "printing all receipt information for a package in property list format"
verdict = "allow"
rationale = "Read-only export of receipt data."

[[flag]]
applies_to = "pkgutil"
flag = "--forget"
translation_modifier = "removing the receipt for a specified package from the database"
verdict = "allow"
rationale = "Deletes the installation receipt, making the system forget a package was installed."

[[flag]]
applies_to = "pkgutil"
flag = "--force"
translation_modifier = "without asking for confirmation"
verdict = "allow"
rationale = "Bypasses confirmation for package database modifications."

[[flag]]
applies_to = "pkgutil"
flag = "--volume"
translation_modifier = "operating on a specific volume instead of the root volume"
verdict = "allow"
rationale = "Changes which volume is queried; does not modify data by itself."

[[flag]]
applies_to = "pkgutil"
flag = "--regexp"
translation_modifier = "matching package IDs using a regular expression pattern"
verdict = "allow"
rationale = "Changes how package IDs are matched; does not modify data."

[[flag]]
applies_to = "pkgutil"
flag = "--expand"
translation_modifier = "expanding a flat package into a directory for inspection"
verdict = "allow"
rationale = "Extracts package contents to a new directory; does not install anything."

[[flag]]
applies_to = "pkgutil"
flag = "--flatten"
translation_modifier = "creating a flat package from a directory"
verdict = "allow"
rationale = "Creates a new package file; may overwrite an existing file at the output path."

[[flag]]
applies_to = "pkgutil"
flag = "--bom"
translation_modifier = "extracting bill of materials files from a package"
verdict = "allow"
rationale = "Extracts bill of materials files to a temporary directory for inspection."

[[flag]]
applies_to = "pkgutil"
flag = "--payload-files"
translation_modifier = "listing the files archived within an uninstalled package"
verdict = "allow"
rationale = "Read-only listing of files inside a package payload."

[[flag]]
applies_to = "pkgutil"
flag = "--check-signature"
translation_modifier = "verifying the signature and certificate chain of a package"
verdict = "allow"
rationale = "Read-only verification of the package signature."

[[flag]]
applies_to = "pkgutil"
flag = "--learn"
translation_modifier = "updating the access control list entries in a package receipt"
verdict = "allow"
rationale = "Modifies receipt data, which affects future repair operations on the package."

[[flag]]
applies_to = "pkgutil"
flag = "--file-info"
translation_modifier = "displaying metadata known about a specific file path"
verdict = "allow"
rationale = "Read-only display of file receipt information."

[[flag]]
applies_to = "pkgutil"
flag = "--groups"
translation_modifier = "listing all package groups"
verdict = "allow"
rationale = "Read-only listing of package groups."
