# tools/sh.toml

[[command]]
path = "sh"
translation = "Run the standards-compliant-compliant command interpreter shell."
verdict = "allow"
rationale = "Launches an interactive shell or executes scripts; the shell itself is just an interpreter."

[[flag]]
applies_to = "sh"
flag = "-c"
translation_modifier = "executing a command string passed as an argument"
verdict = "allow"
rationale = "Runs a command inline; risk depends on the command, not the flag."

[[flag]]
applies_to = "sh"
flag = "-x"
translation_modifier = "printing each command before executing it"
verdict = "allow"
rationale = "Debug tracing output; no state modification."
