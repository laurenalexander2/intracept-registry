# tools/column.toml

[[command]]
path = "column"
translation = "Format text input into neatly aligned columns."
verdict = "allow"
rationale = "Read-only text formatting tool that writes to the terminal."

[[flag]]
applies_to = "column"
flag = "-t"
translation_modifier = "detecting columns automatically and creating a table"
verdict = "allow"
rationale = "Only changes how output is formatted; read-only operation."

[[flag]]
applies_to = "column"
flag = "-s"
translation_modifier = "using a custom character to separate columns"
verdict = "allow"
rationale = "Only changes how input is parsed; read-only operation."

[[flag]]
applies_to = "column"
flag = "-c"
translation_modifier = "fitting output to a specific display width"
verdict = "allow"
rationale = "Only changes how output is formatted; read-only operation."

[[flag]]
applies_to = "column"
flag = "-x"
translation_modifier = "filling columns before rows instead of the default order"
verdict = "allow"
rationale = "Only changes the order in which entries are arranged; read-only operation."
