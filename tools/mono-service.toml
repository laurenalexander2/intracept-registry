# tools/mono-service.toml — Mono ServiceProcess host

[[command]]
path = "mono-service"
translation = "Run a .NET service application as a background background service using the Mono runtime."
verdict = "allow"
rationale = "Starts a long-running background process that may modify system state or listen on network ports."

[[flag]]
applies_to = "mono-service"
flag = "-d"
translation_modifier = "in a specified working directory"
verdict = "allow"
rationale = "Sets the working directory for the service; no additional risk."

[[flag]]
applies_to = "mono-service"
flag = "-l"
translation_modifier = "using a specified lock file path"
verdict = "allow"
rationale = "Changes the lock file location; no additional risk."

[[flag]]
applies_to = "mono-service"
flag = "--no-daemon"
translation_modifier = "in the foreground without running as a background service"
verdict = "allow"
rationale = "Prevents backgrounding and keeps the terminal attached; useful for debugging."
