# tools/launchctl.toml

[[command]]
path = "launchctl"
translation = "Run the macOS service management tool."
verdict = "allow"
rationale = "The bare command prints help text and modifies nothing."
risk_class = "novel"

[[command]]
path = "launchctl bootstrap"
translation = "Load and register a service so it can run."
verdict = "ask"
rationale = "Registers and may start a system or user service."
risk_class = "novel"

[[command]]
path = "launchctl bootout"
translation = "Stop and remove a registered service."
verdict = "ask"
rationale = "Stops and unregisters a running service, which may interrupt dependent processes."
risk_class = "novel"

[[command]]
path = "launchctl enable"
translation = "Allow a service to start automatically."
verdict = "ask"
rationale = "Enables a service to run on demand or at startup; the change persists across restarts."
risk_class = "novel"

[[command]]
path = "launchctl disable"
translation = "Prevent a service from starting automatically."
verdict = "ask"
rationale = "Blocks a service from running, which may affect system functionality; the change persists across restarts."
risk_class = "novel"

[[command]]
path = "launchctl kickstart"
translation = "Force a service to start immediately."
verdict = "allow"
rationale = "Starts a service outside its normal trigger conditions."
risk_class = "novel"

[[command]]
path = "launchctl kill"
translation = "Send a signal to a running service's process."
verdict = "allow"
rationale = "May terminate the service process, interrupting whatever it was doing."
risk_class = "novel"

[[command]]
path = "launchctl print"
translation = "Display detailed information about a service or service domain."
verdict = "allow"
rationale = "Read-only display of service status and configuration."
risk_class = "novel"

[[command]]
path = "launchctl list"
translation = "List all loaded services."
verdict = "allow"
rationale = "Read-only listing of services."
risk_class = "novel"

[[command]]
path = "launchctl dumpstate"
translation = "Display the complete internal state of the service manager."
verdict = "allow"
rationale = "Read-only display of internal state."
risk_class = "novel"

[[command]]
path = "launchctl reboot"
translation = "Initiate a system reboot."
verdict = "ask"
rationale = "Restarts the entire system, interrupting all running processes and unsaved work."
risk_class = "novel"

[[command]]
path = "launchctl limit"
translation = "View or set system resource limits for services."
verdict = "allow"
rationale = "Changing resource limits may affect system stability or service behavior."
risk_class = "novel"

[[command]]
path = "launchctl load"
translation = "Load a service configuration file so the service can run."
verdict = "ask"
rationale = "Registers and may start a service; this command is deprecated in favor of bootstrap."
risk_class = "novel"

[[command]]
path = "launchctl unload"
translation = "Unload a service configuration file, stopping the service."
verdict = "ask"
rationale = "Stops and deregisters a service; this command is deprecated in favor of bootout."
risk_class = "novel"

[[command]]
path = "launchctl start"
translation = "Start a service by its label."
verdict = "allow"
rationale = "Manually starts a service, which may launch arbitrary processes."
risk_class = "novel"

[[command]]
path = "launchctl stop"
translation = "Stop a service by its label."
verdict = "allow"
rationale = "Stops a running service, which may interrupt dependent processes."
risk_class = "novel"

[[command]]
path = "launchctl remove"
translation = "Remove a service by its label."
verdict = "allow"
rationale = "Unregisters a service, which prevents it from running until reloaded."
risk_class = "novel"

[[command]]
path = "launchctl blame"
translation = "Show why a service was started."
verdict = "allow"
rationale = "Read-only display of the reason a service is running."
risk_class = "novel"

[[command]]
path = "launchctl config"
translation = "Set persistent configuration for the service manager."
verdict = "ask"
rationale = "Changes system-wide service manager settings that persist across restarts and require a reboot to take effect."
risk_class = "novel"

[[command]]
path = "launchctl error"
translation = "Display a human-readable description of an error code."
verdict = "allow"
rationale = "Read-only lookup of error descriptions."
risk_class = "novel"

[[command]]
path = "launchctl version"
translation = "Print the service manager version."
verdict = "allow"
rationale = "Read-only display of version information."
risk_class = "novel"

[[flag]]
applies_to = "launchctl kickstart"
flag = "-k"
translation_modifier = "killing the running instance first and then restarting it"
verdict = "allow"
rationale = "Terminates the currently running service process before restarting, which interrupts any work in progress."
arity = "Boolean"

[[flag]]
applies_to = "launchctl kickstart"
flag = "-p"
translation_modifier = "printing the process ID of the started service"
verdict = "allow"
rationale = "Only adds informational output; does not change what happens to the service."
arity = "Boolean"

[[flag]]
applies_to = "launchctl load"
flag = "-w"
translation_modifier = "overriding the disabled setting and enabling the service"
verdict = "ask"
rationale = "Forces a previously disabled service to load and persist that change."
arity = "Boolean"

[[flag]]
applies_to = "launchctl unload"
flag = "-w"
translation_modifier = "marking the service as disabled so it will not reload"
verdict = "allow"
rationale = "Persistently disables the service, preventing it from starting until re-enabled."
arity = "Boolean"

[[flag]]
applies_to = "launchctl load"
flag = "-F"
translation_modifier = "forcing the load regardless of the disabled setting"
verdict = "ask"
rationale = "Bypasses the disabled check, which may load a service that was intentionally turned off."
arity = "Boolean"

[[flag]]
applies_to = "launchctl unload"
flag = "-F"
translation_modifier = "forcing the unload regardless of the disabled setting"
verdict = "allow"
rationale = "Bypasses the disabled check when unloading the service."
arity = "Boolean"

[[flag]]
applies_to = "launchctl reboot"
flag = "userspace"
translation_modifier = "restarting only the user-level programs without rebooting the hardware"
verdict = "ask"
rationale = "Tears down and restarts all user-level programs, which may cause data loss in running applications."
arity = "Boolean"

[[flag]]
applies_to = "launchctl reboot"
flag = "halt"
translation_modifier = "shutting the system down completely without restarting"
verdict = "ask"
rationale = "Powers off the system entirely, interrupting all processes and unsaved work with no automatic restart."
arity = "Boolean"

[[flag]]
applies_to = "launchctl reboot"
flag = "logout"
translation_modifier = "logging out the current user session without a full reboot"
verdict = "ask"
rationale = "Forcefully ends the login session without giving applications a chance to save, risking data loss."
arity = "Boolean"

[[flag]]
applies_to = "launchctl reboot"
flag = "apps"
translation_modifier = "terminating all user-launched applications without a full reboot"
verdict = "ask"
rationale = "Forcefully closes all user applications without prompting to save, risking data loss."
arity = "Boolean"
