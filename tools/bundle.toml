# tools/bundle.toml

[[command]]
path = "bundle"
translation = "Run the Ruby Bundler dependency manager."
verdict = "allow"
rationale = "The bare command prints help text and modifies nothing."
risk_class = "safe"

[[command]]
path = "bundle install"
translation = "Install all Ruby gems specified in the Gemfile."
verdict = "ask"
rationale = "Downloads and installs gems across the network from a remote registry; every install may execute native extension build scripts with system access."
risk_class = "net_egress"

[[command]]
path = "bundle update"
translation = "Update Ruby gems to their latest allowed versions."
verdict = "ask"
rationale = "Downloads new gem versions across the network and modifies the lockfile; every update may introduce breaking changes or run native build scripts."
risk_class = "net_egress"

[[command]]
path = "bundle exec"
translation = "Run a command in the context of the bundle's gem environment."
verdict = "allow"
rationale = "Executes an arbitrary command with the bundled gem versions loaded; risk depends on the executed command."
risk_class = "novel"

[[command]]
path = "bundle add"
translation = "Add a gem to the Gemfile and install it."
verdict = "ask"
rationale = "Downloads a new gem across the network and modifies the Gemfile; native extension build scripts may execute arbitrary code on install."
risk_class = "net_egress"

[[command]]
path = "bundle remove"
translation = "Remove a gem from the Gemfile."
verdict = "allow"
rationale = "Modifies the Gemfile; does not delete the gem from the system."
risk_class = "safe"

[[command]]
path = "bundle list"
translation = "List all gems in the current bundle."
verdict = "allow"
rationale = "Read-only listing of bundled gems."
risk_class = "safe"

[[command]]
path = "bundle check"
translation = "Check if the bundle's dependencies are satisfied."
verdict = "allow"
rationale = "Read-only validation of dependency status."
risk_class = "safe"

[[command]]
path = "bundle outdated"
translation = "Show gems that have newer versions available."
verdict = "ask"
rationale = "Read-only comparison that queries the remote registry across the network for every installed gem, revealing the project's dependency list."
risk_class = "net_egress"
