# tools/kdestroy.toml

[[command]]
path = "kdestroy"
translation = "Remove Kerberos credential tickets from the cache."
verdict = "allow"
rationale = "Destroys authentication tickets, which may require re-authentication for services."

[[flag]]
applies_to = "kdestroy"
flag = "--all"
translation_modifier = "removing all credential caches"
verdict = "allow"
rationale = "Destroys every cached credential, requiring re-authentication for all Kerberos services."

[[flag]]
applies_to = "kdestroy"
flag = "-c"
translation_modifier = "removing a specific credential cache instead of the default"
verdict = "allow"
rationale = "Targets a named cache for destruction; other caches are unaffected."

[[flag]]
applies_to = "kdestroy"
flag = "--credential"
translation_modifier = "removing only a specific credential from the cache"
verdict = "allow"
rationale = "Removes a single ticket rather than the entire cache; minimal scope."

[[flag]]
applies_to = "kdestroy"
flag = "-p"
translation_modifier = "removing the cache associated with a specific principal"
verdict = "allow"
rationale = "Targets a specific principal's cache for destruction."
