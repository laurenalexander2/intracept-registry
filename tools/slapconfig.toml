# tools/slapconfig.toml

[[command]]
path = "slapconfig"
translation = "Configure the OpenDirectory LDAP server and related background services."
verdict = "require_approval"
rationale = "Modifies LDAP server configuration; incorrect changes can break directory services and authentication."

[[flag]]
applies_to = "slapconfig"
flag = "-defaultsuffix"
translation_modifier = "displaying the default LDAP suffix based on DNS name"
verdict = "allow"
rationale = "Read-only query of the default suffix."

[[flag]]
applies_to = "slapconfig"
flag = "-getstyle"
translation_modifier = "displaying whether the server is master, replica, client, or standalone"
verdict = "allow"
rationale = "Read-only operation that displays the current directory replication style without making changes."

[[flag]]
applies_to = "slapconfig"
flag = "-destroyldapserver"
translation_modifier = "turning off the LDAP server and deleting its database"
verdict = "require_approval"
rationale = "Permanently destroys the LDAP database and notifies peers of removal; directory data is irrecoverable without backups."

[[flag]]
applies_to = "slapconfig"
flag = "-createldapmasterandadmin"
translation_modifier = "creating a new master LDAP server with an administrator account"
verdict = "require_approval"
rationale = "Sets up a new directory master which changes the authentication infrastructure."

[[flag]]
applies_to = "slapconfig"
flag = "-createreplica"
translation_modifier = "creating a new replica from an existing LDAP master"
verdict = "require_approval"
rationale = "Establishes replication which copies and synchronizes directory data."

[[flag]]
applies_to = "slapconfig"
flag = "-addreplica"
translation_modifier = "adding a replication link with a specified server"
verdict = "require_approval"
rationale = "Creates unidirectional replication; incorrect setup can cause data inconsistencies."
