# tools/pkgbuild.toml

[[command]]
path = "pkgbuild"
translation = "Build a macOS Installer component package from files on disk."
verdict = "allow"
rationale = "Creates a package file; does not install anything."

[[flag]]
applies_to = "pkgbuild"
flag = "--root"
translation_modifier = "packaging the entire contents of a specified directory"
verdict = "allow"
rationale = "Selects the source directory; does not modify the source files."

[[flag]]
applies_to = "pkgbuild"
flag = "--component"
translation_modifier = "packaging a specific application bundle"
verdict = "allow"
rationale = "Selects a bundle to include; does not modify the bundle."

[[flag]]
applies_to = "pkgbuild"
flag = "--scripts"
translation_modifier = "including pre-install and post-install scripts in the package"
verdict = "allow"
rationale = "Embedded scripts run during installation and can make arbitrary system changes."

[[flag]]
applies_to = "pkgbuild"
flag = "--identifier"
translation_modifier = "setting a unique identifier for the package"
verdict = "allow"
rationale = "Labels the package for upgrade detection; does not change contents."

[[flag]]
applies_to = "pkgbuild"
flag = "--version"
translation_modifier = "setting the version number for the package"
verdict = "allow"
rationale = "Labels the package version; does not change contents."

[[flag]]
applies_to = "pkgbuild"
flag = "--install-location"
translation_modifier = "setting the default install destination on the target system"
verdict = "allow"
rationale = "Controls where files are placed during installation; only affects the package metadata."

[[flag]]
applies_to = "pkgbuild"
flag = "--nopayload"
translation_modifier = "building a package that contains only scripts and no files"
verdict = "allow"
rationale = "Creates a scripts-only package; the scripts can make arbitrary system changes during installation."

[[flag]]
applies_to = "pkgbuild"
flag = "--sign"
translation_modifier = "digitally signing the package with a developer identity"
verdict = "allow"
rationale = "Adds a signature for trust verification; does not change the package contents."

[[flag]]
applies_to = "pkgbuild"
flag = "--keychain"
translation_modifier = "searching for the signing identity in a specific keychain"
verdict = "allow"
rationale = "Selects a non-default keychain; does not change the signing operation."

[[flag]]
applies_to = "pkgbuild"
flag = "--timestamp"
translation_modifier = "including a trusted timestamp with the signature"
verdict = "allow"
rationale = "Adds a timestamp for long-term signature validity; a security-enhancing option."

[[flag]]
applies_to = "pkgbuild"
flag = "--analyze"
translation_modifier = "generating a component property list template instead of building a package"
verdict = "allow"
rationale = "Produces an informational file; does not create a package."

[[flag]]
applies_to = "pkgbuild"
flag = "--filter"
translation_modifier = "excluding files matching a pattern from the package"
verdict = "allow"
rationale = "Reduces what is included; does not modify source files."

[[flag]]
applies_to = "pkgbuild"
flag = "--ownership"
translation_modifier = "controlling how file ownership is recorded in the package"
verdict = "allow"
rationale = "Sets ownership metadata; does not change actual file ownership on disk."

[[flag]]
applies_to = "pkgbuild"
flag = "--component-plist"
translation_modifier = "using a property list to control how bundles are handled during installation"
verdict = "allow"
rationale = "Customizes per-bundle install behavior; only affects package metadata."

[[flag]]
applies_to = "pkgbuild"
flag = "--quiet"
translation_modifier = ""
verdict = "allow"
rationale = "Only suppresses status messages on standard output."

[[flag]]
applies_to = "pkgbuild"
flag = "--large-payload"
translation_modifier = "supporting files larger than 8 gigabytes in the package"
verdict = "allow"
rationale = "Enables large file support; limits compatibility to macOS 12.0 and later."

[[flag]]
applies_to = "pkgbuild"
flag = "--min-os-version"
translation_modifier = "setting the minimum macOS version required to install the package"
verdict = "allow"
rationale = "Restricts which systems can install the package; only affects metadata."

[[flag]]
applies_to = "pkgbuild"
flag = "--compression"
translation_modifier = "controlling the compression algorithm used for the package"
verdict = "allow"
rationale = "Affects package size and compatibility; does not change the contents."
