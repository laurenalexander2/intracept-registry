# tools/fgrep.toml

[[command]]
path = "fgrep"
translation = "Search files for lines matching a fixed string pattern."
verdict = "allow"
rationale = "Read-only search operation that modifies nothing."

[[flag]]
applies_to = "fgrep"
flag = "-r"
translation_modifier = "recursively through all subdirectories"
verdict = "allow"
rationale = "Expands the search scope but remains a read-only operation."

[[flag]]
applies_to = "fgrep"
flag = "-i"
translation_modifier = "ignoring case differences"
verdict = "allow"
rationale = "Only changes pattern matching behavior; read-only operation."

[[flag]]
applies_to = "fgrep"
flag = "-v"
translation_modifier = "selecting only non-matching lines"
verdict = "allow"
rationale = "Inverts the match criteria; still a read-only operation."

[[flag]]
applies_to = "fgrep"
flag = "-c"
translation_modifier = "showing only a count of matching lines"
verdict = "allow"
rationale = "Only changes output format; read-only operation."

[[flag]]
applies_to = "fgrep"
flag = "-l"
translation_modifier = "showing only the names of files with matches"
verdict = "allow"
rationale = "Only changes output format; read-only operation."
