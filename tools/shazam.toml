# tools/shazam.toml

[[command]]
path = "shazam"
translation = "Run the ShazamKit command-line utility for audio recognition."
verdict = "allow"
rationale = "The bare command prints help text and modifies nothing."

[[command]]
path = "shazam signature"
translation = "Generate a Shazam audio signature file from audio input."
verdict = "allow"
rationale = "Creates a signature file; does not modify existing files."

[[command]]
path = "shazam custom-catalog"
translation = "Manage custom Shazam recognition catalogs."
verdict = "allow"
rationale = "Creates or manages catalog files for audio recognition."
