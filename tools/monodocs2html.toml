# tools/monodocs2html.toml — Mono documentation to HTML exporter

[[command]]
path = "monodocs2html"
translation = "Export Mono XML documentation to HTML files."
verdict = "allow"
rationale = "Generates HTML files from documentation sources; does not modify the source documentation."
risk_class = "novel"

[[flag]]
applies_to = "monodocs2html"
flag = "-o"
translation_modifier = "writing output to a specified directory"
verdict = "allow"
rationale = "Sets the output directory; no additional risk."
arity = "Boolean"

[[flag]]
applies_to = "monodocs2html"
flag = "--force-update"
translation_modifier = "regenerating all files regardless of modification dates"
verdict = "allow"
rationale = "Overwrites existing output files unconditionally; source documentation is not affected."
arity = "Boolean"
