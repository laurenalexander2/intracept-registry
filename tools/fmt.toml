# tools/fmt.toml

[[command]]
path = "fmt"
translation = "Reformat text to fit within a specified line width."
verdict = "allow"
rationale = "Reads input and writes reformatted text to the terminal; does not modify files in place."
risk_class = "novel"

[[flag]]
applies_to = "fmt"
flag = "-w"
translation_modifier = "using a specific maximum line width"
verdict = "allow"
rationale = "Only changes the target line width for formatting."
arity = "Boolean"

[[flag]]
applies_to = "fmt"
flag = "-c"
translation_modifier = "centering each line"
verdict = "allow"
rationale = "Only changes the alignment of output text."
arity = "Boolean"

[[flag]]
applies_to = "fmt"
flag = "-s"
translation_modifier = "collapsing multiple spaces into single spaces"
verdict = "allow"
rationale = "Only changes whitespace in the output."
arity = "Boolean"

[[flag]]
applies_to = "fmt"
flag = "-m"
translation_modifier = "formatting mail header lines sensibly"
verdict = "allow"
rationale = "Only changes how mail headers are handled in the output."
arity = "Boolean"

[[flag]]
applies_to = "fmt"
flag = "-p"
translation_modifier = "preserving indented paragraph structure"
verdict = "allow"
rationale = "Only changes paragraph detection logic; no destructive action."
arity = "Boolean"

[[flag]]
applies_to = "fmt"
flag = "-n"
translation_modifier = "formatting lines that begin with a dot character"
verdict = "allow"
rationale = "Only changes which lines are reformatted; no destructive action."
arity = "Boolean"
