# tools/unlz4.toml

[[command]]
path = "unlz4"
translation = "Decompress LZ4-compressed files."
verdict = "allow"
rationale = "Decompresses files creating the original output; source files are preserved by default."

[[flag]]
applies_to = "unlz4"
flag = "-f"
translation_modifier = "overwriting the output file without prompting"
verdict = "allow"
rationale = "Overwrites existing output files without confirmation."

[[flag]]
applies_to = "unlz4"
flag = "-k"
translation_modifier = "keeping the source file after decompression"
verdict = "allow"
rationale = "Preserves the input file; this is already the default behavior."

[[flag]]
applies_to = "unlz4"
flag = "--rm"
translation_modifier = "removing the source file after successful decompression"
verdict = "allow"
rationale = "Deletes the compressed source file once decompression succeeds."

[[flag]]
applies_to = "unlz4"
flag = "-c"
translation_modifier = "writing decompressed output to the terminal instead of a file"
verdict = "allow"
rationale = "Leaves the source file intact; only writes to the terminal."

[[flag]]
applies_to = "unlz4"
flag = "-t"
translation_modifier = "testing compressed file integrity without producing output"
verdict = "allow"
rationale = "Read-only integrity check that does not create or modify any files."

[[flag]]
applies_to = "unlz4"
flag = "-m"
translation_modifier = "processing multiple input files at once"
verdict = "allow"
rationale = "Processes several files in one invocation; each file is decompressed individually."

[[flag]]
applies_to = "unlz4"
flag = "-r"
translation_modifier = "operating recursively on all files in directories"
verdict = "allow"
rationale = "Expands the scope to all matching files in directory trees."

[[flag]]
applies_to = "unlz4"
flag = "-v"
translation_modifier = ""
verdict = "allow"
rationale = "Only adds progress information to the output."

[[flag]]
applies_to = "unlz4"
flag = "-q"
translation_modifier = ""
verdict = "allow"
rationale = "Only suppresses warning messages."
