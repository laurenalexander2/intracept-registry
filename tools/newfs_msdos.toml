# tools/newfs_msdos.toml — FAT filesystem constructor

[[command]]
path = "newfs_msdos"
translation = "Create a new FAT12, FAT16, or FAT32 filesystem on a device."
verdict = "ask"
rationale = "Formats a device, destroying all existing data on the partition."
risk_class = "novel"

[[flag]]
applies_to = "newfs_msdos"
flag = "-N"
translation_modifier = "only printing parameters without actually creating the filesystem"
verdict = "allow"
rationale = "Dry run that does not modify the device."
arity = "Boolean"

[[flag]]
applies_to = "newfs_msdos"
flag = "-F"
translation_modifier = "using a specified filesystem type"
verdict = "allow"
rationale = "Selects FAT12, FAT16, or FAT32; no additional risk beyond the base command."
arity = "Boolean"
