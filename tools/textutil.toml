# tools/textutil.toml

[[command]]
path = "textutil"
translation = "Convert and manipulate text documents between various formats."
verdict = "allow"
rationale = "Can modify files in place when converting formats; the original format is lost without a backup."
risk_class = "novel"

[[flag]]
applies_to = "textutil"
flag = "-convert"
translation_modifier = "converting the document to a specified format"
verdict = "allow"
rationale = "Overwrites the input file with the converted format by default."
arity = "Boolean"

[[flag]]
applies_to = "textutil"
flag = "-output"
translation_modifier = "writing the result to a specified output file"
verdict = "allow"
rationale = "Preserves the original by writing to a different file."
arity = "Boolean"

[[flag]]
applies_to = "textutil"
flag = "-cat"
translation_modifier = "concatenating multiple input files"
verdict = "allow"
rationale = "Combines files into one output; originals are unchanged."
arity = "Boolean"

[[flag]]
applies_to = "textutil"
flag = "-info"
translation_modifier = "displaying information about the files without modifying them"
verdict = "allow"
rationale = "Read-only display of file information."
arity = "Boolean"

[[flag]]
applies_to = "textutil"
flag = "-stdin"
translation_modifier = "reading input from standard input instead of files"
verdict = "allow"
rationale = "Changes the input source; no additional risk."
arity = "Boolean"

[[flag]]
applies_to = "textutil"
flag = "-stdout"
translation_modifier = "writing the output to standard output instead of a file"
verdict = "allow"
rationale = "Avoids writing to disk; preserves originals."
arity = "Boolean"

[[flag]]
applies_to = "textutil"
flag = "-encoding"
translation_modifier = "using a specified text encoding for the output"
verdict = "allow"
rationale = "Controls the output encoding; does not change the scope of the operation."
arity = "Boolean"

[[flag]]
applies_to = "textutil"
flag = "-inputencoding"
translation_modifier = "interpreting all input files with a specified text encoding"
verdict = "allow"
rationale = "Controls how input is read; does not change the scope of the operation."
arity = "Boolean"

[[flag]]
applies_to = "textutil"
flag = "-format"
translation_modifier = "interpreting all input files as a specified format"
verdict = "allow"
rationale = "Overrides automatic format detection; does not change the scope of the operation."
arity = "Boolean"

[[flag]]
applies_to = "textutil"
flag = "-font"
translation_modifier = "using a specified font when converting plain text to rich text"
verdict = "allow"
rationale = "Controls font selection in the output; no additional risk."
arity = "Boolean"

[[flag]]
applies_to = "textutil"
flag = "-fontsize"
translation_modifier = "using a specified font size in points when converting plain text to rich text"
verdict = "allow"
rationale = "Controls font size in the output; no additional risk."
arity = "Boolean"

[[flag]]
applies_to = "textutil"
flag = "-strip"
translation_modifier = "removing all metadata from the output file"
verdict = "allow"
rationale = "Discards metadata like author and title; the document content is preserved."
arity = "Boolean"

[[flag]]
applies_to = "textutil"
flag = "-noload"
translation_modifier = "without loading subsidiary resources like images"
verdict = "allow"
rationale = "Skips loading external resources; reduces network and disk activity."
arity = "Boolean"

[[flag]]
applies_to = "textutil"
flag = "-nostore"
translation_modifier = "without writing subsidiary resources to disk"
verdict = "allow"
rationale = "Prevents writing of external resources; reduces output scope."
arity = "Boolean"

[[flag]]
applies_to = "textutil"
flag = "-baseurl"
translation_modifier = "using a specified base URL for resolving relative links"
verdict = "allow"
rationale = "Controls URL resolution; no additional risk."
arity = "Boolean"

[[flag]]
applies_to = "textutil"
flag = "-extension"
translation_modifier = "using a specified file extension for the output"
verdict = "allow"
rationale = "Overrides the default output file extension; no additional risk."
arity = "Boolean"
