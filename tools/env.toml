# tools/env.toml

[[command]]
path = "env"
translation = "Run a command with a modified environment or display the current environment variables."
verdict = "allow"
rationale = "Without arguments, displays environment variables. With a command, runs it in a modified environment."

[[flag]]
applies_to = "env"
flag = "-i"
translation_modifier = "starting with a completely empty environment"
verdict = "allow"
rationale = "Clears all environment variables before running the command; increases isolation."

[[flag]]
applies_to = "env"
flag = "-0"
translation_modifier = "separating output entries with null characters instead of newlines"
verdict = "allow"
rationale = "Only changes output formatting; modifies nothing."

[[flag]]
applies_to = "env"
flag = "-u"
translation_modifier = "removing a specified variable from the environment"
verdict = "allow"
rationale = "Unsets a single variable; does not persist beyond the command invocation."

[[flag]]
applies_to = "env"
flag = "-v"
translation_modifier = "printing verbose details about each processing step"
verdict = "allow"
rationale = "Only adds diagnostic output; modifies nothing."

[[flag]]
applies_to = "env"
flag = "-P"
translation_modifier = "searching for the command in an alternate set of directories instead of the standard search path"
verdict = "allow"
rationale = "Changes where the command is found but does not alter the environment or files."

[[flag]]
applies_to = "env"
flag = "-S"
translation_modifier = "splitting a single string into multiple arguments"
verdict = "allow"
rationale = "Only affects how arguments are parsed; commonly used in script interpreter lines."

[[flag]]
applies_to = "env"
flag = "-C"
translation_modifier = "changing to a specified directory before running the command"
verdict = "allow"
rationale = "Changes the working directory for the child process only; does not modify files."
