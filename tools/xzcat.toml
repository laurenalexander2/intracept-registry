# tools/xzcat.toml

[[command]]
path = "xzcat"
translation = "Decompress XZ files and write the output to the terminal."
verdict = "allow"
rationale = "Read-only decompression to the terminal; does not modify any files."
risk_class = "novel"

[[flag]]
applies_to = "xzcat"
flag = "--force"
translation_modifier = "overwriting existing output files without prompting"
verdict = "allow"
rationale = "Overwrites existing output files without confirmation; recoverable from backups."
arity = "Boolean"
