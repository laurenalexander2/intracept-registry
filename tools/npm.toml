tags.effect = ["create"]
tags.reversibility = "trivial"
tags.target = ["filesystem"]
tags.safety_override = false

# ── Missing flags on existing commands ──────────────────────────────────────

[[flag]]
applies_to = "npm install"
flag = "--save-exact"
translation_modifier = "pinning the exact version number instead of a semver range"
verdict = "allow"
rationale = "Records the precise version in package.json; reduces update flexibility but increases reproducibility."

[[flag]]
applies_to = "npm install"
flag = "--production"
translation_modifier = "skipping development dependencies"
verdict = "allow"
rationale = "Installs only production dependencies; reduces the installed package set."

[[flag]]
applies_to = "npm publish"
flag = "--tag"
translation_modifier = "publishing under a specific distribution tag instead of latest"
verdict = "allow"
rationale = "Controls which tag the version is published under; using 'latest' by mistake can affect all users."

[[flag]]
applies_to = "npm version"
flag = "--no-git-tag-version"
translation_modifier = "without creating a git commit or tag"
verdict = "allow"
rationale = "Only updates version in package.json without git operations."
tag_modifiers.target = ["filesystem"]

[[flag]]
applies_to = "npm audit fix"
flag = "--dry-run"
translation_modifier = "simulating the fixes without actually modifying any packages"
verdict = "allow"
rationale = "Shows what would be fixed without making changes."
tag_modifiers.effect = ["read"]
tag_modifiers.reversibility = "trivial"

[[flag]]
applies_to = "npm cache clean"
flag = "--force"
translation_modifier = "proceeding even though the cache is self-healing"
verdict = "allow"
rationale = "Required for cache clean to execute; npm will re-download packages as needed."
tag_modifiers.safety_override = true

[[flag]]
applies_to = "npm update"
flag = "--save"
translation_modifier = "updating the version ranges in package.json to match"
verdict = "allow"
rationale = "Modifies package.json version constraints, which affects future installs."

# ── Combos ──────────────────────────────────────────────────────────────────

[[combo]]
path = "npm audit fix --dry-run"
translation = "Simulate fixing known vulnerabilities in installed packages, showing what would change without actually modifying anything."
verdict = "allow"
rationale = "No packages are installed or modified; only displays planned fixes."
tags.scope = "remote"
tags.effect = ["read"]
tags.reversibility = "trivial"
tags.target = ["package_registry", "filesystem"]
tags.safety_override = false

[[combo]]
path = "npm audit fix --force"
translation = "Fix known vulnerabilities in installed packages by upgrading across major versions, which may introduce breaking API changes."
verdict = "require_approval"
rationale = "Installs semver-major updates that may break existing code, and bypasses the default constraint of staying within compatible version ranges."
tags.scope = "remote"
tags.effect = ["write"]
tags.reversibility = "difficult"
tags.target = ["package_registry", "filesystem"]
tags.safety_override = true

[[combo]]
path = "npm install --dry-run"
translation = "Simulate installing packages, showing what would be downloaded and changed without actually modifying the project."
verdict = "allow"
rationale = "No packages are downloaded or installed; only displays the planned installation."
tags.scope = "remote"
tags.effect = ["read"]
tags.reversibility = "trivial"
tags.target = ["package_registry", "filesystem"]
tags.safety_override = false

[[combo]]
path = "npm install --force"
translation = "Install packages while bypassing the local cache and overwriting existing packages, ignoring dependency conflict warnings."
verdict = "require_approval"
rationale = "Skips cache validation and forces installation of potentially incompatible dependencies, which may break the project."
tags.scope = "remote"
tags.effect = ["write", "create"]
tags.reversibility = "difficult"
tags.target = ["package_registry", "filesystem"]
tags.safety_override = true

[[combo]]
path = "npm install --force -g"
translation = "Force-install a package globally for all projects on this machine, bypassing the cache and overwriting any existing version."
verdict = "require_approval"
rationale = "Modifies the system-wide package directory while bypassing cache and dependency checks, potentially breaking other projects."
tags.scope = "remote"
tags.effect = ["write", "create"]
tags.reversibility = "difficult"
tags.target = ["package_registry", "filesystem"]
tags.safety_override = true

[[combo]]
path = "npm install --save-dev"
translation = "Install a package and record it as a development-only dependency in package.json."
verdict = "require_approval"
rationale = "Downloads and executes code from the npm registry, adding it to devDependencies for use during development only."
tags.scope = "remote"
tags.effect = ["write", "create"]
tags.reversibility = "difficult"
tags.target = ["package_registry", "filesystem"]
tags.safety_override = false

[[combo]]
path = "npm publish --dry-run"
translation = "Simulate publishing a package to the npm registry, showing what files would be included without actually uploading."
verdict = "allow"
rationale = "No package is uploaded; only displays the contents and metadata that would be published."
tags.scope = "remote"
tags.effect = ["read"]
tags.reversibility = "trivial"
tags.target = ["package_registry"]
tags.safety_override = false

[[combo]]
path = "npm unpublish --force"
translation = "Remove a package from the npm registry even outside the standard 72-hour safety window, breaking downstream projects that depend on it."
verdict = "require_approval"
rationale = "Bypasses npm's safety restrictions to remove a published package, potentially breaking all projects that depend on that version."
tags.scope = "remote"
tags.effect = ["delete"]
tags.reversibility = "difficult"
tags.target = ["package_registry"]
tags.safety_override = true
