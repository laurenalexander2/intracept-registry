# tools/npm.toml

# ── Commands ──────────────────────────────────────────────────────────

[[command]]
path = "npm"
translation = "Run the Node.js package manager."
verdict = "allow"
rationale = "The bare command prints help text and modifies nothing."
tags.scope = "local"
tags.effect = ["read"]
tags.reversibility = "trivial"
tags.target = ["filesystem"]
tags.safety_override = false

[[command]]
path = "npm install"
translation = "Install packages and their dependencies into the current project."
verdict = "require_approval"
rationale = "Downloads and executes arbitrary code via postinstall scripts from the npm registry."
tags.scope = "remote"
tags.effect = ["write", "create"]
tags.reversibility = "difficult"
tags.target = ["package_registry", "filesystem"]
tags.safety_override = false

[[command]]
path = "npm ci"
translation = "Install project dependencies from scratch using the lockfile."
verdict = "require_approval"
rationale = "Deletes existing node_modules and reinstalls all dependencies; executes postinstall scripts."
tags.scope = "remote"
tags.effect = ["write", "create", "delete"]
tags.reversibility = "difficult"
tags.target = ["package_registry", "filesystem"]
tags.safety_override = false

[[command]]
path = "npm uninstall"
translation = "Remove a package from the current project."
verdict = "allow"
rationale = "Removes files from node_modules and updates package.json; changes are local and reversible."
tags.scope = "local"
tags.effect = ["delete"]
tags.reversibility = "trivial"
tags.target = ["filesystem"]
tags.safety_override = false

[[command]]
path = "npm update"
translation = "Update installed packages to their latest allowed versions."
verdict = "allow"
rationale = "Fetches and installs new package versions, which may introduce breaking changes or run postinstall scripts."
tags.scope = "remote"
tags.effect = ["write"]
tags.reversibility = "difficult"
tags.target = ["package_registry", "filesystem"]
tags.safety_override = false

[[command]]
path = "npm run"
translation = "Execute a script defined in the project's package.json."
verdict = "allow"
rationale = "Runs arbitrary shell commands defined in package.json scripts."
tags.scope = "local"
tags.effect = ["execute"]
tags.reversibility = "difficult"
tags.target = ["filesystem"]
tags.safety_override = false

[[command]]
path = "npm exec"
translation = "Run a command from a local or remote npm package."
verdict = "allow"
rationale = "Downloads and executes a package, running arbitrary code even if not previously installed."
tags.scope = "remote"
tags.effect = ["execute"]
tags.reversibility = "difficult"
tags.target = ["package_registry", "filesystem"]
tags.safety_override = false

[[command]]
path = "npm publish"
translation = "Upload a package to the npm registry."
verdict = "require_approval"
rationale = "Makes code publicly available on the registry; publishing incorrect or sensitive code is difficult to fully retract."
tags.scope = "remote"
tags.effect = ["write"]
tags.reversibility = "difficult"
tags.target = ["package_registry"]
tags.safety_override = false

[[command]]
path = "npm unpublish"
translation = "Remove a package version from the npm registry."
verdict = "require_approval"
rationale = "Removes a published version from the registry; npm enforces a 72-hour safety window and version restrictions by default."
tags.scope = "remote"
tags.effect = ["delete"]
tags.reversibility = "difficult"
tags.target = ["package_registry"]
tags.safety_override = false

[[command]]
path = "npm audit"
translation = "Check installed packages for known security vulnerabilities."
verdict = "allow"
rationale = "Read-only analysis of the dependency tree against a vulnerability database."
tags.scope = "remote"
tags.effect = ["read"]
tags.reversibility = "trivial"
tags.target = ["package_registry"]
tags.safety_override = false

[[command]]
path = "npm audit fix"
translation = "Automatically install patched versions of packages with known vulnerabilities."
verdict = "allow"
rationale = "Modifies installed dependencies, which may introduce breaking changes or run postinstall scripts."
tags.scope = "remote"
tags.effect = ["write"]
tags.reversibility = "difficult"
tags.target = ["package_registry", "filesystem"]
tags.safety_override = false

[[command]]
path = "npm init"
translation = "Create a new package.json file for a project."
verdict = "allow"
rationale = "Generates a configuration file in the current directory; does not install or execute packages."
tags.scope = "local"
tags.effect = ["create"]
tags.reversibility = "trivial"
tags.target = ["filesystem"]
tags.safety_override = false

[[command]]
path = "npm link"
translation = "Create a symbolic link to a local package for development use."
verdict = "allow"
rationale = "Modifies the global node_modules directory and can redirect package resolution to unexpected locations."
tags.scope = "local"
tags.effect = ["create", "write"]
tags.reversibility = "trivial"
tags.target = ["filesystem"]
tags.safety_override = false

[[command]]
path = "npm cache clean"
translation = "Delete all data from the local npm cache."
verdict = "allow"
rationale = "Removes cached package data; npm will re-download packages as needed."
tags.scope = "local"
tags.effect = ["delete"]
tags.reversibility = "trivial"
tags.target = ["filesystem"]
tags.safety_override = false

[[command]]
path = "npm config set"
translation = "Set a configuration value in the npm configuration file."
verdict = "allow"
rationale = "Changes npm behavior including registry URLs, authentication tokens, and script execution settings."
tags.scope = "local"
tags.effect = ["write"]
tags.reversibility = "trivial"
tags.target = ["config"]
tags.safety_override = false

[[command]]
path = "npm prune"
translation = "Remove packages not listed as dependencies in package.json."
verdict = "allow"
rationale = "Removes extraneous packages from node_modules; reversible by running npm install."
tags.scope = "local"
tags.effect = ["delete"]
tags.reversibility = "trivial"
tags.target = ["filesystem"]
tags.safety_override = false

[[command]]
path = "npm deprecate"
translation = "Mark a package version with a deprecation warning on the registry."
verdict = "require_approval"
rationale = "Adds a public warning visible to all users of the package; reversal requires republishing."
tags.scope = "remote"
tags.effect = ["write"]
tags.reversibility = "trivial"
tags.target = ["package_registry"]
tags.safety_override = false

[[command]]
path = "npm dist-tag add"
translation = "Assign a distribution tag to a specific published package version."
verdict = "require_approval"
rationale = "Changes which version users receive by default when installing, potentially directing them to untested code."
tags.scope = "remote"
tags.effect = ["write"]
tags.reversibility = "trivial"
tags.target = ["package_registry"]
tags.safety_override = false

[[command]]
path = "npm dist-tag rm"
translation = "Remove a distribution tag from a package on the registry."
verdict = "require_approval"
rationale = "Removes a named tag, which may break installation workflows that reference it."
tags.scope = "remote"
tags.effect = ["delete"]
tags.reversibility = "difficult"
tags.target = ["package_registry"]
tags.safety_override = false

[[command]]
path = "npm login"
translation = "Authenticate to an npm registry and save the credentials locally."
verdict = "allow"
rationale = "Stores registry credentials locally; does not modify packages or the registry."
tags.scope = "remote"
tags.effect = ["write"]
tags.reversibility = "trivial"
tags.target = ["credentials"]
tags.safety_override = false

[[command]]
path = "npm whoami"
translation = "Display the username of the currently logged-in npm user."
verdict = "allow"
rationale = "Read-only query that prints the authenticated username."
tags.scope = "remote"
tags.effect = ["read"]
tags.reversibility = "trivial"
tags.target = ["credentials"]
tags.safety_override = false

[[command]]
path = "npm pack"
translation = "Create a compressed archive of a package without publishing it."
verdict = "allow"
rationale = "Produces a local tarball file; does not upload anything to the registry."
tags.scope = "local"
tags.effect = ["create"]
tags.reversibility = "trivial"
tags.target = ["filesystem"]
tags.safety_override = false

[[command]]
path = "npm version"
translation = "Bump the version number in package.json and create a git tag."
verdict = "allow"
rationale = "Modifies package.json, creates a git commit, and tags the repository."
tags.scope = "local"
tags.effect = ["write"]
tags.reversibility = "trivial"
tags.target = ["filesystem", "repository"]
tags.safety_override = false

[[command]]
path = "npm dedupe"
translation = "Reduce duplication by restructuring the package dependency tree."
verdict = "allow"
rationale = "Reorganizes node_modules to eliminate duplicate packages; does not add or remove dependencies."
tags.scope = "local"
tags.effect = ["write"]
tags.reversibility = "trivial"
tags.target = ["filesystem"]
tags.safety_override = false

# ── Flags ─────────────────────────────────────────────────────────────

[[flag]]
applies_to = "npm install"
flag = "-g"
translation_modifier = "installing globally for all projects on this machine"
verdict = "allow"
rationale = "Modifies the system-wide package directory, which can affect all Node.js projects."

[[flag]]
applies_to = "npm install"
flag = "--force"
translation_modifier = "bypassing cache and overwriting existing packages"
verdict = "allow"
rationale = "Ignores cache and allows incompatible dependency resolution, but the result is a local node_modules change recoverable with npm ci."
tag_modifiers.safety_override = true

[[flag]]
applies_to = "npm install"
flag = "--legacy-peer-deps"
translation_modifier = "ignoring peer dependency version conflicts"
verdict = "allow"
rationale = "Skips peer dependency checks, which may result in incompatible package combinations at runtime."
tag_modifiers.safety_override = true

[[flag]]
applies_to = "npm install"
flag = "--ignore-scripts"
translation_modifier = "skipping all pre- and post-install scripts"
verdict = "allow"
rationale = "Prevents execution of lifecycle scripts, reducing the risk of arbitrary code execution during installation."

[[flag]]
applies_to = "npm install"
flag = "--save-dev"
translation_modifier = "adding the package as a development-only dependency"
verdict = "allow"
rationale = "Records the package under devDependencies in package.json; does not change installation behavior."

[[flag]]
applies_to = "npm install"
flag = "--dry-run"
translation_modifier = "simulating the installation without making any changes"
verdict = "allow"
rationale = "Reports what would be installed without downloading or writing any files."
tag_modifiers.effect = ["read"]
tag_modifiers.reversibility = "trivial"

[[flag]]
applies_to = "npm publish"
flag = "--dry-run"
translation_modifier = "simulating the publish without uploading to the registry"
verdict = "allow"
rationale = "Shows what would be published without actually uploading the package."
tag_modifiers.effect = ["read"]
tag_modifiers.reversibility = "trivial"

[[flag]]
applies_to = "npm publish"
flag = "--access"
translation_modifier = "setting the package visibility on the registry"
verdict = "allow"
rationale = "Controls whether the package is public or restricted; public packages are visible to everyone."

[[flag]]
applies_to = "npm unpublish"
flag = "--force"
translation_modifier = "removing the package even outside the standard safety period"
verdict = "require_approval"
rationale = "Bypasses npm's safety restrictions on unpublishing, enabling removal of packages that others may depend on."
tag_modifiers.safety_override = true

[[flag]]
applies_to = "npm audit fix"
flag = "--force"
translation_modifier = "installing semver-major updates to fix vulnerabilities"
verdict = "require_approval"
rationale = "Upgrades dependencies across major versions, which may introduce breaking API changes."
tag_modifiers.safety_override = true

[[flag]]
applies_to = "npm ci"
flag = "--ignore-scripts"
translation_modifier = "skipping all pre- and post-install scripts"
verdict = "allow"
rationale = "Prevents execution of lifecycle scripts, reducing the risk of arbitrary code execution during installation."

[[flag]]
applies_to = "npm config set"
flag = "-g"
translation_modifier = "modifying the system-wide npm configuration"
verdict = "allow"
rationale = "Changes npm settings for all projects on the machine, not just the current project."

[[flag]]
applies_to = "npm uninstall"
flag = "-g"
translation_modifier = "removing the package from the global installation"
verdict = "allow"
rationale = "Modifies the system-wide package directory, which can affect all Node.js projects."

[[flag]]
applies_to = "npm update"
flag = "-g"
translation_modifier = "updating globally installed packages"
verdict = "allow"
rationale = "Modifies the system-wide package directory, which can affect all Node.js projects."

