# tools/nm.toml

[[command]]
path = "nm"
translation = "List the named functions and variables stored inside a compiled program or library."
verdict = "allow"
rationale = "Read-only inspection of compiled file contents; does not modify any files."

[[flag]]
applies_to = "nm"
flag = "-g"
translation_modifier = "showing only names that are visible to other programs"
verdict = "allow"
rationale = "Filters output to externally accessible names; still read-only."

[[flag]]
applies_to = "nm"
flag = "-u"
translation_modifier = "showing only names that are referenced but not defined in this file"
verdict = "allow"
rationale = "Filters output to missing dependencies; still read-only."

[[flag]]
applies_to = "nm"
flag = "-U"
translation_modifier = "hiding names that are referenced but not defined in this file"
verdict = "allow"
rationale = "Filters out undefined references; still read-only."

[[flag]]
applies_to = "nm"
flag = "-n"
translation_modifier = "sorted by memory address instead of alphabetically"
verdict = "allow"
rationale = "Changes output order; still read-only."

[[flag]]
applies_to = "nm"
flag = "-r"
translation_modifier = "sorted in reverse order"
verdict = "allow"
rationale = "Reverses the sort direction; still read-only."

[[flag]]
applies_to = "nm"
flag = "-a"
translation_modifier = "including all entries, even those used only for debugging"
verdict = "allow"
rationale = "Shows additional detail; still read-only."

[[flag]]
applies_to = "nm"
flag = "-j"
translation_modifier = "showing only the names without addresses or types"
verdict = "allow"
rationale = "Simplifies output format; still read-only."

[[flag]]
applies_to = "nm"
flag = "-m"
translation_modifier = "showing detailed information about where each name is stored"
verdict = "allow"
rationale = "Provides more descriptive output about each entry; still read-only."

[[flag]]
applies_to = "nm"
flag = "-p"
translation_modifier = "without sorting, preserving the original order"
verdict = "allow"
rationale = "Disables sorting; still read-only."

[[flag]]
applies_to = "nm"
flag = "-x"
translation_modifier = "displaying all values in hexadecimal format"
verdict = "allow"
rationale = "Changes number display format; still read-only."

[[flag]]
applies_to = "nm"
flag = "-A"
translation_modifier = "prefixing each line with the file name"
verdict = "allow"
rationale = "Adds file identification to each output line; still read-only."
