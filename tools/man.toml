# tools/man.toml

[[command]]
path = "man"
translation = "Display the manual page for a command or topic."
verdict = "allow"
rationale = "Read-only display of documentation."

[[flag]]
applies_to = "man"
flag = "-k"
translation_modifier = "searching manual page descriptions for a keyword"
verdict = "allow"
rationale = "Only changes the search mode; still read-only."

[[flag]]
applies_to = "man"
flag = "-f"
translation_modifier = "showing only the one-line description for each matching page"
verdict = "allow"
rationale = "Limits output to brief descriptions; still read-only."

[[flag]]
applies_to = "man"
flag = "-a"
translation_modifier = "showing all matching manual pages instead of just the first"
verdict = "allow"
rationale = "Only changes how many results are displayed."

[[flag]]
applies_to = "man"
flag = "-w"
translation_modifier = "printing the file path of the manual page instead of displaying it"
verdict = "allow"
rationale = "Only outputs a file path; does not display or modify anything."

[[flag]]
applies_to = "man"
flag = "-S"
translation_modifier = "restricting the search to specified manual sections"
verdict = "allow"
rationale = "Limits which sections are searched; still read-only."

[[flag]]
applies_to = "man"
flag = "-M"
translation_modifier = "searching for manual pages in a specified directory path"
verdict = "allow"
rationale = "Changes where manual pages are looked up; still read-only."
