# tools/diff.toml

[[command]]
path = "diff"
translation = "Compare two files or directories and show the differences."
verdict = "allow"
rationale = "Read-only comparison that outputs differences without modifying either file."
risk_class = "novel"

[[flag]]
applies_to = "diff"
flag = "-r"
translation_modifier = "recursively comparing all files in subdirectories"
verdict = "allow"
rationale = "Extends comparison to entire directory trees; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "diff"
flag = "-u"
translation_modifier = "showing differences in unified format with context lines"
verdict = "allow"
rationale = "Changes the output format; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "diff"
flag = "-q"
translation_modifier = "only reporting whether files differ, not showing the details"
verdict = "allow"
rationale = "Simplifies output; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "diff"
flag = "-c"
translation_modifier = "showing differences in context format with surrounding lines"
verdict = "allow"
rationale = "Changes the output format; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "diff"
flag = "-i"
translation_modifier = "ignoring differences between uppercase and lowercase letters"
verdict = "allow"
rationale = "Loosens the comparison criteria; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "diff"
flag = "-w"
translation_modifier = "ignoring all whitespace differences"
verdict = "allow"
rationale = "Ignores spaces and tabs when comparing; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "diff"
flag = "-b"
translation_modifier = "ignoring changes in the amount of whitespace"
verdict = "allow"
rationale = "Treats multiple spaces as equivalent to one; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "diff"
flag = "-B"
translation_modifier = "ignoring changes that only add or remove blank lines"
verdict = "allow"
rationale = "Skips blank-line-only differences; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "diff"
flag = "-y"
translation_modifier = "showing the two files side by side"
verdict = "allow"
rationale = "Changes the output layout; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "diff"
flag = "-a"
translation_modifier = "treating all files as text even if they appear to contain non-text data"
verdict = "allow"
rationale = "Forces text comparison mode; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "diff"
flag = "-N"
translation_modifier = "treating missing files as empty when comparing directories"
verdict = "allow"
rationale = "Shows full content of files that exist in only one directory; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "diff"
flag = "-p"
translation_modifier = "showing which function each change appears in"
verdict = "allow"
rationale = "Adds function context to the output; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "diff"
flag = "--color"
translation_modifier = ""
verdict = "allow"
rationale = "Adds color highlighting to the output; purely cosmetic."
arity = "Boolean"

[[flag]]
applies_to = "diff"
flag = "-d"
translation_modifier = "trying harder to find the smallest possible set of differences"
verdict = "allow"
rationale = "Uses more processing power for a more precise result; still read-only."
arity = "Boolean"
