# tools/lpadmin.toml

[[command]]
path = "lpadmin"
translation = "Configure CUPS printers and printer classes."
verdict = "allow"
rationale = "Modifies the print system configuration, adding, removing, or changing printers."
risk_class = "novel"

[[flag]]
applies_to = "lpadmin"
flag = "-d"
translation_modifier = "setting the default printer"
verdict = "allow"
rationale = "Only changes which printer is used by default."
arity = "Boolean"

[[flag]]
applies_to = "lpadmin"
flag = "-p"
translation_modifier = "configuring a specific printer"
verdict = "allow"
rationale = "Creates or modifies a printer queue's settings."
arity = "Boolean"

[[flag]]
applies_to = "lpadmin"
flag = "-x"
translation_modifier = "deleting a printer or class and canceling its pending jobs"
verdict = "ask"
rationale = "Permanently removes a printer and discards all its pending print jobs."
arity = "Boolean"

[[flag]]
applies_to = "lpadmin"
flag = "-v"
translation_modifier = "setting the device address for the printer"
verdict = "allow"
rationale = "Changes where print jobs are sent; an incorrect address will cause print failures."
arity = "Boolean"

[[flag]]
applies_to = "lpadmin"
flag = "-m"
translation_modifier = "setting the printer driver model"
verdict = "allow"
rationale = "Changes how print data is formatted for the printer."
arity = "Boolean"

[[flag]]
applies_to = "lpadmin"
flag = "-E"
translation_modifier = "enabling the printer to accept and process jobs"
verdict = "allow"
rationale = "Activates the printer queue so it begins accepting and printing jobs."
arity = "Boolean"

[[flag]]
applies_to = "lpadmin"
flag = "-c"
translation_modifier = "adding the printer to a class"
verdict = "allow"
rationale = "Groups the printer with others; creates the class if it does not exist."
arity = "Boolean"

[[flag]]
applies_to = "lpadmin"
flag = "-r"
translation_modifier = "removing the printer from a class"
verdict = "allow"
rationale = "Removes the printer from a group and deletes the class if it becomes empty."
arity = "Boolean"

[[flag]]
applies_to = "lpadmin"
flag = "-u"
translation_modifier = "setting user-level access controls on the printer"
verdict = "allow"
rationale = "Restricts or grants printing access for specific users or groups."
arity = "Boolean"

[[flag]]
applies_to = "lpadmin"
flag = "-D"
translation_modifier = "setting a text description for the printer"
verdict = "allow"
rationale = "Only changes the display description; does not affect printing behavior."
arity = "Boolean"

[[flag]]
applies_to = "lpadmin"
flag = "-L"
translation_modifier = "setting a text location for the printer"
verdict = "allow"
rationale = "Only changes the display location; does not affect printing behavior."
arity = "Boolean"
