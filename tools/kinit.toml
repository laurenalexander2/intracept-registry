# tools/kinit.toml

[[command]]
path = "kinit"
translation = "Obtain a Kerberos ticket-granting ticket."
verdict = "allow"
rationale = "Acquires authentication credentials; does not modify any services or data."

[[flag]]
applies_to = "kinit"
flag = "-R"
translation_modifier = "renewing an existing ticket instead of obtaining a new one"
verdict = "allow"
rationale = "Extends the lifetime of a current credential; does not grant new access."

[[flag]]
applies_to = "kinit"
flag = "-k"
translation_modifier = "authenticating using a keytab file instead of a password"
verdict = "allow"
rationale = "Uses a pre-shared key for authentication; commonly used in automated scripts."

[[flag]]
applies_to = "kinit"
flag = "-f"
translation_modifier = "requesting a forwardable ticket"
verdict = "allow"
rationale = "Allows the ticket to be forwarded to other hosts; does not change what is accessed."

[[flag]]
applies_to = "kinit"
flag = "-p"
translation_modifier = "requesting a proxiable ticket"
verdict = "allow"
rationale = "Allows the ticket to be proxied; does not change what is accessed."

[[flag]]
applies_to = "kinit"
flag = "-l"
translation_modifier = "setting the ticket lifetime"
verdict = "allow"
rationale = "Controls how long the ticket remains valid; does not change access scope."

[[flag]]
applies_to = "kinit"
flag = "-r"
translation_modifier = "setting the maximum renewable lifetime for the ticket"
verdict = "allow"
rationale = "Controls the renewable window; does not change access scope."

[[flag]]
applies_to = "kinit"
flag = "-c"
translation_modifier = "storing the ticket in a specific credential cache"
verdict = "allow"
rationale = "Selects a non-default cache location; does not change the authentication."

[[flag]]
applies_to = "kinit"
flag = "-t"
translation_modifier = "using a specific keytab file for authentication"
verdict = "allow"
rationale = "Selects a non-default keytab; commonly used in automated environments."

[[flag]]
applies_to = "kinit"
flag = "-A"
translation_modifier = "requesting a ticket with no addresses"
verdict = "allow"
rationale = "Makes the ticket usable from any network address; does not change access scope."

[[flag]]
applies_to = "kinit"
flag = "--anonymous"
translation_modifier = "requesting an anonymous ticket"
verdict = "allow"
rationale = "Acquires a ticket for an anonymous principal; does not expose identity."

[[flag]]
applies_to = "kinit"
flag = "--password-file"
translation_modifier = "reading the password from a file instead of prompting"
verdict = "allow"
rationale = "Non-interactive password input; commonly used in automated scripts."

[[flag]]
applies_to = "kinit"
flag = "-S"
translation_modifier = "requesting a ticket for a specific service instead of the default"
verdict = "allow"
rationale = "Changes the target service; does not modify any service state."

[[flag]]
applies_to = "kinit"
flag = "-V"
translation_modifier = ""
verdict = "allow"
rationale = "Only increases the amount of output displayed."
