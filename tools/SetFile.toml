# tools/SetFile.toml

[[command]]
path = "SetFile"
translation = "Set HFS+ file attributes on files and directories."
verdict = "allow"
rationale = "Modifies file metadata such as type, creator, dates, and visibility flags; changes are reversible but may affect how Finder displays files."
risk_class = "novel"

[[flag]]
applies_to = "SetFile"
flag = "-a"
translation_modifier = "setting specific file attribute flags"
verdict = "allow"
rationale = "Changes file attributes like visibility and lock status; incorrect settings may hide files or prevent editing."
arity = "Boolean"

[[flag]]
applies_to = "SetFile"
flag = "-c"
translation_modifier = "setting the file creator code"
verdict = "allow"
rationale = "Changes legacy creator metadata; minimal practical impact on modern macOS."
arity = "Boolean"

[[flag]]
applies_to = "SetFile"
flag = "-t"
translation_modifier = "setting the file type code"
verdict = "allow"
rationale = "Changes legacy type metadata; minimal practical impact on modern macOS."
arity = "Boolean"

[[flag]]
applies_to = "SetFile"
flag = "-d"
translation_modifier = "setting the creation date"
verdict = "allow"
rationale = "Modifies file creation timestamp; cosmetic metadata change."
arity = "Boolean"

[[flag]]
applies_to = "SetFile"
flag = "-m"
translation_modifier = "setting the modification date"
verdict = "allow"
rationale = "Modifies file modification timestamp; cosmetic metadata change."
arity = "Boolean"
