# tools/lprm.toml

[[command]]
path = "lprm"
translation = "Cancel pending print jobs."
verdict = "allow"
rationale = "Removes print jobs from the queue; the job must be resubmitted if still needed."
risk_class = "novel"

[[flag]]
applies_to = "lprm"
flag = "-P"
translation_modifier = "canceling jobs on a specific printer"
verdict = "allow"
rationale = "Targets a specific printer queue for job cancellation."
arity = "Boolean"

[[flag]]
applies_to = "lprm"
flag = "-"
translation_modifier = "canceling all print jobs"
verdict = "ask"
rationale = "Removes every pending print job from the queue."
arity = "Boolean"

[[flag]]
applies_to = "lprm"
flag = "-E"
translation_modifier = "using an encrypted connection to the print server"
verdict = "allow"
rationale = "Only changes connection security; does not affect which jobs are canceled."
arity = "Boolean"

[[flag]]
applies_to = "lprm"
flag = "-U"
translation_modifier = "connecting as a specific user"
verdict = "allow"
rationale = "Only changes the username used for authentication."
arity = "Boolean"
