# tools/autopoint.toml

[[command]]
path = "autopoint"
translation = "Copy GNU gettext infrastructure files to a source package."
verdict = "allow"
rationale = "Copies template files for internationalization; does not modify existing code."
risk_class = "novel"

[[flag]]
applies_to = "autopoint"
flag = "--force"
translation_modifier = "overwriting existing output files"
verdict = "allow"
rationale = "Bypasses the overwrite prompt, silently replacing existing output files."
arity = "Boolean"
