# tools/otool.toml — Mach-O object file display tool

[[command]]
path = "otool"
translation = "Display the contents and structure of Apple platform object files and libraries."
verdict = "allow"
rationale = "Read-only inspection of binary file metadata and code; does not modify anything."

[[flag]]
applies_to = "otool"
flag = "-L"
translation_modifier = "showing the shared libraries the file links against"
verdict = "allow"
rationale = "Read-only display of library dependencies."

[[flag]]
applies_to = "otool"
flag = "-h"
translation_modifier = "showing the binary file header"
verdict = "allow"
rationale = "Read-only display of the file header."

[[flag]]
applies_to = "otool"
flag = "-l"
translation_modifier = "showing the load commands"
verdict = "allow"
rationale = "Read-only display of load command details."

[[flag]]
applies_to = "otool"
flag = "-t"
translation_modifier = "showing the executable code section"
verdict = "allow"
rationale = "Read-only display of the text section contents."

[[flag]]
applies_to = "otool"
flag = "-d"
translation_modifier = "showing the data section"
verdict = "allow"
rationale = "Read-only display of the data section contents."

[[flag]]
applies_to = "otool"
flag = "-D"
translation_modifier = "showing only the install name of a shared library"
verdict = "allow"
rationale = "Read-only display of a single metadata value."

[[flag]]
applies_to = "otool"
flag = "-v"
translation_modifier = "showing symbolic names instead of raw numbers"
verdict = "allow"
rationale = "Improves readability of output; still read-only."

[[flag]]
applies_to = "otool"
flag = "-V"
translation_modifier = "showing symbolic names for both instructions and their operands"
verdict = "allow"
rationale = "Provides the most detailed symbolic disassembly; still read-only."

[[flag]]
applies_to = "otool"
flag = "-I"
translation_modifier = "showing the indirect symbol table"
verdict = "allow"
rationale = "Read-only display of indirect symbol references."

[[flag]]
applies_to = "otool"
flag = "-r"
translation_modifier = "showing the relocation entries"
verdict = "allow"
rationale = "Read-only display of relocation information."

[[flag]]
applies_to = "otool"
flag = "-S"
translation_modifier = "showing the contents of the archive symbol definition file"
verdict = "allow"
rationale = "Read-only display of archive metadata."

[[flag]]
applies_to = "otool"
flag = "-P"
translation_modifier = "showing the info property list embedded in the binary"
verdict = "allow"
rationale = "Read-only display of embedded metadata."
