# tools/more.toml

[[command]]
path = "more"
translation = "Display file contents one screen at a time in the terminal."
verdict = "allow"
rationale = "Read-only display of file contents; modifies nothing."

[[flag]]
applies_to = "more"
flag = "-N"
translation_modifier = "showing line numbers at the start of each line"
verdict = "allow"
rationale = "Adds line numbers to the display; purely cosmetic and changes nothing on disk."

[[flag]]
applies_to = "more"
flag = "-i"
translation_modifier = "ignoring upper and lower case differences when searching"
verdict = "allow"
rationale = "Makes text searches case-insensitive; read-only behavior change."

[[flag]]
applies_to = "more"
flag = "-s"
translation_modifier = "collapsing multiple blank lines into a single blank line"
verdict = "allow"
rationale = "Compresses consecutive blank lines in the display; does not alter the file."

[[flag]]
applies_to = "more"
flag = "-S"
translation_modifier = "cutting off long lines at the screen edge instead of wrapping them"
verdict = "allow"
rationale = "Changes how long lines are displayed; does not modify the file."

[[flag]]
applies_to = "more"
flag = "-F"
translation_modifier = "exiting immediately if the entire file fits on one screen"
verdict = "allow"
rationale = "Skips the pager entirely for short files; read-only convenience behavior."

[[flag]]
applies_to = "more"
flag = "-n"
translation_modifier = "hiding line numbers from prompts and status messages"
verdict = "allow"
rationale = "Suppresses line number information in the display; purely cosmetic."

[[flag]]
applies_to = "more"
flag = "+F"
translation_modifier = "following the end of the file in real time as new content is added"
verdict = "allow"
rationale = "Continuously watches for new data appended to the file; read-only monitoring."
