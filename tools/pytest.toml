# tools/pytest.toml

# ── Base command ─────────────────────────────────────────────────────────────

[[command]]
path = "pytest"
translation = "Run Python tests using the pytest framework."
verdict = "allow"
rationale = "Executes test code; primarily a read-only testing operation."
# ── Flags ────────────────────────────────────────────────────────────────────
risk_class = "novel"


[[flag]]
applies_to = "pytest"
flag = "-v"
translation_modifier = "with verbose output showing individual test names"
verdict = "allow"
rationale = "Changes output formatting; does not affect test behavior."
arity = "Boolean"

[[flag]]
applies_to = "pytest"
flag = "-x"
translation_modifier = "stopping on the first failure"
verdict = "allow"
rationale = "Exits early on failure; reduces the scope of the test run."
arity = "Boolean"

[[flag]]
applies_to = "pytest"
flag = "--tb"
translation_modifier = "with a specified traceback display style"
verdict = "allow"
rationale = "Changes error output formatting; does not affect test behavior."
arity = "Boolean"

[[flag]]
applies_to = "pytest"
flag = "-k"
translation_modifier = "filtering tests by a keyword expression"
verdict = "allow"
rationale = "Limits which tests are run; reduces the scope of the test run."
arity = "Boolean"

[[flag]]
applies_to = "pytest"
flag = "--cov"
translation_modifier = "measuring code coverage for the specified package"
verdict = "allow"
rationale = "Adds coverage instrumentation; does not change test behavior."
arity = "Boolean"

[[flag]]
applies_to = "pytest"
flag = "-n"
translation_modifier = "running tests in parallel across multiple workers"
verdict = "allow"
rationale = "Increases concurrency; does not change what tests are executed."
arity = "Boolean"

[[flag]]
applies_to = "pytest"
flag = "--lf"
translation_modifier = "rerunning only the tests that failed in the last session"
verdict = "allow"
rationale = "Limits which tests are run based on previous results."
arity = "Boolean"

[[flag]]
applies_to = "pytest"
flag = "-s"
translation_modifier = "disabling output capture so print statements appear immediately"
verdict = "allow"
rationale = "Changes output handling; does not affect test behavior."
arity = "Boolean"

[[flag]]
applies_to = "pytest"
flag = "--pdb"
translation_modifier = "dropping into the Python debugger on failure"
verdict = "allow"
rationale = "Pauses execution for interactive debugging; does not modify files."
arity = "Boolean"

[[flag]]
applies_to = "pytest"
flag = "-q"
translation_modifier = "with minimal output"
verdict = "allow"
rationale = "Reduces output verbosity; does not affect test behavior."
arity = "Boolean"

[[flag]]
applies_to = "pytest"
flag = "--strict-markers"
translation_modifier = "failing if any test uses an unregistered marker"
verdict = "allow"
rationale = "Adds stricter validation; a safety check that catches misconfigured tests."
# ── Combos ───────────────────────────────────────────────────────────────────
arity = "Boolean"


[[combo]]
path = "pytest --cov -v"
translation = "Run Python tests with verbose output and code coverage measurement for the specified package."
verdict = "allow"
rationale = "Combines verbose output with coverage instrumentation for detailed test reporting."
risk_class = "novel"

[[combo]]
path = "pytest --pdb -x"
translation = "Run Python tests, stopping on the first failure and dropping into the Python debugger to inspect the error."
verdict = "allow"
rationale = "Stops early and opens an interactive debugger session, useful for diagnosing test failures."
risk_class = "novel"

[[combo]]
path = "pytest --lf -x"
translation = "Rerun only the tests that failed in the last session, stopping on the first new failure."
verdict = "allow"
rationale = "Focuses on previously failing tests and exits early, enabling a fast red-green debugging loop."
risk_class = "novel"
