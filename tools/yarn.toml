# tools/yarn.toml

# ── Base command ─────────────────────────────────────────────────────────────

[[command]]
path = "yarn"
translation = "Run the Yarn package manager for JavaScript projects."
verdict = "allow"
rationale = "The bare command runs install by default; equivalent to yarn install."
tags.scope = "remote"
tags.effect = ["create", "execute"]
tags.reversibility = "trivial"
tags.target = ["package_registry", "filesystem"]
tags.safety_override = false

# ── Installing ──────────────────────────────────────────────────────────────

[[command]]
path = "yarn install"
translation = "Install all dependencies listed in the project's package.json."
verdict = "require_approval"
rationale = "Downloads and installs packages from the registry, which execute install scripts that may modify the system."
tags.scope = "remote"
tags.effect = ["create", "execute"]
tags.reversibility = "trivial"
tags.target = ["package_registry", "filesystem"]
tags.safety_override = false

[[flag]]
applies_to = "yarn install"
flag = "--immutable"
translation_modifier = "failing if the lockfile would need to be updated"
verdict = "allow"
rationale = "Prevents lockfile changes; a safety check for CI environments."

[[flag]]
applies_to = "yarn install"
flag = "--frozen-lockfile"
translation_modifier = "failing if the lockfile would need to be updated"
verdict = "allow"
rationale = "Prevents lockfile changes; a safety check for CI environments in Yarn v1."

# ── Adding dependencies ─────────────────────────────────────────────────────

[[command]]
path = "yarn add"
translation = "Add a dependency to the project."
verdict = "require_approval"
rationale = "Downloads and installs a package, modifying package.json and the lockfile."
tags.scope = "remote"
tags.effect = ["create", "write"]
tags.reversibility = "trivial"
tags.target = ["package_registry", "filesystem"]
tags.safety_override = false

[[flag]]
applies_to = "yarn add"
flag = "--dev"
translation_modifier = "as a development dependency"
verdict = "allow"
rationale = "Changes the dependency category but does not alter the installation behavior."

# ── Removing dependencies ─��─────────────────────────────────────────────────

[[command]]
path = "yarn remove"
translation = "Remove a dependency from the project."
verdict = "allow"
rationale = "Uninstalls a package and modifies package.json and the lockfile."
tags.scope = "local"
tags.effect = ["delete", "write"]
tags.reversibility = "trivial"
tags.target = ["package_registry", "filesystem"]
tags.safety_override = false

# ── Running scripts ─────────────────────────────────────────────────────────

[[command]]
path = "yarn run"
translation = "Run a script defined in the project's package.json."
verdict = "allow"
rationale = "Executes an arbitrary script, which may perform any action."
tags.scope = "local"
tags.effect = ["execute"]
tags.reversibility = "trivial"
tags.target = ["filesystem"]
tags.safety_override = false

[[command]]
path = "yarn dlx"
translation = "Run a package in a temporary environment without installing it permanently."
verdict = "allow"
rationale = "Downloads and executes remote code from the registry."
tags.scope = "remote"
tags.effect = ["execute"]
tags.reversibility = "trivial"
tags.target = ["package_registry", "filesystem"]
tags.safety_override = false

# ── Cache ───────────────────────────────────────────────────────────────────

[[command]]
path = "yarn cache clean"
translation = "Remove shared cache files used by Yarn."
verdict = "allow"
rationale = "Deletes cached packages; they will be re-downloaded on next install."
tags.scope = "local"
tags.effect = ["delete"]
tags.reversibility = "difficult"
tags.target = ["filesystem"]
tags.safety_override = false

[[flag]]
applies_to = "yarn cache clean"
flag = "--all"
translation_modifier = "removing the entire cache including mirror files"
verdict = "allow"
rationale = "Deletes all cached data, which may significantly slow down the next install."

# ── Scaffolding ─────────────────────────────────────────────────────────────

[[command]]
path = "yarn init"
translation = "Create a new package.json file in the current directory."
verdict = "allow"
rationale = "Creates a configuration file; does not install anything."
tags.scope = "local"
tags.effect = ["create"]
tags.reversibility = "trivial"
tags.target = ["filesystem"]
tags.safety_override = false

# ── Updating dependencies ───────────────────────────────────────────────────

[[command]]
path = "yarn up"
translation = "Update project dependencies to newer versions."
verdict = "allow"
rationale = "Modifies the lockfile and installs new package versions that may introduce breaking changes."
tags.scope = "remote"
tags.effect = ["write"]
tags.reversibility = "difficult"
tags.target = ["package_registry", "filesystem"]
tags.safety_override = false

[[command]]
path = "yarn upgrade"
translation = "Update project dependencies to newer versions."
verdict = "allow"
rationale = "Modifies the lockfile and installs new package versions that may introduce breaking changes."
tags.scope = "remote"
tags.effect = ["write"]
tags.reversibility = "difficult"
tags.target = ["package_registry", "filesystem"]
tags.safety_override = false

[[flag]]
applies_to = "yarn upgrade"
flag = "--latest"
translation_modifier = "ignoring the version ranges in package.json and upgrading to the absolute latest versions"
verdict = "allow"
rationale = "May introduce major-version breaking changes by bypassing semver range constraints."

[[command]]
path = "yarn dedupe"
translation = "Remove duplicate dependency versions by consolidating ranges."
verdict = "allow"
rationale = "Modifies the lockfile and may change which versions are installed."
tags.scope = "local"
tags.effect = ["write"]
tags.reversibility = "trivial"
tags.target = ["filesystem"]
tags.safety_override = false

# ── Execution ───────────────────────────────────────────────────────────────

[[command]]
path = "yarn exec"
translation = "Execute a shell command in the project environment."
verdict = "allow"
rationale = "Runs an arbitrary command with access to project binaries."
tags.scope = "local"
tags.effect = ["execute"]
tags.reversibility = "trivial"
tags.target = ["filesystem"]
tags.safety_override = false

# ── Information ─────────────────────────────────────────────────────────────

[[command]]
path = "yarn info"
translation = "Display information about installed packages."
verdict = "allow"
rationale = "Read-only display of package metadata."
tags.scope = "local"
tags.effect = ["read"]
tags.reversibility = "trivial"
tags.target = ["package_registry"]
tags.safety_override = false

# ── Linking ─────────────────────────────────────────────────────────────────

[[command]]
path = "yarn link"
translation = "Connect the local project to another local package for development."
verdict = "allow"
rationale = "Creates a symbolic link for local development; easily reversible."
tags.scope = "local"
tags.effect = ["create"]
tags.reversibility = "trivial"
tags.target = ["filesystem"]
tags.safety_override = false

[[command]]
path = "yarn unlink"
translation = "Disconnect the local project from a linked package."
verdict = "allow"
rationale = "Removes a development symbolic link and reinstalls the normal dependency."
tags.scope = "local"
tags.effect = ["delete", "create"]
tags.reversibility = "trivial"
tags.target = ["filesystem"]
tags.safety_override = false

# ── Packaging ───────────────────────────────────────────────────────────────

[[command]]
path = "yarn pack"
translation = "Generate a tarball from the current workspace."
verdict = "allow"
rationale = "Creates a local archive file; does not publish anything."
tags.scope = "local"
tags.effect = ["create"]
tags.reversibility = "trivial"
tags.target = ["filesystem"]
tags.safety_override = false

[[command]]
path = "yarn rebuild"
translation = "Rebuild the project's native packages."
verdict = "allow"
rationale = "Re-runs native build scripts, which may compile code and modify the local environment."
tags.scope = "local"
tags.effect = ["execute"]
tags.reversibility = "trivial"
tags.target = ["filesystem"]
tags.safety_override = false

# ── npm operations ─────────────────────────────────────────────────���────────

[[command]]
path = "yarn npm audit"
translation = "Check installed packages for known security vulnerabilities."
verdict = "allow"
rationale = "Read-only security audit of dependencies."
tags.scope = "remote"
tags.effect = ["read"]
tags.reversibility = "trivial"
tags.target = ["package_registry"]
tags.safety_override = false

[[command]]
path = "yarn npm publish"
translation = "Publish a package to the npm registry."
verdict = "require_approval"
rationale = "Makes the package publicly available on the registry, which is difficult to fully undo."
tags.scope = "remote"
tags.effect = ["write"]
tags.reversibility = "impossible"
tags.target = ["package_registry"]
tags.safety_override = false

# ── Version management ──────────────────────────────────────────────────────

[[command]]
path = "yarn set version"
translation = "Lock the Yarn version used by the project."
verdict = "allow"
rationale = "Downloads a specific Yarn binary for the project; does not affect dependencies."
tags.scope = "remote"
tags.effect = ["write"]
tags.reversibility = "trivial"
tags.target = ["filesystem"]
tags.safety_override = false

# ── Combos ──────────────────────────────────────────────────────────────────

[[combo]]
path = "yarn install --frozen-lockfile"
translation = "Install all project dependencies from the registry, failing immediately if the lockfile would need any changes."
verdict = "require_approval"
rationale = "Downloads and executes install scripts from remote packages but enforces lockfile immutability for reproducible builds."
tags.scope = "remote"
tags.effect = ["create", "execute"]
tags.reversibility = "trivial"
tags.target = ["package_registry", "filesystem"]
tags.safety_override = false

[[combo]]
path = "yarn add --dev"
translation = "Download and install a package from the registry as a development-only dependency, updating package.json and the lockfile."
verdict = "require_approval"
rationale = "Fetches and installs remote code that runs install scripts, categorized as a dev dependency so it is excluded from production builds."
tags.scope = "remote"
tags.effect = ["create", "write"]
tags.reversibility = "trivial"
tags.target = ["package_registry", "filesystem"]
tags.safety_override = false

[[combo]]
path = "yarn upgrade --latest"
translation = "Update all project dependencies to their absolute latest versions, ignoring the semver ranges specified in package.json."
verdict = "allow"
rationale = "Bypasses version range constraints and may introduce major breaking changes across multiple packages at once."
tags.scope = "remote"
tags.effect = ["write"]
tags.reversibility = "difficult"
tags.target = ["package_registry", "filesystem"]
tags.safety_override = false

