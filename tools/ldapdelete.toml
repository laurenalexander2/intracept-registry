# tools/ldapdelete.toml

[[command]]
path = "ldapdelete"
translation = "Delete entries from an LDAP directory."
verdict = "require_approval"
rationale = "Permanently removes directory entries, which can affect authentication and access control for users and services."

[[flag]]
applies_to = "ldapdelete"
flag = "-r"
translation_modifier = "recursively deleting all child entries beneath the target"
verdict = "require_approval"
rationale = "Deletes an entire subtree of directory entries without confirmation, potentially removing large portions of the directory."

[[flag]]
applies_to = "ldapdelete"
flag = "-n"
translation_modifier = "simulating the operation without actually deleting entries"
verdict = "allow"
rationale = "No data is deleted; only shows what would happen."

[[flag]]
applies_to = "ldapdelete"
flag = "-v"
translation_modifier = ""
verdict = "allow"
rationale = "Only increases diagnostic output to the terminal."

[[flag]]
applies_to = "ldapdelete"
flag = "-c"
translation_modifier = "continuing past errors instead of stopping"
verdict = "allow"
rationale = "Skips failed deletions and keeps going, which may cause partial removal that is hard to track."

[[flag]]
applies_to = "ldapdelete"
flag = "-f"
translation_modifier = "reading entries to delete from a file"
verdict = "allow"
rationale = "Allows batch deletion of many entries at once, increasing the blast radius."

[[flag]]
applies_to = "ldapdelete"
flag = "-x"
translation_modifier = "using simple authentication instead of advanced authentication"
verdict = "allow"
rationale = "Only changes the authentication method used."

[[flag]]
applies_to = "ldapdelete"
flag = "-H"
translation_modifier = "connecting to a specific LDAP server address"
verdict = "allow"
rationale = "Only changes which server is contacted."

[[flag]]
applies_to = "ldapdelete"
flag = "-D"
translation_modifier = "authenticating with a specific identity"
verdict = "allow"
rationale = "Only specifies which account to bind as."

[[flag]]
applies_to = "ldapdelete"
flag = "-W"
translation_modifier = "prompting for a password"
verdict = "allow"
rationale = "Safer than passing a password on the command line."

[[flag]]
applies_to = "ldapdelete"
flag = "-w"
translation_modifier = "using a password provided on the command line"
verdict = "allow"
rationale = "Specifies authentication credentials; the password may be visible in process listings."

[[flag]]
applies_to = "ldapdelete"
flag = "-Z"
translation_modifier = "requesting an encrypted connection"
verdict = "allow"
rationale = "Enables transport encryption, which improves security."

[[flag]]
applies_to = "ldapdelete"
flag = "-ZZ"
translation_modifier = "requiring an encrypted connection and failing if encryption is unavailable"
verdict = "allow"
rationale = "Enforces transport encryption; fails safely if the server does not support it."
