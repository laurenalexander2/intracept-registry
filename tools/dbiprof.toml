# tools/dbiprof.toml

[[command]]
path = "dbiprof"
translation = "Profile DBI database operations."
verdict = "allow"
rationale = "Read-only analysis of database operation performance."

[[flag]]
applies_to = "dbiprof"
flag = "--delete"
translation_modifier = "deleting the profiling data after displaying it"
verdict = "allow"
rationale = "Removes the profiling data file; data is lost if not saved elsewhere."
