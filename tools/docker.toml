# tools/docker.toml

# ── Base command ──────────────────────────────────────────────────────────────

[[command]]
path = "docker"
translation = "Run the Docker container management tool."
verdict = "allow"
rationale = "The bare command prints help text and modifies nothing."
risk_class = "safe"

# ── Container lifecycle ──────────────────────────────────────────────────────

[[command]]
path = "docker run"
translation = "Create and start a new container from an image."
verdict = "allow"
rationale = "Starts a process that consumes resources and may expose ports or mount host paths."
risk_class = "novel"

[[flag]]
applies_to = "docker run"
flag = "--rm"
translation_modifier = "automatically removing the container when it exits"
verdict = "allow"
rationale = "Cleans up the container on exit, preventing orphaned containers."
arity = "Boolean"

[[flag]]
applies_to = "docker run"
flag = "-d"
translation_modifier = "in the background"
verdict = "allow"
rationale = "Runs the container detached; the container continues running after the command returns."
arity = "Boolean"

[[flag]]
applies_to = "docker run"
flag = "--privileged"
translation_modifier = "with full access to the host system's devices and kernel capabilities"
verdict = "ask"
rationale = "Grants the container nearly unrestricted host access, bypassing all security isolation."
arity = "Boolean"
risk_class_override = "priv_esc"

[[flag]]
applies_to = "docker run"
flag = "-v"
translation_modifier = "mounting a host directory or volume into the container"
verdict = "ask"
rationale = "Gives the container read/write access to host files, which could lead to data modification or exposure."
arity = "Boolean"

[[flag]]
applies_to = "docker run"
flag = "--network"
translation_modifier = "connecting the container to a specific network"
verdict = "ask"
rationale = "Controls network isolation; using 'host' mode exposes all host ports to the container."
arity = "Boolean"

[[flag]]
applies_to = "docker run"
flag = "-p"
translation_modifier = "publishing a container port to the host"
verdict = "allow"
rationale = "Exposes the container's service on the host network, making it accessible externally."
arity = "Boolean"

[[flag]]
applies_to = "docker run"
flag = "--cap-add"
translation_modifier = "granting additional Linux kernel capabilities to the container"
verdict = "ask"
rationale = "Weakens container isolation by adding specific kernel privileges."
arity = "Boolean"
risk_class_override = "priv_esc"

[[flag]]
applies_to = "docker run"
flag = "--cap-drop"
translation_modifier = "removing Linux kernel capabilities from the container"
verdict = "allow"
rationale = "Strengthens container isolation by dropping specific kernel privileges."
arity = "Boolean"

[[flag]]
applies_to = "docker run"
flag = "--read-only"
translation_modifier = "making the container's root filesystem read-only"
verdict = "allow"
rationale = "Improves security by preventing writes to the container filesystem."
arity = "Boolean"

[[flag]]
applies_to = "docker run"
flag = "--pid"
translation_modifier = "sharing process visibility with the host or another container"
verdict = "ask"
rationale = "Using 'host' mode allows the container to see and signal all host processes."
arity = "Boolean"

[[flag]]
applies_to = "docker run"
flag = "--env"
translation_modifier = "setting an environment variable inside the container"
verdict = "allow"
rationale = "Environment variables may contain secrets; they are visible in container inspection output."
arity = "Boolean"

[[flag]]
applies_to = "docker run"
flag = "--name"
translation_modifier = "assigning a specific name to the container"
verdict = "allow"
rationale = "Names the container for easier reference; no behavioral change."
arity = "Boolean"

[[flag]]
applies_to = "docker run"
flag = "-it"
translation_modifier = "with an interactive terminal attached"
verdict = "allow"
rationale = "Allocates a terminal for interactive use; no additional risk beyond the base command."
arity = "Boolean"

[[flag]]
applies_to = "docker run"
flag = "--restart"
translation_modifier = "with a specific restart policy when the container exits"
verdict = "allow"
rationale = "Containers with 'always' or 'unless-stopped' policies restart automatically, which may persist unintended workloads."
arity = "Boolean"

[[flag]]
applies_to = "docker run"
flag = "--memory"
translation_modifier = "limiting the container's memory usage"
verdict = "allow"
rationale = "Constrains resource usage; a protective measure that does not increase risk."
arity = "Boolean"

[[flag]]
applies_to = "docker run"
flag = "--cpus"
translation_modifier = "limiting the number of CPU cores available to the container"
verdict = "allow"
rationale = "Constrains resource usage; a protective measure that does not increase risk."
arity = "Boolean"

# ── Container management ─────────────────────────────────────────────────────

[[command]]
path = "docker exec"
translation = "Run a command inside a running container."
verdict = "allow"
rationale = "Executes arbitrary commands inside an existing container's environment."
risk_class = "novel"

[[flag]]
applies_to = "docker exec"
flag = "--privileged"
translation_modifier = "with elevated privileges inside the container"
verdict = "ask"
rationale = "Grants the executed command extended kernel capabilities beyond the container's defaults."
arity = "Boolean"
risk_class_override = "priv_esc"

[[flag]]
applies_to = "docker exec"
flag = "-u"
translation_modifier = "as a specific user"
verdict = "allow"
rationale = "Running as root inside the container grants full control over the container's filesystem."
arity = "Boolean"

[[flag]]
applies_to = "docker exec"
flag = "-it"
translation_modifier = "with an interactive terminal attached"
verdict = "allow"
rationale = "Allocates a terminal for interactive use; no additional risk beyond the base command."
arity = "Boolean"

[[command]]
path = "docker stop"
translation = "Gracefully stop one or more running containers."
verdict = "ask"
rationale = "Interrupts a running service; the containerized workload is stopped."
risk_class = "novel"

[[command]]
path = "docker kill"
translation = "Immediately terminate one or more running containers."
verdict = "ask"
rationale = "Immediately terminates the container without allowing the process to clean up gracefully."
risk_class = "novel"

[[flag]]
applies_to = "docker kill"
flag = "-s"
translation_modifier = "using a specific signal"
verdict = "allow"
rationale = "Different signals have different effects; some may cause data corruption if the process is not signal-safe."
arity = "Boolean"

[[command]]
path = "docker rm"
translation = "Delete one or more stopped containers."
verdict = "allow"
rationale = "Permanently removes the container and its writable layer; data not in volumes is lost."
risk_class = "destructive"

[[flag]]
applies_to = "docker rm"
flag = "--force"
translation_modifier = "killing and removing a running container"
verdict = "ask"
rationale = "Forcefully kills a running container before removing it, potentially causing data loss."
arity = "Boolean"
risk_class_override = "priv_esc"

[[flag]]
applies_to = "docker rm"
flag = "-v"
translation_modifier = "also deleting anonymous volumes attached to the container"
verdict = "ask"
rationale = "Permanently removes anonymous volumes and their data along with the container."
arity = "Boolean"

[[command]]
path = "docker start"
translation = "Start one or more stopped containers."
verdict = "allow"
rationale = "Resumes a previously created container; equivalent to restarting a stopped service."
risk_class = "novel"

[[command]]
path = "docker restart"
translation = "Stop and then start one or more containers."
verdict = "allow"
rationale = "Interrupts running processes in the container before restarting them."
risk_class = "novel"

[[command]]
path = "docker pause"
translation = "Suspend all processes in one or more running containers."
verdict = "allow"
rationale = "Freezes the container's processes; the container remains in memory but stops serving requests."
risk_class = "novel"

[[command]]
path = "docker unpause"
translation = "Resume all processes in one or more paused containers."
verdict = "allow"
rationale = "Resumes previously paused container processes; restores normal operation."
risk_class = "novel"

[[command]]
path = "docker create"
translation = "Create a new container from an image without starting it."
verdict = "allow"
rationale = "Prepares a container but does not run it; no processes are started."
risk_class = "novel"

[[command]]
path = "docker cp"
translation = "Copy files between a container and the local filesystem."
verdict = "allow"
rationale = "Transfers files into or out of a container, which could modify application state or exfiltrate data."
risk_class = "novel"

[[command]]
path = "docker rename"
translation = "Rename an existing container."
verdict = "allow"
rationale = "Changes only the container's name; does not affect its state or data."
risk_class = "novel"

[[command]]
path = "docker update"
translation = "Update resource limits and restart policy on one or more containers."
verdict = "allow"
rationale = "Changes runtime constraints such as memory limits; incorrect values may cause the container to be killed."
risk_class = "novel"

# ── Inspection ───────────────────────────────────────────────────────────────

[[command]]
path = "docker ps"
translation = "List running containers."
verdict = "allow"
rationale = "Read-only display of container status."
risk_class = "safe"

[[flag]]
applies_to = "docker ps"
flag = "-a"
translation_modifier = "including stopped containers"
verdict = "allow"
rationale = "Shows all containers regardless of state; read-only operation."
arity = "Boolean"

[[command]]
path = "docker logs"
translation = "Display the log output of a container."
verdict = "allow"
rationale = "Read-only access to container logs."
risk_class = "safe"

[[flag]]
applies_to = "docker logs"
flag = "-f"
translation_modifier = "streaming new log lines as they are produced"
verdict = "allow"
rationale = "Follows the log stream; still a read-only operation."
arity = "Boolean"

[[flag]]
applies_to = "docker logs"
flag = "--tail"
translation_modifier = "showing only the specified number of most recent lines"
verdict = "allow"
rationale = "Limits output to recent lines; read-only operation."
arity = "Boolean"

[[command]]
path = "docker inspect"
translation = "Show detailed configuration and state information for a Docker object."
verdict = "allow"
rationale = "Read-only display of object metadata."
risk_class = "safe"

[[command]]
path = "docker stats"
translation = "Display a live stream of resource usage statistics for running containers."
verdict = "allow"
rationale = "Read-only monitoring display of CPU, memory, and network usage."
risk_class = "safe"

[[command]]
path = "docker top"
translation = "Display the running processes inside a container."
verdict = "allow"
rationale = "Read-only display of container processes."
risk_class = "safe"

# ── Image management ─────────────────────────────────────────────────────────

[[command]]
path = "docker build"
translation = "Build a container image from a Dockerfile."
verdict = "allow"
rationale = "Creates a new image locally; does not affect running containers or remote registries."
risk_class = "novel"

[[flag]]
applies_to = "docker build"
flag = "--no-cache"
translation_modifier = "without using any cached layers from previous builds"
verdict = "allow"
rationale = "Forces a full rebuild; slower but ensures all layers are fresh."
arity = "Boolean"

[[flag]]
applies_to = "docker build"
flag = "-f"
translation_modifier = "using a specific Dockerfile instead of the default"
verdict = "allow"
rationale = "Allows building from an alternate Dockerfile; no additional risk beyond the chosen file's contents."
arity = "Boolean"

[[flag]]
applies_to = "docker build"
flag = "--build-arg"
translation_modifier = "passing a build-time variable to the Dockerfile"
verdict = "allow"
rationale = "Build args may contain secrets that get baked into image layers if not handled carefully."
arity = "Boolean"

[[flag]]
applies_to = "docker build"
flag = "-t"
translation_modifier = "tagging the resulting image with a name and optional version"
verdict = "allow"
rationale = "Assigns a name to the built image; no additional risk."
arity = "Boolean"

[[command]]
path = "docker pull"
translation = "Download a container image from a registry."
verdict = "allow"
rationale = "Downloads an image; does not run or modify anything locally."
risk_class = "novel"

[[flag]]
applies_to = "docker pull"
flag = "--all-tags"
translation_modifier = "downloading every tagged version of the image"
verdict = "allow"
rationale = "Can consume significant disk space and bandwidth by pulling all image variants."
arity = "Boolean"

[[command]]
path = "docker push"
translation = "Upload a local container image to a registry."
verdict = "ask"
rationale = "Publishes an image to a shared registry where others may pull and run it."
risk_class = "novel"

[[flag]]
applies_to = "docker push"
flag = "--all-tags"
translation_modifier = "uploading every tagged version of the image"
verdict = "allow"
rationale = "Publishes all local tags for the image, which may include experimental or unready versions."
arity = "Boolean"

[[command]]
path = "docker images"
translation = "List locally stored container images."
verdict = "allow"
rationale = "Read-only display of local images."
risk_class = "safe"

[[command]]
path = "docker rmi"
translation = "Delete one or more local container images."
verdict = "allow"
rationale = "Removes images from local storage; they must be re-pulled if needed again."
risk_class = "destructive"

[[flag]]
applies_to = "docker rmi"
flag = "--force"
translation_modifier = "even if the image is used by stopped containers"
verdict = "allow"
rationale = "Forcefully removes a local image; the image can be re-pulled from the registry."
arity = "Boolean"
risk_class_override = "priv_esc"

[[command]]
path = "docker tag"
translation = "Create a new tag that refers to an existing local image."
verdict = "allow"
rationale = "Adds a name alias to an existing image; no data is modified or uploaded."
risk_class = "novel"

[[command]]
path = "docker commit"
translation = "Create a new image from a container's current state."
verdict = "allow"
rationale = "Creates a new local image; does not modify the running container or push to a registry."
risk_class = "novel"

[[command]]
path = "docker image prune"
translation = "Remove unused container images."
verdict = "allow"
rationale = "Deletes dangling images by default; they must be rebuilt or re-pulled if needed."
risk_class = "destructive"

[[flag]]
applies_to = "docker image prune"
flag = "--all"
translation_modifier = "including all unused images, not just dangling ones"
verdict = "ask"
rationale = "Removes every image not referenced by a container, causing lengthy re-downloads."
arity = "Boolean"

[[flag]]
applies_to = "docker image prune"
flag = "--force"
translation_modifier = "without asking for confirmation"
verdict = "allow"
rationale = "Skips the confirmation prompt before deleting images."
arity = "Boolean"
risk_class_override = "priv_esc"

# ── Image transfer ───────────────────────────────────────────────────────────

[[command]]
path = "docker save"
translation = "Export one or more container images to a tar archive."
verdict = "allow"
rationale = "Creates a local file; does not modify images or containers."
risk_class = "safe"

[[command]]
path = "docker load"
translation = "Import container images from a tar archive."
verdict = "allow"
rationale = "Adds images to local storage; does not affect running containers."
risk_class = "novel"

[[command]]
path = "docker export"
translation = "Export a container's filesystem as a tar archive."
verdict = "allow"
rationale = "Creates a local file from the container's filesystem; does not modify the container."
risk_class = "safe"

[[command]]
path = "docker import"
translation = "Create a new image from a tar archive of a filesystem."
verdict = "allow"
rationale = "Creates a local image; does not affect running containers."
risk_class = "novel"

# ── Network management ───────────────────────────────────────────────────────

[[command]]
path = "docker network"
translation = "Manage Docker networks."
verdict = "allow"
rationale = "The bare subcommand prints help text."
risk_class = "safe"

[[command]]
path = "docker network create"
translation = "Create a new Docker network."
verdict = "allow"
rationale = "Creates a network configuration; does not affect running containers until they join it."
risk_class = "novel"

[[command]]
path = "docker network rm"
translation = "Delete one or more Docker networks."
verdict = "allow"
rationale = "Removes the network; containers still connected to it will lose connectivity."
risk_class = "destructive"

[[command]]
path = "docker network prune"
translation = "Remove all Docker networks not used by any container."
verdict = "allow"
rationale = "Deletes unused networks in bulk; a network may be needed later even if currently unused."
risk_class = "destructive"

[[flag]]
applies_to = "docker network prune"
flag = "--force"
translation_modifier = "without asking for confirmation"
verdict = "allow"
rationale = "Skips the confirmation prompt, increasing the chance of accidental deletion."
arity = "Boolean"
risk_class_override = "priv_esc"

[[command]]
path = "docker network ls"
translation = "List all Docker networks."
verdict = "allow"
rationale = "Read-only listing of networks."
risk_class = "safe"

[[command]]
path = "docker network connect"
translation = "Connect a container to a Docker network."
verdict = "allow"
rationale = "Adds a network interface to the container; the container gains connectivity to that network."
risk_class = "novel"

[[command]]
path = "docker network disconnect"
translation = "Disconnect a container from a Docker network."
verdict = "allow"
rationale = "Removes network connectivity, which may disrupt the container's communication with other services."
risk_class = "novel"

# ── Volume management ────────────────────────────────────────────────────────

[[command]]
path = "docker volume"
translation = "Manage Docker volumes."
verdict = "allow"
rationale = "The bare subcommand prints help text."
risk_class = "safe"

[[command]]
path = "docker volume create"
translation = "Create a new Docker volume for persistent data storage."
verdict = "allow"
rationale = "Creates an empty volume; does not affect existing data."
risk_class = "novel"

[[command]]
path = "docker volume rm"
translation = "Delete one or more Docker volumes and their data."
verdict = "ask"
rationale = "Permanently destroys the volume and all data stored in it."
risk_class = "destructive"

[[flag]]
applies_to = "docker volume rm"
flag = "--force"
translation_modifier = "without raising an error if the volume does not exist"
verdict = "allow"
rationale = "Only suppresses 'not found' errors; does not add destructive capability beyond the base command."
arity = "Boolean"

[[command]]
path = "docker volume prune"
translation = "Remove all Docker volumes not currently used by any container."
verdict = "ask"
rationale = "Bulk-deletes unused volumes; data in those volumes is permanently lost."
risk_class = "destructive"

[[flag]]
applies_to = "docker volume prune"
flag = "--all"
translation_modifier = "including named volumes, not just anonymous ones"
verdict = "ask"
rationale = "Extends deletion to explicitly named volumes which often contain important persistent data."
arity = "Boolean"

[[flag]]
applies_to = "docker volume prune"
flag = "--force"
translation_modifier = "without asking for confirmation"
verdict = "ask"
rationale = "Skips the confirmation prompt before bulk-deleting volumes."
arity = "Boolean"
risk_class_override = "priv_esc"

[[command]]
path = "docker volume ls"
translation = "List all Docker volumes."
verdict = "allow"
rationale = "Read-only listing of Docker volumes."
risk_class = "safe"

# ── System management ────────────────────────────────────────────────────────

[[command]]
path = "docker system prune"
translation = "Remove all unused containers, networks, and dangling images."
verdict = "ask"
rationale = "Bulk-deletes multiple types of unused Docker resources at once."
risk_class = "destructive"

[[flag]]
applies_to = "docker system prune"
flag = "--all"
translation_modifier = "including all unused images, not just dangling ones"
verdict = "ask"
rationale = "Removes every unused image, causing lengthy re-downloads, but images are recoverable from registries."
arity = "Boolean"

[[flag]]
applies_to = "docker system prune"
flag = "--volumes"
translation_modifier = "also deleting unused volumes and their data"
verdict = "ask"
rationale = "Extends the prune to include volumes, permanently destroying persistent data."
arity = "Boolean"

[[flag]]
applies_to = "docker system prune"
flag = "--force"
translation_modifier = "without asking for confirmation"
verdict = "ask"
rationale = "Skips the confirmation prompt before a bulk-delete of multiple resource types."
arity = "Boolean"
risk_class_override = "priv_esc"

[[command]]
path = "docker system df"
translation = "Show how much disk space Docker is using."
verdict = "allow"
rationale = "Read-only display of disk usage by Docker objects."
risk_class = "safe"

[[command]]
path = "docker container prune"
translation = "Remove all stopped containers."
verdict = "allow"
rationale = "Deletes all stopped containers and their writable layers; data not in volumes is lost."
risk_class = "destructive"

[[flag]]
applies_to = "docker container prune"
flag = "--force"
translation_modifier = "without asking for confirmation"
verdict = "allow"
rationale = "Skips the confirmation prompt before removing stopped containers."
arity = "Boolean"
risk_class_override = "priv_esc"

# ── Authentication ───────────────────────────────────────────────────────────

[[command]]
path = "docker login"
translation = "Authenticate to a container registry and save the credentials locally."
verdict = "ask"
rationale = "Stores registry credentials on disk, which could be exposed if the machine is compromised."
risk_class = "secret_read"

[[command]]
path = "docker logout"
translation = "Remove stored credentials for a container registry."
verdict = "allow"
rationale = "Deletes locally stored credentials; reduces exposure but requires re-authentication."
risk_class = "secret_read"

# ── Docker Compose ───────────────────────────────────────────────────────────

[[command]]
path = "docker compose"
translation = "Manage multi-container applications defined in a Compose file."
verdict = "allow"
rationale = "The bare subcommand prints help text and modifies nothing."
risk_class = "safe"

[[command]]
path = "docker compose up"
translation = "Create and start all services defined in the Compose file."
verdict = "allow"
rationale = "Starts potentially many containers with network and volume configurations."
risk_class = "novel"

[[flag]]
applies_to = "docker compose up"
flag = "-d"
translation_modifier = "in the background"
verdict = "allow"
rationale = "Runs services detached; they continue running after the command returns."
arity = "Boolean"

[[flag]]
applies_to = "docker compose up"
flag = "--build"
translation_modifier = "rebuilding images before starting"
verdict = "allow"
rationale = "Ensures images are up to date; adds build time but no additional risk."
arity = "Boolean"

[[flag]]
applies_to = "docker compose up"
flag = "--force-recreate"
translation_modifier = "recreating containers even if their configuration has not changed"
verdict = "allow"
rationale = "Destroys and recreates containers, which may cause brief downtime and loss of container state."
arity = "Boolean"

[[command]]
path = "docker compose down"
translation = "Stop and remove all containers and networks defined in the Compose file."
verdict = "allow"
rationale = "Stops services and removes containers and networks; named volumes are preserved by default."
risk_class = "destructive"

[[flag]]
applies_to = "docker compose down"
flag = "-v"
translation_modifier = "also deleting named volumes declared in the Compose file"
verdict = "ask"
rationale = "Permanently removes volumes and their data, including databases and application state."
arity = "Boolean"

[[flag]]
applies_to = "docker compose down"
flag = "--rmi"
translation_modifier = "also removing images used by the services"
verdict = "allow"
rationale = "Deletes service images which must be rebuilt or re-pulled to restart services."
arity = "Boolean"

[[flag]]
applies_to = "docker compose down"
flag = "--remove-orphans"
translation_modifier = "also removing containers for services no longer defined in the Compose file"
verdict = "allow"
rationale = "Removes containers that may have been intentionally kept from a previous configuration."
arity = "Boolean"

[[command]]
path = "docker compose ps"
translation = "List containers managed by the current Compose project."
verdict = "allow"
rationale = "Read-only display of Compose-managed container status."
risk_class = "safe"

[[command]]
path = "docker compose logs"
translation = "Display log output from services defined in the Compose file."
verdict = "allow"
rationale = "Read-only access to service logs."
risk_class = "safe"

[[command]]
path = "docker compose build"
translation = "Build or rebuild images for services defined in the Compose file."
verdict = "allow"
rationale = "Creates local images; does not affect running containers or remote registries."
risk_class = "novel"

[[command]]
path = "docker compose pull"
translation = "Download images for services defined in the Compose file."
verdict = "allow"
rationale = "Downloads images; does not run or modify anything."
risk_class = "novel"

[[command]]
path = "docker compose restart"
translation = "Restart running containers for services defined in the Compose file."
verdict = "allow"
rationale = "Interrupts running services briefly; container data is preserved."
risk_class = "novel"

[[command]]
path = "docker compose exec"
translation = "Run a command inside a running Compose service container."
verdict = "allow"
rationale = "Executes arbitrary commands inside an existing service container."
risk_class = "novel"

[[command]]
path = "docker compose stop"
translation = "Stop running containers for services without removing them."
verdict = "allow"
rationale = "Stops services; containers and their data are preserved for restart."
risk_class = "novel"

[[command]]
path = "docker compose rm"
translation = "Remove stopped service containers."
verdict = "allow"
rationale = "Deletes stopped containers and their writable layers; data not in volumes is lost."
risk_class = "destructive"

[[flag]]
applies_to = "docker compose rm"
flag = "--force"
translation_modifier = "without asking for confirmation"
verdict = "allow"
rationale = "Skips the confirmation prompt before removing containers."
arity = "Boolean"
risk_class_override = "priv_esc"

[[flag]]
applies_to = "docker compose rm"
flag = "-v"
translation_modifier = "also deleting anonymous volumes attached to the containers"
verdict = "ask"
rationale = "Permanently removes anonymous volumes and their data along with the containers."
arity = "Boolean"

[[command]]
path = "docker compose run"
translation = "Run a one-off command against a Compose service."
verdict = "allow"
rationale = "Creates and starts a new container to execute an arbitrary command."
risk_class = "novel"

[[flag]]
applies_to = "docker compose run"
flag = "--rm"
translation_modifier = "automatically removing the container when it exits"
verdict = "allow"
rationale = "Cleans up the one-off container on exit; prevents orphaned containers."
arity = "Boolean"

# ── Combos ───────────────────────────────────────────────────────────────────

[[combo]]
path = "docker run --privileged"
translation = "Create and start a new container with full access to the host system's devices and kernel capabilities, bypassing all Docker security isolation."
verdict = "warn"
rationale = "Grants the container nearly unrestricted host access, equivalent to running processes directly on the host with no isolation."
risk_class = "priv_esc"

[[combo]]
path = "docker run -it --rm"
translation = "Create and start a new container with an interactive terminal attached, automatically removing the container when it exits."
verdict = "allow"
rationale = "Standard pattern for interactive one-off containers that clean up after themselves."
risk_class = "novel"

[[combo]]
path = "docker run --privileged -v"
translation = "Create and start a new container with full host access and a mounted host directory, giving the container unrestricted read/write access to host files and kernel."
verdict = "warn"
rationale = "Combines full kernel access with host filesystem mounts, enabling complete control over the host system from inside the container."
risk_class = "priv_esc"

[[combo]]
path = "docker run -d"
translation = "Create and start a new container in the background, returning control immediately while the container continues running."
verdict = "allow"
rationale = "Standard pattern for running services; the container persists until explicitly stopped."
risk_class = "novel"

[[combo]]
path = "docker system prune --all --force"
translation = "Remove all unused containers, networks, and images without asking for confirmation, forcing re-downloads of any images needed later."
verdict = "warn"
rationale = "Bulk-deletes all unused Docker resources immediately with no confirmation prompt, potentially causing lengthy image re-downloads."
risk_class = "destructive"

[[combo]]
path = "docker system prune --all --force --volumes"
translation = "Remove all unused containers, networks, images, and volumes without asking for confirmation, permanently destroying any persistent data in unused volumes."
verdict = "warn"
rationale = "The most destructive single Docker command — bulk-deletes everything unused including persistent volume data with no confirmation prompt."
risk_class = "destructive"

[[combo]]
path = "docker rm --force"
translation = "Kill and remove a running container immediately, discarding any in-progress work without graceful shutdown."
verdict = "warn"
rationale = "Forcefully terminates and removes a running container, potentially causing data corruption in applications that need graceful shutdown."
risk_class = "destructive"

[[combo]]
path = "docker rm --force -v"
translation = "Kill and remove a running container immediately, also permanently deleting its anonymous volumes and their data."
verdict = "warn"
rationale = "Combines forced container termination with anonymous volume deletion, permanently destroying both the container and its associated data."
risk_class = "destructive"

[[combo]]
path = "docker build --no-cache -t"
translation = "Build a container image from scratch without using cached layers, tagging the result with a specific name and optional version."
verdict = "allow"
rationale = "Forces a complete rebuild and tags it; slower but guarantees all layers are freshly built."
risk_class = "novel"

[[combo]]
path = "docker exec -it"
translation = "Open an interactive terminal session inside a running container."
verdict = "allow"
rationale = "Standard pattern for interactive debugging or administration inside a running container."
risk_class = "novel"

[[combo]]
path = "docker rmi --force"
translation = "Forcefully remove a local container image even if stopped containers still reference it."
verdict = "warn"
rationale = "Removes the image regardless of stopped container references; the image can be re-pulled from the registry."
risk_class = "destructive"

[[combo]]
path = "docker volume prune --force"
translation = "Remove all unused Docker volumes and their data without asking for confirmation."
verdict = "warn"
rationale = "Permanently destroys data in all unused volumes with no confirmation prompt, making recovery impossible."
risk_class = "destructive"

[[combo]]
path = "docker container prune --force"
translation = "Remove all stopped containers without asking for confirmation."
verdict = "warn"
rationale = "Deletes all stopped containers immediately; writable layer data not stored in volumes is lost."
risk_class = "destructive"

[[combo]]
path = "docker image prune --all --force"
translation = "Remove all unused container images without asking for confirmation, not just dangling ones."
verdict = "warn"
rationale = "Deletes every image not referenced by a running container without prompting, requiring lengthy re-downloads to restore them."
risk_class = "destructive"

[[combo]]
path = "docker network prune --force"
translation = "Remove all unused Docker networks without asking for confirmation."
verdict = "warn"
rationale = "Deletes unused networks immediately; they can be recreated but services may need reconfiguration."
risk_class = "destructive"
