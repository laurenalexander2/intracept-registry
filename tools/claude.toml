# tools/claude.toml

[[command]]
path = "claude"
translation = "Run the Claude Code AI assistant in the terminal."
verdict = "allow"
rationale = "Starts an interactive AI session that can read, write, and execute code in the current directory."
risk_class = "novel"

[[flag]]
applies_to = "claude"
flag = "-p"
translation_modifier = "printing a single response and exiting without interactive mode"
verdict = "allow"
rationale = "Runs in non-interactive mode; useful for scripting."
arity = "Boolean"

[[flag]]
applies_to = "claude"
flag = "--dangerously-skip-permissions"
translation_modifier = "bypassing all permission checks before executing actions"
verdict = "ask"
rationale = "Allows the AI to execute any tool without user approval, including destructive file and system operations."
arity = "Boolean"

[[flag]]
applies_to = "claude"
flag = "--model"
translation_modifier = "using a specified AI model"
verdict = "allow"
rationale = "Selects which model to use; does not change available capabilities."
arity = "Boolean"

[[flag]]
applies_to = "claude"
flag = "-c"
translation_modifier = "continuing the most recent conversation"
verdict = "allow"
rationale = "Resumes an existing session; does not change capabilities."
arity = "Boolean"

[[flag]]
applies_to = "claude"
flag = "-r"
translation_modifier = "resuming a specific conversation by session ID"
verdict = "allow"
rationale = "Resumes an existing session; does not change capabilities."
arity = "Boolean"
