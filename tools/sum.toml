# tools/sum.toml

[[command]]
path = "sum"
translation = "Compute a checksum and block count for a file."
verdict = "allow"
rationale = "Read-only checksum calculation; modifies nothing."

[[flag]]
applies_to = "sum"
flag = "-r"
translation_modifier = "using the BSD checksum algorithm"
verdict = "allow"
rationale = "Only changes which checksum algorithm is used; no state modification."
