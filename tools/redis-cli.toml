# tools/redis-cli.toml

[[command]]
path = "redis-cli"
translation = "Connect to a Redis data store."
verdict = "allow"
rationale = "Connects to a live data store where any command can be executed, including destructive operations like FLUSHALL."

[[flag]]
applies_to = "redis-cli"
flag = "-h"
translation_modifier = "connecting to a specified server host"
verdict = "allow"
rationale = "Specifies which server to connect to; does not change what operations can be performed."

[[flag]]
applies_to = "redis-cli"
flag = "-p"
translation_modifier = "connecting on a specified port"
verdict = "allow"
rationale = "Specifies which port to connect on; does not change what operations can be performed."

[[flag]]
applies_to = "redis-cli"
flag = "-a"
translation_modifier = "authenticating with a specified password"
verdict = "allow"
rationale = "Provides authentication credentials; does not change what operations are available."

[[flag]]
applies_to = "redis-cli"
flag = "-n"
translation_modifier = "selecting a specified database number"
verdict = "allow"
rationale = "Chooses which logical database to operate on; does not change what commands can be run."

[[flag]]
applies_to = "redis-cli"
flag = "--scan"
translation_modifier = "listing keys matching a pattern without blocking the server"
verdict = "allow"
rationale = "Read-only operation that iterates through keys incrementally."

[[flag]]
applies_to = "redis-cli"
flag = "--pipe"
translation_modifier = "sending raw protocol commands from standard input in bulk"
verdict = "require_approval"
rationale = "Streams arbitrary commands to the server, which may include destructive operations like deleting keys or erasing entire databases."

[[flag]]
applies_to = "redis-cli"
flag = "--rdb"
translation_modifier = "downloading a snapshot of the database to a local file"
verdict = "allow"
rationale = "Read-only export of the database contents to a file."

[[flag]]
applies_to = "redis-cli"
flag = "--stat"
translation_modifier = "displaying live server statistics"
verdict = "allow"
rationale = "Read-only monitoring of server metrics."

[[flag]]
applies_to = "redis-cli"
flag = "--bigkeys"
translation_modifier = "scanning for the largest keys in the database"
verdict = "allow"
rationale = "Read-only analysis that identifies large keys; does not modify data."

[[flag]]
applies_to = "redis-cli"
flag = "--latency"
translation_modifier = "measuring round-trip latency to the server"
verdict = "allow"
rationale = "Read-only network latency measurement."

[[flag]]
applies_to = "redis-cli"
flag = "-u"
translation_modifier = "connecting using a specified connection URL"
verdict = "allow"
rationale = "Provides the connection string; does not change what operations can be performed."

[[flag]]
applies_to = "redis-cli"
flag = "--tls"
translation_modifier = "connecting over an encrypted TLS connection"
verdict = "allow"
rationale = "Enables transport encryption; does not affect command capabilities."
