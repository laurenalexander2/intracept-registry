# tools/softwareupdate.toml

[[command]]
path = "softwareupdate"
translation = "Check for and install macOS system software updates."
verdict = "allow"
rationale = "The bare command prints help; actual updates require specific subcommands."
risk_class = "novel"

[[command]]
path = "softwareupdate --list"
translation = "List all available software updates for the system."
verdict = "allow"
rationale = "Read-only query of available updates; does not download or install anything."
risk_class = "novel"

[[command]]
path = "softwareupdate --install"
translation = "Download and install specified software updates."
verdict = "ask"
rationale = "Modifies system software which may require a restart; incorrect updates can affect system stability."
risk_class = "novel"

[[command]]
path = "softwareupdate --download"
translation = "Download specified software updates without installing them."
verdict = "allow"
rationale = "Downloads update packages to disk; does not modify the running system."
risk_class = "novel"

[[command]]
path = "softwareupdate --list-full-installers"
translation = "List available macOS full installer versions."
verdict = "allow"
rationale = "Read-only listing of available installers."
risk_class = "novel"

[[command]]
path = "softwareupdate --fetch-full-installer"
translation = "Download a full macOS installer application."
verdict = "allow"
rationale = "Downloads a large installer to disk; consumes significant space but does not install."
risk_class = "novel"

[[command]]
path = "softwareupdate --install-rosetta"
translation = "Install Rosetta 2 for running Intel applications on Apple silicon."
verdict = "allow"
rationale = "Installs a system component; reversible but modifies system state."
risk_class = "novel"

[[flag]]
applies_to = "softwareupdate --install"
flag = "--all"
translation_modifier = "installing all applicable updates"
verdict = "ask"
rationale = "Installs every available update without selection; broad scope increases risk of unintended changes."
arity = "Boolean"

[[flag]]
applies_to = "softwareupdate --install"
flag = "--recommended"
translation_modifier = "installing only recommended updates"
verdict = "ask"
rationale = "Installs a curated set of updates; still modifies system software."
arity = "Boolean"

[[flag]]
applies_to = "softwareupdate --install"
flag = "--restart"
translation_modifier = "automatically restarting if required to complete installation"
verdict = "ask"
rationale = "Triggers an automatic system restart which terminates all running applications."
arity = "Boolean"

[[flag]]
applies_to = "softwareupdate --install"
flag = "--force"
translation_modifier = "forcing a reboot even if users are logged in"
verdict = "ask"
rationale = "Forces immediate restart regardless of logged-in users; unsaved work in all sessions is lost."
arity = "Boolean"

[[flag]]
applies_to = "softwareupdate --install"
flag = "--os-only"
translation_modifier = "installing only macOS updates"
verdict = "ask"
rationale = "Limits scope to OS updates but still modifies core system software."
arity = "Boolean"
