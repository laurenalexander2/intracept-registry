# tools/pg_archivecleanup-17.toml — PostgreSQL 17 utility

[[command]]
path = "pg_archivecleanup-17"
translation = "Remove old WAL files from a PostgreSQL archive directory."
verdict = "ask"
rationale = "Permanently deletes WAL archive files, which may be needed for point-in-time recovery."
risk_class = "novel"

[[flag]]
applies_to = "pg_archivecleanup-17"
flag = "-n"
translation_modifier = "only showing which files would be removed without actually deleting them"
verdict = "allow"
rationale = "Dry run that does not delete any files."
arity = "Boolean"

[[flag]]
applies_to = "pg_archivecleanup-17"
flag = "--clean"
translation_modifier = "removing old WAL files that are no longer needed"
verdict = "ask"
rationale = "Deletes WAL archive files; if the wrong files are removed, point-in-time recovery may be impossible."
arity = "Boolean"
