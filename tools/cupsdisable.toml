# tools/cupsdisable.toml

[[command]]
path = "cupsdisable"
translation = "Stop a printer from processing print jobs."
verdict = "allow"
rationale = "Disables a printer queue, which may interrupt pending print jobs."
risk_class = "novel"

[[flag]]
applies_to = "cupsdisable"
flag = "-c"
translation_modifier = "canceling all pending jobs on the printer"
verdict = "ask"
rationale = "Removes every queued job on the printer; those jobs must be resubmitted."
arity = "Boolean"

[[flag]]
applies_to = "cupsdisable"
flag = "--hold"
translation_modifier = "holding remaining jobs until the printer is re-enabled"
verdict = "allow"
rationale = "Preserves queued jobs instead of discarding them; they resume when the printer is re-enabled."
arity = "Boolean"

[[flag]]
applies_to = "cupsdisable"
flag = "-r"
translation_modifier = "setting a reason message for why the printer is stopped"
verdict = "allow"
rationale = "Only sets a display message; does not change printer behavior."
arity = "Boolean"

[[flag]]
applies_to = "cupsdisable"
flag = "-E"
translation_modifier = "using an encrypted connection to the print server"
verdict = "allow"
rationale = "Only changes connection security; does not affect printer state."
arity = "Boolean"
