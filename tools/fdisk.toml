# tools/fdisk.toml

[[command]]
path = "fdisk"
translation = "Display or modify the MBR partition table on a disk."
verdict = "allow"
rationale = "Without flags, only displays the partition table as a read-only operation."
risk_class = "novel"

[[flag]]
applies_to = "fdisk"
flag = "-i"
translation_modifier = "initializing and overwriting the entire MBR sector"
verdict = "ask"
rationale = "Completely overwrites the MBR and partition table, destroying all existing partition information."
arity = "Boolean"

[[flag]]
applies_to = "fdisk"
flag = "-e"
translation_modifier = "entering interactive partition editing mode"
verdict = "ask"
rationale = "Allows modification of partition entries; changes are not written until explicitly confirmed."
arity = "Boolean"

[[flag]]
applies_to = "fdisk"
flag = "-u"
translation_modifier = "updating the MBR boot code while preserving the partition table"
verdict = "ask"
rationale = "Overwrites MBR boot code and the Windows disk signature, which can affect system bootability."
arity = "Boolean"

[[flag]]
applies_to = "fdisk"
flag = "-y"
translation_modifier = "without asking for confirmation before writing"
verdict = "ask"
rationale = "Skips confirmation prompts, increasing the chance of unintended partition table changes."
arity = "Boolean"
