# tools/lipo.toml

[[command]]
path = "lipo"
translation = "Create or manipulate universal (multi-architecture) binary files."
verdict = "allow"
rationale = "Without a command, only displays architecture information from input files."

[[flag]]
applies_to = "lipo"
flag = "-create"
translation_modifier = "creating a universal binary from one or more architecture-specific files"
verdict = "allow"
rationale = "Creates a new output file; does not modify input files."

[[flag]]
applies_to = "lipo"
flag = "-thin"
translation_modifier = "extracting a single architecture from a universal binary"
verdict = "allow"
rationale = "Creates a new single-architecture output file; does not modify the input."

[[flag]]
applies_to = "lipo"
flag = "-archs"
translation_modifier = "displaying only the architecture names present in the file"
verdict = "allow"
rationale = "Read-only display of architecture information."

[[flag]]
applies_to = "lipo"
flag = "-remove"
translation_modifier = "removing a specific architecture from a universal binary"
verdict = "allow"
rationale = "Creates a new output file with the architecture removed; does not modify the input."

[[flag]]
applies_to = "lipo"
flag = "-output"
translation_modifier = "writing the result to a specific output file"
verdict = "allow"
rationale = "Only specifies the destination file path."

[[flag]]
applies_to = "lipo"
flag = "-info"
translation_modifier = "displaying a brief description of architectures in the file"
verdict = "allow"
rationale = "Read-only display of architecture information."

[[flag]]
applies_to = "lipo"
flag = "-detailed_info"
translation_modifier = "displaying detailed architecture information from the universal file header"
verdict = "allow"
rationale = "Read-only display of detailed architecture metadata."

[[flag]]
applies_to = "lipo"
flag = "-extract"
translation_modifier = "copying a specific architecture into a new universal output file"
verdict = "allow"
rationale = "Creates a new output file; does not modify the input."

[[flag]]
applies_to = "lipo"
flag = "-replace"
translation_modifier = "replacing the contents of a specific architecture in a universal binary"
verdict = "allow"
rationale = "Creates a new output file with the replaced architecture; does not modify the input."

[[flag]]
applies_to = "lipo"
flag = "-verify_arch"
translation_modifier = "checking whether specified architectures are present in the file"
verdict = "allow"
rationale = "Read-only check; returns an exit code without modifying anything."
