# tools/ruff.toml

[[command]]
path = "ruff"
translation = "Run the Ruff Python linter and formatter."
verdict = "allow"
rationale = "The bare command prints help text and modifies nothing."
tags.scope = "local"
tags.effect = ["read"]
tags.reversibility = "trivial"
tags.target = ["filesystem"]
tags.safety_override = false

[[command]]
path = "ruff check"
translation = "Analyze Python source code for lint errors and style violations."
verdict = "allow"
rationale = "Read-only static analysis that reports problems but does not modify files by default."
tags.scope = "local"
tags.effect = ["read"]
tags.reversibility = "trivial"
tags.target = ["filesystem"]
tags.safety_override = false

[[command]]
path = "ruff format"
translation = "Format Python source code to a consistent style."
verdict = "allow"
rationale = "Reformats Python files in place; changes are purely stylistic and reversible via version control."
tags.scope = "local"
tags.effect = ["read", "write"]
tags.reversibility = "trivial"
tags.target = ["filesystem"]
tags.safety_override = false

[[flag]]
applies_to = "ruff check"
flag = "--fix"
translation_modifier = "automatically fixing problems that have safe corrections"
verdict = "allow"
rationale = "Modifies source files in place to apply auto-fixable lint rules."
tag_modifiers.effect = ["read", "write"]

[[flag]]
applies_to = "ruff check"
flag = "--select"
translation_modifier = "only checking specified rule codes"
verdict = "allow"
rationale = "Narrows which rules are checked; does not change file modification behavior."

[[flag]]
applies_to = "ruff check"
flag = "--ignore"
translation_modifier = "skipping specified rule codes"
verdict = "allow"
rationale = "Suppresses specific rules; does not change file modification behavior."

[[flag]]
applies_to = "ruff check"
flag = "--output-format"
translation_modifier = "using a specified output format for the results"
verdict = "allow"
rationale = "Changes output formatting; does not affect which rules are checked."

[[flag]]
applies_to = "ruff format"
flag = "--check"
translation_modifier = "checking whether files need formatting without modifying them"
verdict = "allow"
rationale = "Read-only validation that exits with an error code if files are not formatted."
tag_modifiers.effect = ["read"]

[[flag]]
applies_to = "ruff format"
flag = "--diff"
translation_modifier = "showing what changes would be made without applying them"
verdict = "allow"
rationale = "Read-only diff output; no files are modified."
tag_modifiers.effect = ["read"]

[[flag]]
applies_to = "ruff check"
flag = "--unsafe-fixes"
translation_modifier = "including fixes that may change code behavior"
verdict = "allow"
rationale = "Applies fixes that could alter runtime semantics, not just style."
tag_modifiers.effect = ["read", "write"]
tag_modifiers.safety_override = true

# ── Combos ───────────────────────────────────────────────────────────────────

[[combo]]
path = "ruff check --fix"
translation = "Analyze Python source code for lint errors and automatically fix all problems that have safe corrections."
verdict = "allow"
rationale = "Modifies source files in place but only applies auto-fix rules that are considered safe by default."
tags.scope = "local"
tags.effect = ["read", "write"]
tags.reversibility = "trivial"
tags.target = ["filesystem"]
tags.safety_override = false

[[combo]]
path = "ruff format --check"
translation = "Check whether Python source files are already formatted without modifying them."
verdict = "allow"
rationale = "Read-only validation commonly used in CI pipelines to enforce consistent formatting."
tags.scope = "local"
tags.effect = ["read"]
tags.reversibility = "trivial"
tags.target = ["filesystem"]
tags.safety_override = false
