# tools/renice.toml

[[command]]
path = "renice"
translation = "Change the scheduling priority of a running process."
verdict = "allow"
rationale = "Adjusts how much CPU time a process receives; does not stop or modify the process itself."

[[flag]]
applies_to = "renice"
flag = "-n"
translation_modifier = "adjusting by a relative amount instead of setting an absolute priority"
verdict = "allow"
rationale = "Changes how the priority value is interpreted; still only adjusts scheduling priority."

[[flag]]
applies_to = "renice"
flag = "-g"
translation_modifier = "targeting an entire process group instead of a single process"
verdict = "allow"
rationale = "Affects all processes in a group, widening the scope of the priority change."

[[flag]]
applies_to = "renice"
flag = "-p"
translation_modifier = "targeting a specific process by its ID"
verdict = "allow"
rationale = "Narrows the target to a single process; this is also the default behavior."

[[flag]]
applies_to = "renice"
flag = "-u"
translation_modifier = "targeting all processes owned by a specific user"
verdict = "allow"
rationale = "Affects every process belonging to the named user, which could impact running services."
