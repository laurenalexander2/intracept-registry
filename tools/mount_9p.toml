# tools/mount_9p.toml — 9P filesystem mount

[[command]]
path = "mount_9p"
translation = "Mount a 9P network filesystem."
verdict = "allow"
rationale = "Attaches a network filesystem to the local directory tree, changing the directory tree for all processes."

[[flag]]
applies_to = "mount_9p"
flag = "-r"
translation_modifier = "as read-only"
verdict = "allow"
rationale = "Restricts the mount to read-only access."
