# tools/eslogger.toml

[[command]]
path = "eslogger"
translation = "Stream Endpoint Security events to standard output or the system log."
verdict = "allow"
rationale = "Read-only monitoring tool that observes system events without modifying anything."

[[flag]]
applies_to = "eslogger"
flag = "--list-events"
translation_modifier = "listing all supported event types instead of streaming"
verdict = "allow"
rationale = "Only prints available event names and exits."

[[flag]]
applies_to = "eslogger"
flag = "--oslog"
translation_modifier = "writing events to the unified logging system instead of standard output"
verdict = "allow"
rationale = "Changes the output destination to the system log; still a read-only operation."
