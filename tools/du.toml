# tools/du.toml

# ── Base command ──────────────────────────────────────────────────────────────

[[command]]
path = "du"
translation = "Show the disk space used by files and directories."
verdict = "allow"
rationale = "Read-only display of disk usage statistics that does not modify anything."
risk_class = "safe"

# ── Output format flags ───────────────────────────────────────────────────────

[[flag]]
applies_to = "du"
flag = "-h"
translation_modifier = ""
verdict = "allow"
rationale = "Displays sizes in human-readable units like megabytes and gigabytes; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "du"
flag = "-k"
translation_modifier = ""
verdict = "allow"
rationale = "Shows sizes in kilobyte blocks; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "du"
flag = "-m"
translation_modifier = ""
verdict = "allow"
rationale = "Shows sizes in megabyte blocks; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "du"
flag = "-g"
translation_modifier = ""
verdict = "allow"
rationale = "Shows sizes in gigabyte blocks; still read-only."
arity = "Boolean"

# ── Scope and filtering flags ────────────────────────────────────────────────

[[flag]]
applies_to = "du"
flag = "-s"
translation_modifier = "showing only a total for each argument"
verdict = "allow"
rationale = "Summarizes output instead of listing every subdirectory; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "du"
flag = "-d"
translation_modifier = "limiting the depth of directory traversal"
verdict = "allow"
rationale = "Restricts how deep the report goes; still read-only."
arity = "Single"
value_type = "Int"

[[flag]]
applies_to = "du"
flag = "-a"
translation_modifier = "showing an entry for every individual file, not just directories"
verdict = "allow"
rationale = "Increases output detail to include all files; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "du"
flag = "-c"
translation_modifier = "showing a grand total at the end"
verdict = "allow"
rationale = "Adds a summary total line to the output; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "du"
flag = "-t"
translation_modifier = "showing only entries larger than a specified size threshold"
verdict = "allow"
rationale = "Filters output to entries above a given size; still read-only."
arity = "Single"
value_type = "Int"

[[flag]]
applies_to = "du"
flag = "-I"
translation_modifier = "skipping files and directories that match a specified pattern"
verdict = "allow"
rationale = "Excludes matching paths from the report; still read-only."
arity = "Single"
value_type = "String"

# ── Symbolic link and filesystem flags ───────────────────────────────────────

[[flag]]
applies_to = "du"
flag = "-L"
translation_modifier = "following symbolic links and counting the size of the files they point to"
verdict = "allow"
rationale = "Follows symbolic links to measure target file sizes; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "du"
flag = "-H"
translation_modifier = "following symbolic links on the command line but not in subdirectories"
verdict = "allow"
rationale = "Only follows symbolic links explicitly named as arguments; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "du"
flag = "-P"
translation_modifier = "not following any symbolic links"
verdict = "allow"
rationale = "Default behavior; counts the link itself rather than its target; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "du"
flag = "-x"
translation_modifier = "staying within a single filesystem and not crossing mount points"
verdict = "allow"
rationale = "Prevents traversal into other mounted filesystems; still read-only."
arity = "Boolean"

# ── Measurement flags ────────────────────────────────────────────────────────

[[flag]]
applies_to = "du"
flag = "-A"
translation_modifier = "showing the apparent file size instead of the actual disk space used"
verdict = "allow"
rationale = "Reports logical size rather than physical allocation; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "du"
flag = "-l"
translation_modifier = "counting files with multiple hard links each time they appear"
verdict = "allow"
rationale = "Counts hard-linked files multiple times instead of once; may overstate total usage but is still read-only."
arity = "Boolean"
