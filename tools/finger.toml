# tools/finger.toml

[[command]]
path = "finger"
translation = "Display information about system users."
verdict = "allow"
rationale = "Read-only query of user account information."
risk_class = "novel"

[[flag]]
applies_to = "finger"
flag = "-l"
translation_modifier = "showing detailed multi-line output including home directory and login shell"
verdict = "allow"
rationale = "Only changes the amount of detail displayed; read-only operation."
arity = "Boolean"

[[flag]]
applies_to = "finger"
flag = "-s"
translation_modifier = "showing brief single-line output"
verdict = "allow"
rationale = "Only changes the output format; read-only operation."
arity = "Boolean"

[[flag]]
applies_to = "finger"
flag = "-m"
translation_modifier = "matching only login names instead of also matching real names"
verdict = "allow"
rationale = "Only changes the matching behavior; read-only operation."
arity = "Boolean"

[[flag]]
applies_to = "finger"
flag = "-p"
translation_modifier = "hiding the contents of plan, project, and public key files"
verdict = "allow"
rationale = "Only suppresses display of extra user files; read-only operation."
arity = "Boolean"

[[flag]]
applies_to = "finger"
flag = "-k"
translation_modifier = "without checking the user accounting database"
verdict = "allow"
rationale = "Only skips the accounting database lookup; read-only operation."
arity = "Boolean"

[[flag]]
applies_to = "finger"
flag = "-h"
translation_modifier = "showing the remote host instead of office information in short format"
verdict = "allow"
rationale = "Only changes which field is displayed; read-only operation."
arity = "Boolean"

[[flag]]
applies_to = "finger"
flag = "-o"
translation_modifier = "showing office location and phone instead of the remote host in short format"
verdict = "allow"
rationale = "Only changes which field is displayed; read-only operation."
arity = "Boolean"

[[flag]]
applies_to = "finger"
flag = "-g"
translation_modifier = "showing only the real name from the user information field"
verdict = "allow"
rationale = "Only restricts which user details are displayed; read-only operation."
arity = "Boolean"
