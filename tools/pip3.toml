# tools/pip3.toml

# ── Base command ──────────────────────────────────────────────────────────────

[[command]]
path = "pip3"
translation = "Run the Python package installer."
verdict = "allow"
rationale = "The bare command prints help text and modifies nothing."
# ── Installing ───────────────────────────────────────────────────────────────
risk_class = "safe"


[[command]]
path = "pip3 install"
translation = "Download and install Python packages and their dependencies."
verdict = "ask"
rationale = "Downloads and runs code from PyPI that may execute setup scripts with system access."
risk_class = "novel"

[[flag]]
applies_to = "pip3 install"
flag = "--upgrade"
translation_modifier = "upgrading already-installed packages to the latest version"
verdict = "allow"
rationale = "Replaces existing packages with newer versions that may introduce breaking changes."
arity = "Boolean"

[[flag]]
applies_to = "pip3 install"
flag = "-U"
translation_modifier = "upgrading already-installed packages to the latest version"
verdict = "allow"
rationale = "Alias for --upgrade; replaces existing packages with newer versions that may introduce breaking changes."
arity = "Boolean"

[[flag]]
applies_to = "pip3 install"
flag = "--force-reinstall"
translation_modifier = "reinstalling packages even if they are already up to date"
verdict = "allow"
rationale = "Forces re-download and reinstallation, which re-runs setup scripts."
arity = "Boolean"
risk_class_override = "priv_esc"

[[flag]]
applies_to = "pip3 install"
flag = "--no-deps"
translation_modifier = "without installing package dependencies"
verdict = "allow"
rationale = "Reduces the scope of installation; may leave packages non-functional but limits what is installed."
arity = "Boolean"

[[flag]]
applies_to = "pip3 install"
flag = "--user"
translation_modifier = "installing to the user site-packages directory instead of system-wide"
verdict = "allow"
rationale = "Limits the installation to the current user's directory, avoiding system-wide changes."
arity = "Boolean"

[[flag]]
applies_to = "pip3 install"
flag = "--pre"
translation_modifier = "including pre-release and development versions"
verdict = "allow"
rationale = "Pre-release versions may be unstable and introduce regressions or breaking changes."
arity = "Boolean"

[[flag]]
applies_to = "pip3 install"
flag = "-r"
translation_modifier = "installing all packages listed in a requirements file"
verdict = "allow"
rationale = "Installs potentially many packages at once based on file contents, widening the scope."
arity = "Boolean"

[[flag]]
applies_to = "pip3 install"
flag = "-e"
translation_modifier = "installing a local project in editable mode so changes take effect immediately"
verdict = "allow"
rationale = "Links a local directory into site-packages; changes to source files are reflected without reinstalling."
arity = "Boolean"

[[flag]]
applies_to = "pip3 install"
flag = "--dry-run"
translation_modifier = "simulating the installation without actually installing anything"
verdict = "allow"
rationale = "No packages are installed; only shows what would be done."
arity = "Boolean"

[[flag]]
applies_to = "pip3 install"
flag = "-t"
translation_modifier = "installing packages into a specific target directory"
verdict = "allow"
rationale = "Directs installation to a custom directory instead of the default site-packages."
arity = "Boolean"

[[flag]]
applies_to = "pip3 install"
flag = "--break-system-packages"
translation_modifier = "allowing modifications to a system-managed Python installation"
verdict = "ask"
rationale = "Overrides the externally-managed environment guard, which may corrupt the system Python installation."
arity = "Boolean"
risk_class_override = "priv_esc"

[[flag]]
applies_to = "pip3 install"
flag = "--no-cache-dir"
translation_modifier = "without using or saving to the local cache"
verdict = "allow"
rationale = "Skips the download cache; forces fresh downloads but does not introduce additional risk."
# ── Uninstalling ─────────────────────────────────────────────────────────────
arity = "Boolean"


[[command]]
path = "pip3 uninstall"
translation = "Remove installed Python packages."
verdict = "allow"
rationale = "Removes packages that other packages or scripts may depend on."
risk_class = "novel"

[[flag]]
applies_to = "pip3 uninstall"
flag = "-y"
translation_modifier = "without asking for confirmation"
verdict = "allow"
rationale = "Bypasses the confirmation prompt, increasing the chance of accidental removal."
arity = "Boolean"
risk_class_override = "priv_esc"

[[flag]]
applies_to = "pip3 uninstall"
flag = "-r"
translation_modifier = "removing all packages listed in a requirements file"
verdict = "allow"
rationale = "Uninstalls potentially many packages at once based on file contents."
arity = "Boolean"

[[flag]]
applies_to = "pip3 uninstall"
flag = "--break-system-packages"
translation_modifier = "allowing removal from a system-managed Python installation"
verdict = "ask"
rationale = "Overrides the externally-managed environment guard, which may corrupt the system Python installation."
# ── Inspecting ───────────────────────────────────────────────────────────────
arity = "Boolean"
risk_class_override = "priv_esc"


[[command]]
path = "pip3 list"
translation = "List installed Python packages."
verdict = "allow"
rationale = "Read-only listing of installed packages."
risk_class = "safe"

[[flag]]
applies_to = "pip3 list"
flag = "--outdated"
translation_modifier = "showing only packages with newer versions available"
verdict = "allow"
rationale = "Read-only display filtered to outdated packages."
arity = "Boolean"

[[flag]]
applies_to = "pip3 list"
flag = "--uptodate"
translation_modifier = "showing only packages already at the latest version"
verdict = "allow"
rationale = "Read-only display filtered to up-to-date packages."
arity = "Boolean"

[[command]]
path = "pip3 show"
translation = "Display detailed information about an installed Python package."
verdict = "allow"
rationale = "Read-only display of package metadata."
risk_class = "safe"

[[command]]
path = "pip3 freeze"
translation = "Output installed packages and versions in requirements file format."
verdict = "allow"
rationale = "Read-only output of package versions suitable for piping to a file."
risk_class = "safe"

[[command]]
path = "pip3 check"
translation = "Verify that installed packages have compatible dependencies."
verdict = "allow"
rationale = "Read-only dependency compatibility check."
risk_class = "safe"

[[command]]
path = "pip3 inspect"
translation = "Show detailed information about the current Python environment."
verdict = "allow"
rationale = "Read-only inspection of the Python environment and installed packages."
# ── Downloading ──────────────────────────────────────────────────────────────
risk_class = "safe"


[[command]]
path = "pip3 download"
translation = "Download Python packages to a directory without installing them."
verdict = "allow"
rationale = "Downloads package files to disk without installation or script execution."
# ── Searching ────────────────────────────────────────────────────────────────
risk_class = "novel"


[[command]]
path = "pip3 search"
translation = "Search the Python Package Index for packages."
verdict = "allow"
rationale = "Read-only search of the package repository."
risk_class = "novel"

[[command]]
path = "pip3 index"
translation = "Inspect information available from package indexes."
verdict = "allow"
rationale = "Read-only inspection of package index metadata."
# ── Cache management ─────────────────────────────────────────────────────────
risk_class = "novel"


[[command]]
path = "pip3 cache"
translation = "Inspect and manage the pip download cache."
verdict = "allow"
rationale = "The bare subcommand prints help text."
risk_class = "safe"

[[command]]
path = "pip3 cache purge"
translation = "Remove all items from the pip download cache."
verdict = "allow"
rationale = "Deletes cached packages; they will be re-downloaded on next install."
risk_class = "novel"

[[command]]
path = "pip3 cache list"
translation = "List packages stored in the pip download cache."
verdict = "allow"
rationale = "Read-only listing of cached package files."
risk_class = "safe"

[[command]]
path = "pip3 cache info"
translation = "Show information about the pip download cache."
verdict = "allow"
rationale = "Read-only display of cache location and size."
risk_class = "safe"

[[command]]
path = "pip3 cache remove"
translation = "Remove specific packages from the pip download cache."
verdict = "allow"
rationale = "Deletes individual cached packages; they will be re-downloaded if needed."
# ── Configuration ────────────────────────────────────────────────────────────
risk_class = "novel"


[[command]]
path = "pip3 config"
translation = "View or modify pip configuration settings."
verdict = "allow"
rationale = "The bare subcommand prints help text."
risk_class = "safe"

[[command]]
path = "pip3 config list"
translation = "Display the current pip configuration values."
verdict = "allow"
rationale = "Read-only display of configuration."
risk_class = "safe"

[[command]]
path = "pip3 config set"
translation = "Set a pip configuration value."
verdict = "allow"
rationale = "Changes pip behavior for future commands, such as default index URL or trusted hosts."
risk_class = "novel"

[[command]]
path = "pip3 config unset"
translation = "Remove a pip configuration value."
verdict = "allow"
rationale = "Restores a single configuration key to its default; easily re-set."
# ── Building ─────────────────────────────────────────────────────────────────
risk_class = "novel"


[[command]]
path = "pip3 wheel"
translation = "Build wheel archives from package requirements."
verdict = "allow"
rationale = "Creates wheel files on disk; does not install anything."
risk_class = "novel"

[[command]]
path = "pip3 hash"
translation = "Compute the hash of a package archive file."
verdict = "allow"
rationale = "Read-only computation of file hashes."
# ── Combos ───────────────────────────────────────────────────────────────────
risk_class = "safe"


[[combo]]
path = "pip3 install --force-reinstall"
translation = "Download and reinstall Python packages even if they are already installed at the correct version, re-running all setup scripts."
verdict = "ask"
rationale = "Forces re-download and reinstallation of all packages, re-executing setup scripts that may have system-level side effects."
risk_class = "priv_esc"

[[combo]]
path = "pip3 install --upgrade"
translation = "Download and install the latest version of a Python package, replacing any already-installed version."
verdict = "ask"
rationale = "Replaces existing packages with newer versions that may introduce breaking changes or run new setup scripts."
risk_class = "novel"

[[combo]]
path = "pip3 install --user"
translation = "Download and install Python packages into the current user's site-packages directory instead of the system-wide location."
verdict = "ask"
rationale = "Downloads and runs code from PyPI but limits the installation to the user directory, avoiding system-wide changes."
risk_class = "novel"

[[combo]]
path = "pip3 install -e"
translation = "Install a local Python project in editable mode, linking its source directory into site-packages so code changes take effect immediately."
verdict = "ask"
rationale = "Runs setup scripts and creates a link to local source code; changes to the source are reflected without reinstalling."
risk_class = "novel"

[[combo]]
path = "pip3 install -r"
translation = "Download and install all Python packages listed in a requirements file and their dependencies."
verdict = "ask"
rationale = "Installs potentially many packages at once from a file, widening the scope of code downloaded and executed from PyPI."
risk_class = "novel"

[[combo]]
path = "pip3 uninstall -y"
translation = "Remove installed Python packages immediately without prompting for confirmation."
verdict = "allow"
rationale = "Bypasses the interactive confirmation prompt, removing packages without a chance to review the list."
risk_class = "priv_esc"
