# tools/snmptranslate.toml

[[command]]
path = "snmptranslate"
translation = "Convert SNMP object names between human-readable and numeric formats."
verdict = "allow"
rationale = "Local-only name translation; no network communication or state modification."
risk_class = "novel"

[[flag]]
applies_to = "snmptranslate"
flag = "-Td"
translation_modifier = "printing full details about the specified object"
verdict = "allow"
rationale = "Only changes the amount of information displayed."
arity = "Boolean"

[[flag]]
applies_to = "snmptranslate"
flag = "-Tp"
translation_modifier = "printing a graphical tree rooted at the specified object"
verdict = "allow"
rationale = "Only changes the output format to a tree view."
arity = "Boolean"

[[flag]]
applies_to = "snmptranslate"
flag = "-Ta"
translation_modifier = "dumping all loaded definitions in a simple format"
verdict = "allow"
rationale = "Only changes the output format; read-only."
arity = "Boolean"

[[flag]]
applies_to = "snmptranslate"
flag = "-Tl"
translation_modifier = "dumping all objects with labels"
verdict = "allow"
rationale = "Only changes the output format; read-only."
arity = "Boolean"

[[flag]]
applies_to = "snmptranslate"
flag = "-To"
translation_modifier = "dumping all objects in numeric form"
verdict = "allow"
rationale = "Only changes the output format; read-only."
arity = "Boolean"

[[flag]]
applies_to = "snmptranslate"
flag = "-Ts"
translation_modifier = "dumping all objects in symbolic form"
verdict = "allow"
rationale = "Only changes the output format; read-only."
arity = "Boolean"

[[flag]]
applies_to = "snmptranslate"
flag = "-On"
translation_modifier = ""
verdict = "allow"
rationale = "Only changes how object names are displayed in the output."
arity = "Boolean"

[[flag]]
applies_to = "snmptranslate"
flag = "-IR"
translation_modifier = "searching for the object name across all loaded definitions"
verdict = "allow"
rationale = "Only broadens the name lookup; read-only."
arity = "Boolean"

[[flag]]
applies_to = "snmptranslate"
flag = "-m"
translation_modifier = "loading specific definition files"
verdict = "allow"
rationale = "Only controls which definition files are parsed locally."
arity = "Boolean"

[[flag]]
applies_to = "snmptranslate"
flag = "-M"
translation_modifier = "searching for definition files in specific directories"
verdict = "allow"
rationale = "Only controls where definition files are found on the local system."
arity = "Boolean"
