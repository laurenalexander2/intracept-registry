# tools/execsnoop.toml

[[command]]
path = "execsnoop"
translation = "Monitor and display new process executions in real time using DTrace."
verdict = "allow"
rationale = "Read-only diagnostic tool that observes process creation without modifying anything."

[[flag]]
applies_to = "execsnoop"
flag = "-v"
translation_modifier = "including human-readable timestamps"
verdict = "allow"
rationale = "Only adds timestamp information to the output."

[[flag]]
applies_to = "execsnoop"
flag = "-c"
translation_modifier = "monitoring only a specific command name"
verdict = "allow"
rationale = "Narrows the scope to a single command; still read-only."
