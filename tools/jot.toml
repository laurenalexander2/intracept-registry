# tools/jot.toml

[[command]]
path = "jot"
translation = "Generate a sequence of numbers or random data."
verdict = "allow"
rationale = "Writes generated data to the terminal; does not modify any files."
risk_class = "novel"

[[flag]]
applies_to = "jot"
flag = "-r"
translation_modifier = "generating random data instead of sequential data"
verdict = "allow"
rationale = "Only changes the data generation mode."
arity = "Boolean"

[[flag]]
applies_to = "jot"
flag = "-w"
translation_modifier = "formatting each output value using a printf-style format string"
verdict = "allow"
rationale = "Only changes the output format."
arity = "Boolean"

[[flag]]
applies_to = "jot"
flag = "-s"
translation_modifier = "using a specific string to separate output values"
verdict = "allow"
rationale = "Only changes the delimiter between values."
arity = "Boolean"

[[flag]]
applies_to = "jot"
flag = "-c"
translation_modifier = "printing each value as a character"
verdict = "allow"
rationale = "Only changes the output format to character representation."
arity = "Boolean"
