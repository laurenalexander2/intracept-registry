# tools/opensnoop.toml — DTrace file open tracer

[[command]]
path = "opensnoop"
translation = "Trace file open operations across the system in real time using DTrace."
verdict = "allow"
rationale = "Read-only tracing of file open events; requires root but does not modify anything."

[[flag]]
applies_to = "opensnoop"
flag = "-p"
translation_modifier = "filtering to a specific process ID"
verdict = "allow"
rationale = "Narrows the trace scope; still read-only."

[[flag]]
applies_to = "opensnoop"
flag = "-x"
translation_modifier = "showing only failed opens"
verdict = "allow"
rationale = "Filters output to errors only; still read-only."
