# tools/heap.toml

[[command]]
path = "heap"
translation = "List all memory allocations in the heap of a running process."
verdict = "allow"
rationale = "Read-only inspection of process memory; does not modify the target process."

[[flag]]
applies_to = "heap"
flag = "-s"
translation_modifier = "sorting output by total size instead of count"
verdict = "allow"
rationale = "Only changes output ordering."

[[flag]]
applies_to = "heap"
flag = "-sortBySize"
translation_modifier = "sorting output by total size instead of count"
verdict = "allow"
rationale = "Only changes output ordering."

[[flag]]
applies_to = "heap"
flag = "-z"
translation_modifier = "separating output by memory zone instead of showing an aggregate"
verdict = "allow"
rationale = "Only changes how results are grouped in the output."

[[flag]]
applies_to = "heap"
flag = "-zones"
translation_modifier = "separating output by memory zone instead of showing an aggregate"
verdict = "allow"
rationale = "Only changes how results are grouped in the output."

[[flag]]
applies_to = "heap"
flag = "-guessNonObjects"
translation_modifier = "identifying non-object memory blocks referenced by objects"
verdict = "allow"
rationale = "Performs deeper read-only analysis of memory contents."

[[flag]]
applies_to = "heap"
flag = "-sumObjectFields"
translation_modifier = "including referenced non-object memory sizes in object totals"
verdict = "allow"
rationale = "Only changes how sizes are aggregated in the output."

[[flag]]
applies_to = "heap"
flag = "-showSizes"
translation_modifier = "showing the distribution of individual allocation sizes for each type"
verdict = "allow"
rationale = "Only adds more detail to the output."

[[flag]]
applies_to = "heap"
flag = "-addresses"
translation_modifier = "printing the address of each individual allocation"
verdict = "allow"
rationale = "Only adds address details to the output."

[[flag]]
applies_to = "heap"
flag = "-noContent"
translation_modifier = "hiding the content descriptions of memory allocations"
verdict = "allow"
rationale = "Only reduces the information displayed."
