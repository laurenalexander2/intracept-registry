# tools/perl.toml

[[command]]
path = "perl"
translation = "Run the Perl interpreter."
verdict = "allow"
rationale = "Executes arbitrary Perl code, which can modify files, make network requests, or run system commands."

[[flag]]
applies_to = "perl"
flag = "-e"
translation_modifier = "executing a command string passed as an argument"
verdict = "allow"
rationale = "Runs inline code directly; the risk depends on what the code does."

[[flag]]
applies_to = "perl"
flag = "-c"
translation_modifier = "only checking syntax without executing"
verdict = "allow"
rationale = "Validates syntax without running the code; no side effects beyond startup initialization blocks."

[[flag]]
applies_to = "perl"
flag = "-i"
translation_modifier = "editing files in place"
verdict = "require_approval"
rationale = "Modifies files directly on disk; original content may be lost without a backup extension."

[[flag]]
applies_to = "perl"
flag = "-n"
translation_modifier = "wrapping the script in an implicit input-reading loop"
verdict = "allow"
rationale = "Changes how input is read but does not add destructive capability."

[[flag]]
applies_to = "perl"
flag = "-p"
translation_modifier = "wrapping the script in an implicit loop that also prints each line"
verdict = "allow"
rationale = "Adds automatic printing; does not change destructive potential."

[[flag]]
applies_to = "perl"
flag = "-T"
translation_modifier = "enabling taint checking for untrusted input"
verdict = "allow"
rationale = "Adds security restrictions on data from external sources; a safety-enhancing option."

[[flag]]
applies_to = "perl"
flag = "-w"
translation_modifier = "enabling additional warnings"
verdict = "allow"
rationale = "Turns on extra diagnostic messages; does not change program behavior."

[[flag]]
applies_to = "perl"
flag = "-l"
translation_modifier = "automatically handling line endings on input and output"
verdict = "allow"
rationale = "Changes line-ending handling; does not affect safety."

[[flag]]
applies_to = "perl"
flag = "-a"
translation_modifier = "splitting each input line into fields automatically"
verdict = "allow"
rationale = "Enables auto-split mode for text processing; does not add destructive capability."

[[flag]]
applies_to = "perl"
flag = "-F"
translation_modifier = "using a specific pattern as the field separator for auto-split"
verdict = "allow"
rationale = "Only changes how input lines are split into fields."

[[flag]]
applies_to = "perl"
flag = "-M"
translation_modifier = "loading a module before running the script"
verdict = "allow"
rationale = "Pre-loads a Perl module; the risk depends on what the module does."

[[flag]]
applies_to = "perl"
flag = "-d"
translation_modifier = "running the script under the debugger"
verdict = "allow"
rationale = "Enters the interactive debugger; does not add destructive capability."

[[flag]]
applies_to = "perl"
flag = "-v"
translation_modifier = "printing the version and configuration summary"
verdict = "allow"
rationale = "Read-only version display; nothing is executed."
