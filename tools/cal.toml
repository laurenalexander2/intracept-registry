# tools/cal.toml

[[command]]
path = "cal"
translation = "Display a calendar."
verdict = "allow"
rationale = "Read-only display of calendar information."
risk_class = "novel"

[[flag]]
applies_to = "cal"
flag = "-y"
translation_modifier = "showing the entire year"
verdict = "allow"
rationale = "Displays all twelve months; read-only output."
arity = "Boolean"

[[flag]]
applies_to = "cal"
flag = "-3"
translation_modifier = "showing the previous, current, and next month"
verdict = "allow"
rationale = "Displays a three-month view; read-only output."
arity = "Boolean"

[[flag]]
applies_to = "cal"
flag = "-j"
translation_modifier = "numbering days from the start of the year instead of the month"
verdict = "allow"
rationale = "Changes display format to show day-of-year numbers; read-only output."
arity = "Boolean"

[[flag]]
applies_to = "cal"
flag = "-h"
translation_modifier = "without highlighting today's date"
verdict = "allow"
rationale = "Cosmetic change that removes the highlight on the current day."
arity = "Boolean"

[[flag]]
applies_to = "cal"
flag = "-A"
translation_modifier = "including the specified number of months after the current month"
verdict = "allow"
rationale = "Extends the calendar display forward; read-only output."
arity = "Boolean"

[[flag]]
applies_to = "cal"
flag = "-B"
translation_modifier = "including the specified number of months before the current month"
verdict = "allow"
rationale = "Extends the calendar display backward; read-only output."
arity = "Boolean"

[[flag]]
applies_to = "cal"
flag = "-m"
translation_modifier = "showing a specific month"
verdict = "allow"
rationale = "Displays a single named month; read-only output."
arity = "Boolean"
