# tools/chmod.toml

# ── Base command ──────────────────────────────────────────────────────────────

[[command]]
path = "chmod"
translation = "Change file or directory permissions."
verdict = "allow"
rationale = "Modifies access controls, which can expose files to unauthorized users or lock out legitimate access."

# ── Scope modifiers ──────────────────────────────────────────────────────────

[[flag]]
applies_to = "chmod"
flag = "-R"
translation_modifier = "recursively through all subdirectories"
verdict = "require_approval"
rationale = "Applies permission changes to an entire directory tree, greatly increasing the blast radius."

# ── Symlink behavior ─────────────────────────────────────────────────────────

[[flag]]
applies_to = "chmod"
flag = "-h"
translation_modifier = "changing the permissions of the symbolic link itself instead of its target"
verdict = "allow"
rationale = "Targets the link rather than the linked file; a narrower scope change."

[[flag]]
applies_to = "chmod"
flag = "-H"
translation_modifier = "following symbolic links on the command line but not in subdirectories"
verdict = "allow"
rationale = "Causes permission changes to affect the targets of explicitly named symbolic links when used with -R."

[[flag]]
applies_to = "chmod"
flag = "-L"
translation_modifier = "following all symbolic links during recursive traversal"
verdict = "require_approval"
rationale = "When combined with -R, permission changes can reach files outside the intended directory tree via symbolic links."

[[flag]]
applies_to = "chmod"
flag = "-P"
translation_modifier = "without following any symbolic links during recursive traversal"
verdict = "allow"
rationale = "The default behavior with -R; avoids reaching files outside the directory tree."

# ── Output control ───────────────────────────────────────────────────────────

[[flag]]
applies_to = "chmod"
flag = "-f"
translation_modifier = "suppressing error messages for files that cannot be changed"
verdict = "allow"
rationale = "Silences errors but does not change what permissions are modified."

[[flag]]
applies_to = "chmod"
flag = "-v"
translation_modifier = "showing each file as its permissions are changed"
verdict = "allow"
rationale = "Adds verbose output without changing what permissions are modified."

# ── ACL operations (macOS) ───────────────────────────────────────────────────

[[flag]]
applies_to = "chmod"
flag = "+a"
translation_modifier = "adding an access control list entry to the file"
verdict = "allow"
rationale = "Grants or restricts additional access beyond standard Unix permissions."

[[flag]]
applies_to = "chmod"
flag = "-a"
translation_modifier = "removing an access control list entry from the file"
verdict = "allow"
rationale = "Revokes a specific access control list entry, which may remove needed access."

[[flag]]
applies_to = "chmod"
flag = "-N"
translation_modifier = "removing all access control list entries from the file"
verdict = "allow"
rationale = "Strips all ACL entries, reverting the file to standard Unix permissions only."

[[flag]]
applies_to = "chmod"
flag = "-E"
translation_modifier = "reading access control list entries from standard input"
verdict = "allow"
rationale = "Replaces ACL entries with those read from input; the scope depends on the input provided."

[[flag]]
applies_to = "chmod"
flag = "-C"
translation_modifier = "returning whether the file's access control list is correct without making changes"
verdict = "allow"
rationale = "Read-only check of ACL correctness; does not modify anything."

[[flag]]
applies_to = "chmod"
flag = "-i"
translation_modifier = "removing inherited access control list entries"
verdict = "allow"
rationale = "Strips inherited ACL entries, which may change effective permissions on the file."
