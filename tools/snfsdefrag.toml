# tools/snfsdefrag.toml

[[command]]
path = "snfsdefrag"
translation = "Defragment files on an Xsan volume by consolidating extents."
verdict = "allow"
rationale = "Rewrites file data to reduce fragmentation; the files are preserved but disk layout changes."
risk_class = "novel"

[[flag]]
applies_to = "snfsdefrag"
flag = "-e"
translation_modifier = "listing the extents of a file without defragmenting"
verdict = "allow"
rationale = "Read-only display of file extent information."
arity = "Boolean"

[[flag]]
applies_to = "snfsdefrag"
flag = "-c"
translation_modifier = "reporting the fragmentation count without defragmenting"
verdict = "allow"
rationale = "Read-only fragmentation count."
arity = "Boolean"

[[flag]]
applies_to = "snfsdefrag"
flag = "-p"
translation_modifier = "pruning unused preallocated space from files"
verdict = "allow"
rationale = "Releases unused allocated space; the file content is unchanged but allocation shrinks."
arity = "Boolean"

[[flag]]
applies_to = "snfsdefrag"
flag = "-G"
translation_modifier = "migrating files to a specified stripe group"
verdict = "allow"
rationale = "Moves file data between storage pools; useful for retiring hardware."
arity = "Boolean"

[[flag]]
applies_to = "snfsdefrag"
flag = "-r"
translation_modifier = "recursively processing directories"
verdict = "allow"
rationale = "Applies the operation to all files in a directory tree, widening scope."
arity = "Boolean"
