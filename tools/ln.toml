# tools/ln.toml

[[command]]
path = "ln"
translation = "Create a link that points to an existing file, so the same file can be accessed from multiple locations."
verdict = "allow"
rationale = "Creates a new directory entry pointing to an existing file; does not modify the original."
risk_class = "novel"

[[flag]]
applies_to = "ln"
flag = "-s"
translation_modifier = "creating a shortcut that refers to the target by path instead of a direct link"
verdict = "allow"
rationale = "Creates a shortcut rather than a direct link; does not modify the target file."
arity = "Boolean"

[[flag]]
applies_to = "ln"
flag = "-f"
translation_modifier = "overwriting any existing file at the destination without asking"
verdict = "allow"
rationale = "Silently replaces an existing file or link at the destination path."
arity = "Boolean"
risk_class_override = "priv_esc"

[[flag]]
applies_to = "ln"
flag = "-i"
translation_modifier = "prompting for confirmation before overwriting an existing file"
verdict = "allow"
rationale = "Adds an interactive confirmation step before replacing anything; a safety improvement."
arity = "Boolean"

[[flag]]
applies_to = "ln"
flag = "-v"
translation_modifier = "showing each link as it is created"
verdict = "allow"
rationale = "Prints status messages; does not change behavior."
arity = "Boolean"

[[flag]]
applies_to = "ln"
flag = "-h"
translation_modifier = "treating the destination as a regular file even if it is a shortcut to a directory"
verdict = "allow"
rationale = "Prevents following a shortcut at the destination; avoids creating the link inside an unintended directory."
arity = "Boolean"

[[flag]]
applies_to = "ln"
flag = "-F"
translation_modifier = "removing an existing directory at the destination to make room for the link"
verdict = "ask"
rationale = "Deletes a directory to replace it with a link, which can cause data loss if the directory contains files."
arity = "Boolean"
risk_class_override = "destructive"

[[flag]]
applies_to = "ln"
flag = "-w"
translation_modifier = "warning if the target of the shortcut does not currently exist"
verdict = "allow"
rationale = "Alerts about broken shortcuts; an informational safety check."
arity = "Boolean"

# ── Combos ───────────────────────────────────────────────────────────────────

[[combo]]
path = "ln -s"
translation = "Create a symbolic link (shortcut) that refers to an existing file or directory by path."
verdict = "allow"
rationale = "Creates a lightweight pointer to a target; does not modify the target file or directory."
risk_class = "novel"

[[combo]]
path = "ln -f -s"
translation = "Create a symbolic link, overwriting any existing file at the destination without prompting."
verdict = "allow"
rationale = "Silently replaces an existing file or link at the destination path to create the new symbolic link."
risk_class = "priv_esc"
