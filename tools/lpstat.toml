# tools/lpstat.toml

[[command]]
path = "lpstat"
translation = "Display the status of printers and print jobs."
verdict = "allow"
rationale = "Read-only display of printer and job status."

[[flag]]
applies_to = "lpstat"
flag = "-t"
translation_modifier = "showing all status information"
verdict = "allow"
rationale = "Only changes the amount of detail displayed."

[[flag]]
applies_to = "lpstat"
flag = "-d"
translation_modifier = "showing the current default printer"
verdict = "allow"
rationale = "Only displays the default printer name."

[[flag]]
applies_to = "lpstat"
flag = "-a"
translation_modifier = "showing whether printers are accepting new jobs"
verdict = "allow"
rationale = "Read-only display of printer acceptance state."

[[flag]]
applies_to = "lpstat"
flag = "-p"
translation_modifier = "showing whether printers are enabled for printing"
verdict = "allow"
rationale = "Read-only display of printer enabled/disabled state."

[[flag]]
applies_to = "lpstat"
flag = "-o"
translation_modifier = "showing jobs queued on specific printers"
verdict = "allow"
rationale = "Read-only display of queued print jobs."

[[flag]]
applies_to = "lpstat"
flag = "-r"
translation_modifier = "showing whether the print server is running"
verdict = "allow"
rationale = "Read-only check of server status."

[[flag]]
applies_to = "lpstat"
flag = "-s"
translation_modifier = "showing a summary of printers, classes, and devices"
verdict = "allow"
rationale = "Read-only summary of print system configuration."

[[flag]]
applies_to = "lpstat"
flag = "-v"
translation_modifier = "showing which devices are attached to each printer"
verdict = "allow"
rationale = "Read-only display of printer device connections."

[[flag]]
applies_to = "lpstat"
flag = "-u"
translation_modifier = "showing jobs queued by specific users"
verdict = "allow"
rationale = "Read-only display of jobs filtered by user."

[[flag]]
applies_to = "lpstat"
flag = "-l"
translation_modifier = "showing detailed information"
verdict = "allow"
rationale = "Only increases the verbosity of the output."

[[flag]]
applies_to = "lpstat"
flag = "-e"
translation_modifier = "showing all available printers on the local network"
verdict = "allow"
rationale = "Read-only network printer discovery."

[[flag]]
applies_to = "lpstat"
flag = "-W"
translation_modifier = "filtering by completed or not-completed jobs"
verdict = "allow"
rationale = "Only changes which jobs are displayed."
