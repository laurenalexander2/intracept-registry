# tools/black.toml

[[command]]
path = "black"
translation = "Format Python source code to a consistent style."
verdict = "allow"
rationale = "Reformats Python files in place by default; changes are purely stylistic and reversible via version control."
risk_class = "novel"

[[flag]]
applies_to = "black"
flag = "--check"
translation_modifier = "checking whether files need formatting without modifying them"
verdict = "allow"
rationale = "Read-only validation that exits with an error code if files are not formatted."
arity = "Boolean"

[[flag]]
applies_to = "black"
flag = "--diff"
translation_modifier = "showing what changes would be made without applying them"
verdict = "allow"
rationale = "Read-only diff output; no files are modified."
arity = "Boolean"

[[flag]]
applies_to = "black"
flag = "--line-length"
translation_modifier = "using a specified maximum line length"
verdict = "allow"
rationale = "Changes a formatting preference; does not affect file modification behavior."
arity = "Boolean"

[[flag]]
applies_to = "black"
flag = "--target-version"
translation_modifier = "formatting for a specified Python version"
verdict = "allow"
rationale = "Changes which syntax features are used; does not affect file modification behavior."
arity = "Boolean"

[[flag]]
applies_to = "black"
flag = "--quiet"
translation_modifier = "suppressing non-error output"
verdict = "allow"
rationale = "Reduces output verbosity; does not change formatting behavior."
arity = "Boolean"

[[flag]]
applies_to = "black"
flag = "--include"
translation_modifier = "only formatting files matching a specified pattern"
verdict = "allow"
rationale = "Narrows which files are processed; does not change formatting behavior."
arity = "Boolean"

[[flag]]
applies_to = "black"
flag = "--exclude"
translation_modifier = "skipping files matching a specified pattern"
verdict = "allow"
rationale = "Narrows which files are processed; does not change formatting behavior."
# ── Combos ───────────────────────────────────────────────────────────────────
arity = "Boolean"


[[combo]]
path = "black --check"
translation = "Check whether Python source files need formatting without modifying them."
verdict = "allow"
rationale = "Read-only validation commonly used in CI pipelines to enforce consistent formatting."
risk_class = "safe"

[[combo]]
path = "black --check --diff"
translation = "Check whether Python source files need formatting and show the exact changes that would be made, without modifying any files."
verdict = "allow"
rationale = "Combines format checking with a diff preview, providing full visibility into what black would change."
risk_class = "safe"
