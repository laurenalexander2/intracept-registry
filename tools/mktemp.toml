# tools/mktemp.toml — Temporary file/directory creator

[[command]]
path = "mktemp"
translation = "Create a temporary file or directory with a unique name."
verdict = "allow"
rationale = "Creates a small temporary file in a temp directory; trivially removable."
risk_class = "novel"

[[flag]]
applies_to = "mktemp"
flag = "-d"
translation_modifier = "creating a directory instead of a file"
verdict = "allow"
rationale = "Creates a temporary directory instead of a file; still trivially removable."
arity = "Boolean"

[[flag]]
applies_to = "mktemp"
flag = "-u"
translation_modifier = "unlinking the file before exiting, leaving only the generated name"
verdict = "allow"
rationale = "Operates in unsafe mode introducing a race condition, but creates no persistent file."
arity = "Boolean"

[[flag]]
applies_to = "mktemp"
flag = "-t"
translation_modifier = "using a prefix and the system temp directory to generate the path"
verdict = "allow"
rationale = "Controls the naming template; no additional risk."
arity = "Boolean"

[[flag]]
applies_to = "mktemp"
flag = "-p"
translation_modifier = "in a specified directory instead of the default temp location"
verdict = "allow"
rationale = "Changes the target directory for the temporary file; no additional risk."
arity = "Boolean"
