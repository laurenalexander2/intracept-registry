# tools/split.toml

[[command]]
path = "split"
translation = "Split a file into smaller pieces."
verdict = "allow"
rationale = "Creates new files from an input file; the original is unchanged."

[[flag]]
applies_to = "split"
flag = "-b"
translation_modifier = "splitting by a specified byte count per piece"
verdict = "allow"
rationale = "Controls chunk size; no destructive action."

[[flag]]
applies_to = "split"
flag = "-l"
translation_modifier = "splitting by a specified number of lines per piece"
verdict = "allow"
rationale = "Controls chunk size by line count; no destructive action."

[[flag]]
applies_to = "split"
flag = "-n"
translation_modifier = "splitting into a specified number of equal-sized chunks"
verdict = "allow"
rationale = "Controls chunk count; no destructive action."

[[flag]]
applies_to = "split"
flag = "-p"
translation_modifier = "splitting at lines matching a specified pattern"
verdict = "allow"
rationale = "Uses regex to determine split points; no destructive action."

[[flag]]
applies_to = "split"
flag = "-a"
translation_modifier = "using a specified suffix length for output filenames"
verdict = "allow"
rationale = "Controls naming; no destructive action."

[[flag]]
applies_to = "split"
flag = "-d"
translation_modifier = "using numeric suffixes instead of alphabetic ones"
verdict = "allow"
rationale = "Only changes output filename format; no destructive action."

[[flag]]
applies_to = "split"
flag = "-c"
translation_modifier = "without overwriting existing output files"
verdict = "allow"
rationale = "Prevents overwriting; a safety-improving option."
