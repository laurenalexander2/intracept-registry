# tools/sw_vers.toml

[[command]]
path = "sw_vers"
translation = "Display macOS system version information."
verdict = "allow"
rationale = "Read-only display of OS version; modifies nothing."
risk_class = "novel"

[[flag]]
applies_to = "sw_vers"
flag = "--productName"
translation_modifier = "showing only the operating system name"
verdict = "allow"
rationale = "Read-only output filter; modifies nothing."
arity = "Boolean"

[[flag]]
applies_to = "sw_vers"
flag = "--productVersion"
translation_modifier = "showing only the operating system version number"
verdict = "allow"
rationale = "Read-only output filter; modifies nothing."
arity = "Boolean"

[[flag]]
applies_to = "sw_vers"
flag = "--buildVersion"
translation_modifier = "showing only the build version identifier"
verdict = "allow"
rationale = "Read-only output filter; modifies nothing."
arity = "Boolean"
