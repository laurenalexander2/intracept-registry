# tools/msgmerge.toml — GNU gettext message merger

[[command]]
path = "msgmerge"
translation = "Merge existing translations with an updated PO template file."
verdict = "allow"
rationale = "Combines translations with a new template; writes to the terminal unless --update is used."

[[flag]]
applies_to = "msgmerge"
flag = "-U"
translation_modifier = "updating the translation file in place"
verdict = "allow"
rationale = "Modifies the existing PO file directly, which could discard translations if the template has changed significantly."

[[flag]]
applies_to = "msgmerge"
flag = "--force"
translation_modifier = "overwriting existing output files"
verdict = "allow"
rationale = "Bypasses the overwrite prompt, silently replacing existing output files."
