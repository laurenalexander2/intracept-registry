# tools/say.toml

[[command]]
path = "say"
translation = "Convert text to audible speech."
verdict = "allow"
rationale = "Read-only text-to-speech conversion that only produces audio output."

[[flag]]
applies_to = "say"
flag = "-o"
translation_modifier = "saving the audio to a file instead of playing it"
verdict = "allow"
rationale = "Writes an audio file to disk; trivially reversible by deleting the file."

[[flag]]
applies_to = "say"
flag = "-v"
translation_modifier = "using a specified voice"
verdict = "allow"
rationale = "Selects a voice for synthesis; no state change beyond audio output."

[[flag]]
applies_to = "say"
flag = "-f"
translation_modifier = "reading text from a file"
verdict = "allow"
rationale = "Reads input from a file instead of command-line arguments; no state change."

[[flag]]
applies_to = "say"
flag = "-r"
translation_modifier = "at a specified words-per-minute rate"
verdict = "allow"
rationale = "Controls speech rate; purely cosmetic adjustment to audio output."

[[flag]]
applies_to = "say"
flag = "-n"
translation_modifier = "sending audio over the network to a specified service"
verdict = "allow"
rationale = "Redirects audio to a network service; no destructive action."

[[flag]]
applies_to = "say"
flag = "-a"
translation_modifier = "playing through a specified audio device"
verdict = "allow"
rationale = "Routes audio to a particular device; no state change."

[[flag]]
applies_to = "say"
flag = "-i"
translation_modifier = "highlighting words interactively as they are spoken"
verdict = "allow"
rationale = "Adds visual highlighting during playback; purely cosmetic."

[[flag]]
applies_to = "say"
flag = "--file-format"
translation_modifier = "saving in a specified audio file format"
verdict = "allow"
rationale = "Controls the output file type; only relevant when used with -o."

[[flag]]
applies_to = "say"
flag = "--data-format"
translation_modifier = "encoding the audio data in a specified format"
verdict = "allow"
rationale = "Controls the audio encoding; only relevant when used with -o."

[[flag]]
applies_to = "say"
flag = "--bit-rate"
translation_modifier = "at a specified audio bit rate"
verdict = "allow"
rationale = "Controls output quality and file size; only relevant when used with -o."

[[flag]]
applies_to = "say"
flag = "--quality"
translation_modifier = "at a specified audio converter quality level"
verdict = "allow"
rationale = "Controls encoding quality; only relevant when used with -o."
