# tools/mdls.toml

[[command]]
path = "mdls"
translation = "Display the Spotlight metadata attributes for a file."
verdict = "allow"
rationale = "Read-only display of file metadata."

[[flag]]
applies_to = "mdls"
flag = "-name"
translation_modifier = "showing only a specific metadata attribute"
verdict = "allow"
rationale = "Only filters which attributes are displayed."

[[flag]]
applies_to = "mdls"
flag = "-raw"
translation_modifier = "printing raw attribute values separated by null characters"
verdict = "allow"
rationale = "Changes output formatting for piping; still read-only."

[[flag]]
applies_to = "mdls"
flag = "-nullMarker"
translation_modifier = "using a specified string in place of null attribute values"
verdict = "allow"
rationale = "Changes how null values are displayed; still read-only."
