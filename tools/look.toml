# tools/look.toml

[[command]]
path = "look"
translation = "Display lines in a sorted file that begin with a given string."
verdict = "allow"
rationale = "Read-only search that writes matching lines to the terminal."
risk_class = "novel"

[[flag]]
applies_to = "look"
flag = "-f"
translation_modifier = "ignoring case differences"
verdict = "allow"
rationale = "Only changes how characters are compared; read-only operation."
arity = "Boolean"

[[flag]]
applies_to = "look"
flag = "-d"
translation_modifier = "comparing only letters and numbers"
verdict = "allow"
rationale = "Only changes which characters are considered during comparison; read-only operation."
arity = "Boolean"

[[flag]]
applies_to = "look"
flag = "-t"
translation_modifier = "stopping the comparison at a specific character in the search string"
verdict = "allow"
rationale = "Only changes how much of the search string is used; read-only operation."
arity = "Boolean"
