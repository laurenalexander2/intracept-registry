# tools/join.toml

[[command]]
path = "join"
translation = "Join lines from two files on a common field."
verdict = "allow"
rationale = "Reads two files and writes the joined output to the terminal; does not modify input files."

[[flag]]
applies_to = "join"
flag = "-t"
translation_modifier = "using a specific character as the field delimiter"
verdict = "allow"
rationale = "Only changes how fields are separated in input and output."

[[flag]]
applies_to = "join"
flag = "-1"
translation_modifier = "joining on a specific field from the first file"
verdict = "allow"
rationale = "Only changes which field is used for matching."

[[flag]]
applies_to = "join"
flag = "-2"
translation_modifier = "joining on a specific field from the second file"
verdict = "allow"
rationale = "Only changes which field is used for matching."
