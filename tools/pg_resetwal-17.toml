# tools/pg_resetwal-17.toml — PostgreSQL 17 utility

[[command]]
path = "pg_resetwal-17"
translation = "Reset the write-ahead log and other control information of a PostgreSQL database cluster."
verdict = "require_approval"
rationale = "Forcibly resets WAL state, which can cause data loss and corruption if used on a functioning cluster."

[[flag]]
applies_to = "pg_resetwal-17"
flag = "--force"
translation_modifier = "proceeding even when the operation could cause data corruption"
verdict = "require_approval"
rationale = "Forces WAL reset even when unsafe; can cause irrecoverable data corruption."
