# tools/dropdb.toml

[[command]]
path = "dropdb"
translation = "Delete a PostgreSQL database."
verdict = "require_approval"
rationale = "Permanently destroys the database and all its data with no confirmation by default."

[[flag]]
applies_to = "dropdb"
flag = "-i"
translation_modifier = "prompting for confirmation before deleting"
verdict = "allow"
rationale = "Adds an interactive confirmation step; a safety-enhancing option."

[[flag]]
applies_to = "dropdb"
flag = "--if-exists"
translation_modifier = "without raising an error if the database does not exist"
verdict = "allow"
rationale = "Prevents errors on nonexistent databases; does not change destructive behavior."

[[flag]]
applies_to = "dropdb"
flag = "--force"
translation_modifier = "forcibly disconnecting all active users before dropping the database"
verdict = "require_approval"
rationale = "Terminates all existing connections to the target database before dropping it, disrupting active users."

[[flag]]
applies_to = "dropdb"
flag = "-e"
translation_modifier = "displaying the SQL commands being sent to the server"
verdict = "allow"
rationale = "Shows the generated SQL; read-only diagnostic output."

[[flag]]
applies_to = "dropdb"
flag = "-h"
translation_modifier = "on a specified database server host"
verdict = "allow"
rationale = "Specifies which server to connect to; does not change the operation."

[[flag]]
applies_to = "dropdb"
flag = "-p"
translation_modifier = "on a specified port"
verdict = "allow"
rationale = "Specifies which port to connect on; does not change the operation."

[[flag]]
applies_to = "dropdb"
flag = "-U"
translation_modifier = "connecting as a specified user"
verdict = "allow"
rationale = "Specifies the authentication identity; the user's permissions determine what is allowed."

[[flag]]
applies_to = "dropdb"
flag = "-w"
translation_modifier = "without prompting for a password"
verdict = "allow"
rationale = "Relies on passwordless authentication methods, which may indicate a less secure connection configuration."
