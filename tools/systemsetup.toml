# tools/systemsetup.toml

[[command]]
path = "systemsetup"
translation = "Configure machine-level settings such as date, time, sleep, and remote access."
verdict = "ask"
rationale = "Modifies system preferences that affect sleep, time, startup, and remote access; all settings are reversible."
risk_class = "novel"

[[flag]]
applies_to = "systemsetup"
flag = "-getdate"
translation_modifier = "displaying the current system date"
verdict = "allow"
rationale = "Read-only display of the current date."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-setdate"
translation_modifier = "setting the system date"
verdict = "allow"
rationale = "Incorrect dates can break certificate validation, authentication, and time-sensitive operations."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-gettime"
translation_modifier = "displaying the current system time"
verdict = "allow"
rationale = "Read-only display of the current time."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-settime"
translation_modifier = "setting the system time"
verdict = "allow"
rationale = "Incorrect time can break authentication and time-sensitive operations."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-gettimezone"
translation_modifier = "displaying the current time zone"
verdict = "allow"
rationale = "Read-only display of the current time zone."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-settimezone"
translation_modifier = "setting the system time zone"
verdict = "allow"
rationale = "Changes how times are interpreted; reversible by resetting."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-getusingnetworktime"
translation_modifier = "displaying whether network time synchronization is enabled"
verdict = "allow"
rationale = "Read-only display of network time status."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-setusingnetworktime"
translation_modifier = "enabling or disabling automatic network time synchronization"
verdict = "allow"
rationale = "Disabling may cause clock drift; enabling syncs to a time server."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-setnetworktimeserver"
translation_modifier = "setting the network time server address"
verdict = "allow"
rationale = "Changes which server provides the system clock reference."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-getcomputersleep"
translation_modifier = "displaying the idle time before the computer sleeps"
verdict = "allow"
rationale = "Read-only display of sleep timer setting."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-setcomputersleep"
translation_modifier = "setting the idle time before the computer sleeps"
verdict = "allow"
rationale = "Changes sleep behavior; a sleeping server becomes unreachable remotely."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-getdisplaysleep"
translation_modifier = "displaying the idle time before the display sleeps"
verdict = "allow"
rationale = "Read-only display of display sleep timer."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-setdisplaysleep"
translation_modifier = "setting the idle time before the display sleeps"
verdict = "allow"
rationale = "Only affects display power; the system continues running."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-getharddisksleep"
translation_modifier = "displaying the idle time before the hard disk sleeps"
verdict = "allow"
rationale = "Read-only display of disk sleep timer."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-setharddisksleep"
translation_modifier = "setting the idle time before the hard disk sleeps"
verdict = "allow"
rationale = "May cause brief delays when accessing disk after sleep; reversible."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-getremotelogin"
translation_modifier = "displaying whether SSH remote login is enabled"
verdict = "allow"
rationale = "Read-only display of remote login status."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-setremotelogin"
translation_modifier = "enabling or disabling SSH remote login"
verdict = "ask"
rationale = "Enables or disables remote SSH access to the machine; enabling exposes the system to network access."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-getremoteappleevents"
translation_modifier = "displaying whether remote Apple events are enabled"
verdict = "allow"
rationale = "Read-only display of remote events status."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-setremoteappleevents"
translation_modifier = "enabling or disabling remote Apple events"
verdict = "ask"
rationale = "Enables remote control of the machine via Apple events; enabling exposes the system to network commands."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-getcomputername"
translation_modifier = "displaying the computer name"
verdict = "allow"
rationale = "Read-only display of the computer name."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-setcomputername"
translation_modifier = "setting the computer name"
verdict = "allow"
rationale = "Changes the display name used on the network; easily reversible."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-getstartupdisk"
translation_modifier = "displaying the current startup disk"
verdict = "allow"
rationale = "Read-only display of the startup disk."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-setstartupdisk"
translation_modifier = "setting the startup disk for next boot"
verdict = "ask"
rationale = "Changes which volume the system boots from; incorrect settings may prevent boot."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-liststartupdisks"
translation_modifier = "listing all valid startup disks"
verdict = "allow"
rationale = "Read-only listing of available startup disks."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-setrestartpowerfailure"
translation_modifier = "enabling or disabling automatic restart after power failure"
verdict = "allow"
rationale = "Controls power recovery behavior; reversible."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-setrestartfreeze"
translation_modifier = "enabling or disabling automatic restart after a system freeze"
verdict = "allow"
rationale = "Controls whether the system recovers automatically from freezes."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-setwakeonnetworkaccess"
translation_modifier = "enabling or disabling wake on network access"
verdict = "allow"
rationale = "Controls whether the system wakes from sleep when a network packet arrives."
arity = "Boolean"

[[flag]]
applies_to = "systemsetup"
flag = "-setallowpowerbuttontosleepcomputer"
translation_modifier = "enabling or disabling the power button sleep function"
verdict = "allow"
rationale = "Controls whether the power button can put the computer to sleep; easily reversible."
arity = "Boolean"
