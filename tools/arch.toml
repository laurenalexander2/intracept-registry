# tools/arch.toml

[[command]]
path = "arch"
translation = "Print the system's processor architecture or run a program under a specific architecture."
verdict = "allow"
rationale = "With no arguments, displays architecture info; when running a program, it only changes which version of the program runs."
risk_class = "novel"

[[flag]]
applies_to = "arch"
flag = "-32"
translation_modifier = "using the 32-bit version of the program"
verdict = "allow"
rationale = "Selects a different architecture variant but does not modify any files or system state."
arity = "Boolean"

[[flag]]
applies_to = "arch"
flag = "-64"
translation_modifier = "using the 64-bit version of the program"
verdict = "allow"
rationale = "Selects a different architecture variant but does not modify any files or system state."
arity = "Boolean"

[[flag]]
applies_to = "arch"
flag = "-arch"
translation_modifier = "targeting a specific named architecture"
verdict = "allow"
rationale = "Selects a specific architecture variant but does not modify any files or system state."
arity = "Boolean"

[[flag]]
applies_to = "arch"
flag = "-c"
translation_modifier = "clearing all environment variables before running the program"
verdict = "allow"
rationale = "Only affects the environment passed to the child process; does not modify files or system state."
arity = "Boolean"

[[flag]]
applies_to = "arch"
flag = "-e"
translation_modifier = "setting an environment variable for the program"
verdict = "allow"
rationale = "Only affects the environment passed to the child process; does not modify files or system state."
arity = "Boolean"

[[flag]]
applies_to = "arch"
flag = "-d"
translation_modifier = "removing an environment variable before running the program"
verdict = "allow"
rationale = "Only affects the environment passed to the child process; does not modify files or system state."
arity = "Boolean"
