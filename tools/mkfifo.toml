# tools/mkfifo.toml — Named pipe creator

[[command]]
path = "mkfifo"
translation = "Create a named pipe (named pipe special file) in the filesystem."
verdict = "allow"
rationale = "Creates a special file entry; trivially removable with rm."
risk_class = "novel"

[[flag]]
applies_to = "mkfifo"
flag = "-m"
translation_modifier = "with specific file permission bits"
verdict = "allow"
rationale = "Sets permissions on the new named pipe; no additional risk beyond the base command."
arity = "Boolean"
