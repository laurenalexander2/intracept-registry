# tools/cpio.toml

[[command]]
path = "cpio"
translation = "Copy files to and from archives."
verdict = "allow"
rationale = "Creates or extracts archive files, potentially overwriting existing files during extraction."

[[flag]]
applies_to = "cpio"
flag = "-i"
translation_modifier = "extracting files from an archive"
verdict = "allow"
rationale = "Extracts archive contents to disk, which may overwrite existing files."

[[flag]]
applies_to = "cpio"
flag = "-o"
translation_modifier = "creating a new archive from a list of files"
verdict = "allow"
rationale = "Writes a new archive to standard output; does not modify existing files."

[[flag]]
applies_to = "cpio"
flag = "-p"
translation_modifier = "copying files directly to a destination directory"
verdict = "allow"
rationale = "Copies files to a target directory, potentially overwriting files at the destination."

[[flag]]
applies_to = "cpio"
flag = "-d"
translation_modifier = "creating directories as needed during extraction"
verdict = "allow"
rationale = "Ensures required directories exist; does not add destructive capability."

[[flag]]
applies_to = "cpio"
flag = "-t"
translation_modifier = "listing archive contents without extracting"
verdict = "allow"
rationale = "Read-only operation that only displays filenames from the archive."

[[flag]]
applies_to = "cpio"
flag = "-u"
translation_modifier = "overwriting newer files on disk with older archived versions"
verdict = "require_approval"
rationale = "Unconditionally replaces existing files regardless of modification time, which can cause data loss."

[[flag]]
applies_to = "cpio"
flag = "-m"
translation_modifier = "preserving original file modification times"
verdict = "allow"
rationale = "Only affects file timestamps; does not change what is extracted."

[[flag]]
applies_to = "cpio"
flag = "-v"
translation_modifier = ""
verdict = "allow"
rationale = "Only adds verbose output listing each file processed."

[[flag]]
applies_to = "cpio"
flag = "-F"
translation_modifier = "reading from or writing to a specified archive file instead of standard input or output"
verdict = "allow"
rationale = "Changes the archive source or destination; does not add destructive capability."

[[flag]]
applies_to = "cpio"
flag = "--insecure"
translation_modifier = "allowing extraction through symbolic links and absolute paths"
verdict = "require_approval"
rationale = "Disables path safety checks, allowing files to be written anywhere on the filesystem via symbolic link or absolute path traversal."

[[flag]]
applies_to = "cpio"
flag = "-L"
translation_modifier = "following symbolic links and archiving the files they point to"
verdict = "allow"
rationale = "Changes which data is archived but does not add destructive capability."

[[flag]]
applies_to = "cpio"
flag = "-l"
translation_modifier = "creating hard links instead of copying files"
verdict = "allow"
rationale = "Uses links instead of copies in pass-through mode; no data is destroyed."
