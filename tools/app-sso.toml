# tools/app-sso.toml

[[command]]
path = "app-sso"
translation = "Manage extensible single sign-on configurations."
verdict = "allow"
rationale = "Modifies SSO configuration for applications."
risk_class = "novel"

[[flag]]
applies_to = "app-sso"
flag = "--force"
translation_modifier = "forcing the SSO operation without prompting"
verdict = "allow"
rationale = "Bypasses confirmation for single sign-on configuration changes."
arity = "Boolean"
[[flag]]
applies_to = "app-sso"
flag = "--reset"
translation_modifier = "resetting single sign-on configuration"
verdict = "ask"
rationale = "Removes SSO configuration; users must re-authenticate with all services."
arity = "Boolean"
