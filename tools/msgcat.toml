# tools/msgcat.toml — GNU gettext message catalog concatenator

[[command]]
path = "msgcat"
translation = "Concatenate and merge multiple translation catalog files."
verdict = "allow"
rationale = "Combines PO files and writes merged output; source files are not modified."

[[flag]]
applies_to = "msgcat"
flag = "--force"
translation_modifier = "overwriting existing output files"
verdict = "allow"
rationale = "Bypasses the overwrite prompt, silently replacing existing output files."
