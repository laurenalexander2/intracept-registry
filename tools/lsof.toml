# tools/lsof.toml

# ── Base command ──────────────────────────────────────────────────────────────

[[command]]
path = "lsof"
translation = "List open files and the processes that opened them."
verdict = "allow"
rationale = "Read-only listing of open files, network connections, and associated processes."

# ── Flags ─────────────────────────────────────────────────────────────────────

[[flag]]
applies_to = "lsof"
flag = "-i"
translation_modifier = "showing only network connections"
verdict = "allow"
rationale = "Filters to network-related entries; still read-only."

[[flag]]
applies_to = "lsof"
flag = "-p"
translation_modifier = "showing only files opened by a specific process"
verdict = "allow"
rationale = "Filters by process ID; still read-only."

[[flag]]
applies_to = "lsof"
flag = "-t"
translation_modifier = "showing only process IDs without other details"
verdict = "allow"
rationale = "Simplifies output to process IDs only; commonly piped to kill but is itself read-only."

[[flag]]
applies_to = "lsof"
flag = "-u"
translation_modifier = "showing only files opened by a specific user"
verdict = "allow"
rationale = "Filters by user; still read-only."

[[flag]]
applies_to = "lsof"
flag = "-c"
translation_modifier = "showing only files opened by processes whose name starts with a given string"
verdict = "allow"
rationale = "Filters by command name prefix; still read-only."

[[flag]]
applies_to = "lsof"
flag = "-n"
translation_modifier = "showing network addresses as numbers instead of resolving hostnames"
verdict = "allow"
rationale = "Skips DNS lookups for faster output; still read-only."

[[flag]]
applies_to = "lsof"
flag = "-P"
translation_modifier = "showing port numbers instead of resolving service names"
verdict = "allow"
rationale = "Skips port name resolution; still read-only."

[[flag]]
applies_to = "lsof"
flag = "-a"
translation_modifier = "requiring all filter conditions to match instead of any"
verdict = "allow"
rationale = "Changes filter logic from OR to AND; still read-only."

[[flag]]
applies_to = "lsof"
flag = "-U"
translation_modifier = "showing only Unix domain socket files"
verdict = "allow"
rationale = "Filters to Unix domain sockets used for local inter-process communication; still read-only."

[[flag]]
applies_to = "lsof"
flag = "+D"
translation_modifier = "searching an entire directory tree for open files"
verdict = "allow"
rationale = "Expands the search scope to a full directory tree; still read-only."

[[flag]]
applies_to = "lsof"
flag = "+d"
translation_modifier = "searching a single directory for open files without descending into subdirectories"
verdict = "allow"
rationale = "Searches one directory level; still read-only."

[[flag]]
applies_to = "lsof"
flag = "-R"
translation_modifier = "including the parent process ID in the output"
verdict = "allow"
rationale = "Adds parent process information; still read-only."

[[flag]]
applies_to = "lsof"
flag = "-N"
translation_modifier = "showing only files accessed over the network file system"
verdict = "allow"
rationale = "Filters to NFS files; still read-only."

[[flag]]
applies_to = "lsof"
flag = "-s"
translation_modifier = "filtering by connection state such as LISTEN or ESTABLISHED"
verdict = "allow"
rationale = "Narrows results to connections in a specific state; still read-only."

[[flag]]
applies_to = "lsof"
flag = "+r"
translation_modifier = "repeating the listing at a regular interval until no open files are found"
verdict = "allow"
rationale = "Polls for open files in a loop; still read-only."

[[flag]]
applies_to = "lsof"
flag = "-r"
translation_modifier = "repeating the listing at a regular interval indefinitely"
verdict = "allow"
rationale = "Continuously polls for open files; still read-only."

[[flag]]
applies_to = "lsof"
flag = "-g"
translation_modifier = "showing only files opened by processes in a specific process group"
verdict = "allow"
rationale = "Filters by process group ID; still read-only."
