# tools/cksum.toml

[[command]]
path = "cksum"
translation = "Compute checksums and byte counts of files."
verdict = "allow"
rationale = "Read-only checksum computation."

[[flag]]
applies_to = "cksum"
flag = "-o"
translation_modifier = "using a specified historic checksum algorithm instead of the default"
verdict = "allow"
rationale = "Only changes which checksum algorithm is used; no state modification."
