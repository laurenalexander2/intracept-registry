# tools/dropuser.toml

[[command]]
path = "dropuser"
translation = "Delete a PostgreSQL user role."
verdict = "require_approval"
rationale = "Permanently removes the role; objects owned by it may become inaccessible."

[[flag]]
applies_to = "dropuser"
flag = "-i"
translation_modifier = "prompting for confirmation before deleting"
verdict = "allow"
rationale = "Adds an interactive confirmation step; a safety-enhancing option."

[[flag]]
applies_to = "dropuser"
flag = "--if-exists"
translation_modifier = "without raising an error if the role does not exist"
verdict = "allow"
rationale = "Prevents errors on nonexistent roles; does not change destructive behavior."
