# tools/zcat.toml

[[command]]
path = "zcat"
translation = "Decompress gzip files and write the output to the terminal."
verdict = "allow"
rationale = "Read-only decompression to the terminal; does not modify files."

[[flag]]
applies_to = "zcat"
flag = "--force"
translation_modifier = "overwriting existing output files without prompting"
verdict = "allow"
rationale = "Overwrites existing output files without confirmation; recoverable from backups."
[[flag]]
applies_to = "zcat"
flag = "--recursive"
translation_modifier = "recursively through all files in subdirectories"
verdict = "allow"
rationale = "Processes entire directory trees, increasing the scope of files affected."
