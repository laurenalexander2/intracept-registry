# tools/uniq.toml

[[command]]
path = "uniq"
translation = "Filter out repeated adjacent lines from a file or input."
verdict = "allow"
rationale = "Outputs filtered text without modifying the input file."

[[flag]]
applies_to = "uniq"
flag = "-c"
translation_modifier = "prefixing each line with its count of occurrences"
verdict = "allow"
rationale = "Adds count information to output; still read-only."

[[flag]]
applies_to = "uniq"
flag = "-d"
translation_modifier = "showing only lines that appear more than once"
verdict = "allow"
rationale = "Filters output to repeated lines; still read-only."

[[flag]]
applies_to = "uniq"
flag = "-u"
translation_modifier = "showing only lines that are not repeated"
verdict = "allow"
rationale = "Filters output to unique lines; still read-only."

[[flag]]
applies_to = "uniq"
flag = "-i"
translation_modifier = "ignoring differences between uppercase and lowercase letters"
verdict = "allow"
rationale = "Changes comparison logic; still read-only."

[[flag]]
applies_to = "uniq"
flag = "-f"
translation_modifier = "skipping the first specified number of fields when comparing lines"
verdict = "allow"
rationale = "Adjusts which parts of each line are compared; still read-only."

[[flag]]
applies_to = "uniq"
flag = "-s"
translation_modifier = "skipping the first specified number of characters when comparing lines"
verdict = "allow"
rationale = "Adjusts which parts of each line are compared; still read-only."

[[flag]]
applies_to = "uniq"
flag = "-D"
translation_modifier = "printing every copy of each repeated line instead of just one"
verdict = "allow"
rationale = "Increases output verbosity; still read-only."
