# tools/showmount.toml

[[command]]
path = "showmount"
translation = "Display NFS mount information for a remote host."
verdict = "allow"
rationale = "Read-only query of NFS mount status; modifies nothing."
risk_class = "novel"

[[flag]]
applies_to = "showmount"
flag = "-a"
translation_modifier = "listing all mount points with their host and directory"
verdict = "allow"
rationale = "Expands output format; no state modification."
arity = "Boolean"

[[flag]]
applies_to = "showmount"
flag = "-d"
translation_modifier = "listing only directory paths of mount points"
verdict = "allow"
rationale = "Filters output to directories; no state modification."
arity = "Boolean"

[[flag]]
applies_to = "showmount"
flag = "-e"
translation_modifier = "showing the host's exports list"
verdict = "allow"
rationale = "Displays exported directories; no state modification."
arity = "Boolean"
