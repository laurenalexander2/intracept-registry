# tools/errinfo.toml

[[command]]
path = "errinfo"
translation = "Display system call errors for running processes using DTrace."
verdict = "allow"
rationale = "Read-only diagnostic tool that monitors system call failures without modifying anything."

[[flag]]
applies_to = "errinfo"
flag = "-c"
translation_modifier = "showing an aggregate frequency count of errors"
verdict = "allow"
rationale = "Only changes the output format to a summary report."

[[flag]]
applies_to = "errinfo"
flag = "-p"
translation_modifier = "monitoring only a specific process ID"
verdict = "allow"
rationale = "Narrows the scope to a single process; still read-only."

[[flag]]
applies_to = "errinfo"
flag = "-n"
translation_modifier = "monitoring only processes with a specific name"
verdict = "allow"
rationale = "Narrows the scope to named processes; still read-only."
