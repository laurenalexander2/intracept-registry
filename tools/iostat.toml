# tools/iostat.toml

[[command]]
path = "iostat"
translation = "Display disk and CPU I/O statistics."
verdict = "allow"
rationale = "Read-only display of kernel I/O statistics."
risk_class = "novel"

[[flag]]
applies_to = "iostat"
flag = "-d"
translation_modifier = "showing only device statistics"
verdict = "allow"
rationale = "Only filters the output to device information."
arity = "Boolean"

[[flag]]
applies_to = "iostat"
flag = "-c"
translation_modifier = "repeating the display a specific number of times"
verdict = "allow"
rationale = "Only controls how many times statistics are sampled."
arity = "Boolean"

[[flag]]
applies_to = "iostat"
flag = "-w"
translation_modifier = "pausing a specified number of seconds between updates"
verdict = "allow"
rationale = "Only controls the sampling interval."
arity = "Boolean"
