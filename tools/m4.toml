# tools/m4.toml

[[command]]
path = "m4"
translation = "Process text through a macro expansion engine."
verdict = "allow"
rationale = "Reads input, expands macros, and writes to the terminal; does not modify files in place."

[[flag]]
applies_to = "m4"
flag = "-D"
translation_modifier = "defining a macro with a specific value"
verdict = "allow"
rationale = "Only sets a macro definition for processing."

[[flag]]
applies_to = "m4"
flag = "-I"
translation_modifier = "adding a directory to the include search path"
verdict = "allow"
rationale = "Only changes where include files are searched."

[[flag]]
applies_to = "m4"
flag = "-U"
translation_modifier = "removing a macro definition before processing"
verdict = "allow"
rationale = "Only unsets a macro; does not modify any files."

[[flag]]
applies_to = "m4"
flag = "-E"
translation_modifier = "stopping execution after the first warning"
verdict = "allow"
rationale = "Makes warnings fatal; a stricter processing mode that modifies nothing."

[[flag]]
applies_to = "m4"
flag = "-P"
translation_modifier = "requiring a prefix on all built-in macro names"
verdict = "allow"
rationale = "Reduces naming conflicts by requiring explicit prefixes; does not modify files."

[[flag]]
applies_to = "m4"
flag = "-s"
translation_modifier = "inserting line-tracking directives in the output"
verdict = "allow"
rationale = "Adds metadata to output for tracking source locations; does not modify input files."

[[flag]]
applies_to = "m4"
flag = "-G"
translation_modifier = "disabling all non-standard extensions"
verdict = "allow"
rationale = "Restricts to traditional behavior; limits functionality but modifies nothing."

[[flag]]
applies_to = "m4"
flag = "-d"
translation_modifier = "enabling debug output for macro expansion"
verdict = "allow"
rationale = "Adds diagnostic tracing; read-only debugging output."

[[flag]]
applies_to = "m4"
flag = "-t"
translation_modifier = "tracing a specific macro whenever it is used"
verdict = "allow"
rationale = "Enables debug tracing for a single macro; read-only diagnostic."

[[flag]]
applies_to = "m4"
flag = "-e"
translation_modifier = "writing output immediately without buffering"
verdict = "allow"
rationale = "Changes output timing but not content; does not modify files."
