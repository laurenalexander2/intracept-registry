# tools/ps.toml

# ── Base command ──────────────────────────────────────────────────────────────

[[command]]
path = "ps"
translation = "List currently running processes."
verdict = "allow"
rationale = "Read-only snapshot of running processes that does not modify anything."
# ── Process selection ────────────────────────────────────────────────────────
risk_class = "safe"


[[flag]]
applies_to = "ps"
flag = "-e"
translation_modifier = "showing all processes, including those belonging to other users"
verdict = "allow"
rationale = "Expands the listing to every process on the system; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "ps"
flag = "-A"
translation_modifier = "showing all processes, including those belonging to other users"
verdict = "allow"
rationale = "Equivalent to -e; expands the listing to every process on the system."
arity = "Boolean"

[[flag]]
applies_to = "ps"
flag = "-a"
translation_modifier = "including other users' processes that have a terminal"
verdict = "allow"
rationale = "Shows processes from all users that are attached to a terminal; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "ps"
flag = "-x"
translation_modifier = "including processes that are not attached to a terminal"
verdict = "allow"
rationale = "Shows background and system processes that have no controlling terminal; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "ps"
flag = "aux"
translation_modifier = "showing all processes for all users with detailed information"
verdict = "allow"
rationale = "Combines all-users, no-terminal, and user-oriented format into a comprehensive listing; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "ps"
flag = "-u"
translation_modifier = "for a specified user"
verdict = "allow"
rationale = "Filters the listing to a specific user's processes; still read-only."
arity = "Single"
value_type = "String"

[[flag]]
applies_to = "ps"
flag = "-p"
translation_modifier = "for a specified process ID"
verdict = "allow"
rationale = "Filters the listing to a single process; still read-only."
arity = "Single"
value_type = "Int"

[[flag]]
applies_to = "ps"
flag = "-G"
translation_modifier = "for processes running with a specified group ID"
verdict = "allow"
rationale = "Filters the listing to a specific group; still read-only."
arity = "Single"
value_type = "Int"

[[flag]]
applies_to = "ps"
flag = "-t"
translation_modifier = "for processes attached to a specified terminal"
verdict = "allow"
rationale = "Filters the listing by terminal device; still read-only."
# ── Output format ────────────────────────────────────────────────────────────
arity = "Single"
value_type = "String"


[[flag]]
applies_to = "ps"
flag = "-f"
translation_modifier = ""
verdict = "allow"
rationale = "Shows a full-format listing with additional columns like parent process and start time; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "ps"
flag = "-o"
translation_modifier = "showing only specified columns"
verdict = "allow"
rationale = "Customizes which columns appear in the output; still read-only."
arity = "Single"
value_type = "String"

[[flag]]
applies_to = "ps"
flag = "-w"
translation_modifier = "using wider output to avoid cutting off long command names"
verdict = "allow"
rationale = "Increases output width so command names are not truncated; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "ps"
flag = "-E"
translation_modifier = "including each process's environment variables"
verdict = "allow"
rationale = "Displays environment variables alongside process info; still read-only but may reveal sensitive values."
arity = "Boolean"

[[flag]]
applies_to = "ps"
flag = "-c"
translation_modifier = "showing only the executable name instead of the full command line"
verdict = "allow"
rationale = "Shortens the command column to just the program name; still read-only."
# ── Sorting ──────────────────────────────────────────────────────────────────
arity = "Boolean"


[[flag]]
applies_to = "ps"
flag = "-r"
translation_modifier = "sorted by current processor usage"
verdict = "allow"
rationale = "Changes the sort order to show the busiest processes first; still read-only."
arity = "Boolean"

[[flag]]
applies_to = "ps"
flag = "-m"
translation_modifier = "sorted by memory usage"
verdict = "allow"
rationale = "Changes the sort order to show the most memory-intensive processes first; still read-only."
# ── Thread display ───────────────────────────────────────────────────────────
arity = "Boolean"


[[flag]]
applies_to = "ps"
flag = "-M"
translation_modifier = "showing individual threads for each process"
verdict = "allow"
rationale = "Displays thread-level detail for multi-threaded processes; still read-only."
arity = "Boolean"
