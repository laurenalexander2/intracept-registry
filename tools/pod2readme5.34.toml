# tools/pod2readme5.34.toml

[[command]]
path = "pod2readme5.34"
translation = "Convert Perl Pod documentation to a plain text readme file using Perl 5.34."
verdict = "allow"
rationale = "Read-only conversion that writes to the terminal."

[[flag]]
applies_to = "pod2readme5.34"
flag = "--force"
translation_modifier = "overwriting the existing output file"
verdict = "allow"
rationale = "Bypasses the overwrite prompt, silently replacing the existing output file."
