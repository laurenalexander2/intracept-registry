# tools/ldapadd.toml

[[command]]
path = "ldapadd"
translation = "Add new entries to an LDAP directory."
verdict = "allow"
rationale = "Creates new entries in a directory server, which could affect authentication or access control if misapplied."

[[flag]]
applies_to = "ldapadd"
flag = "-c"
translation_modifier = "continuing past errors instead of stopping"
verdict = "allow"
rationale = "Skips failed entries and keeps going, which may cause partial updates that are hard to track."

[[flag]]
applies_to = "ldapadd"
flag = "-n"
translation_modifier = "simulating the operation without actually adding entries"
verdict = "allow"
rationale = "No data is written; only shows what would happen."

[[flag]]
applies_to = "ldapadd"
flag = "-v"
translation_modifier = ""
verdict = "allow"
rationale = "Only increases diagnostic output to the terminal."

[[flag]]
applies_to = "ldapadd"
flag = "-f"
translation_modifier = "reading entries from a file instead of standard input"
verdict = "allow"
rationale = "Only changes where input is read from."

[[flag]]
applies_to = "ldapadd"
flag = "-x"
translation_modifier = "using simple authentication instead of advanced authentication"
verdict = "allow"
rationale = "Only changes the authentication method used."

[[flag]]
applies_to = "ldapadd"
flag = "-H"
translation_modifier = "connecting to a specific LDAP server address"
verdict = "allow"
rationale = "Only changes which server is contacted."

[[flag]]
applies_to = "ldapadd"
flag = "-D"
translation_modifier = "authenticating with a specific identity"
verdict = "allow"
rationale = "Only specifies which account to bind as."

[[flag]]
applies_to = "ldapadd"
flag = "-W"
translation_modifier = "prompting for a password"
verdict = "allow"
rationale = "Safer than passing a password on the command line."

[[flag]]
applies_to = "ldapadd"
flag = "-w"
translation_modifier = "using a password provided on the command line"
verdict = "allow"
rationale = "Specifies authentication credentials; the password may be visible in process listings."

[[flag]]
applies_to = "ldapadd"
flag = "-Z"
translation_modifier = "requesting an encrypted connection"
verdict = "allow"
rationale = "Enables transport encryption, which improves security."

[[flag]]
applies_to = "ldapadd"
flag = "-ZZ"
translation_modifier = "requiring an encrypted connection and failing if encryption is unavailable"
verdict = "allow"
rationale = "Enforces transport encryption; fails safely if the server does not support it."

[[flag]]
applies_to = "ldapadd"
flag = "-S"
translation_modifier = "writing skipped entries to a file for later review"
verdict = "allow"
rationale = "Only controls where error information is logged."
