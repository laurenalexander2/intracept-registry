# tools/mkbundle.toml — Mono assembly bundler

[[command]]
path = "mkbundle"
translation = "Bundle Mono assemblies and dependencies into a standalone executable."
verdict = "allow"
rationale = "Generates a compiled output file locally; does not modify existing files or system state."

[[flag]]
applies_to = "mkbundle"
flag = "--deps"
translation_modifier = "automatically embedding all dependency assemblies"
verdict = "allow"
rationale = "Includes dependencies in the bundle; only affects the output file."

[[flag]]
applies_to = "mkbundle"
flag = "--static"
translation_modifier = "statically linking Mono libraries into the output"
verdict = "allow"
rationale = "Changes linking mode; only affects the output binary."

[[flag]]
applies_to = "mkbundle"
flag = "--cross"
translation_modifier = "targeting a different platform for cross-compilation"
verdict = "allow"
rationale = "Generates a binary for a different target; only affects the output file."

[[flag]]
applies_to = "mkbundle"
flag = "-z"
translation_modifier = "compressing the assemblies before embedding"
verdict = "allow"
rationale = "Applies compression to embedded data; only affects the output file."
