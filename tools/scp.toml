# tools/scp.toml

[[command]]
path = "scp"
translation = "Copy files between the local machine and a remote server over SSH."
verdict = "ask"
rationale = "Transfers files over the network, potentially overwriting files at the destination."
risk_class = "net_egress"

[[flag]]
applies_to = "scp"
flag = "-r"
translation_modifier = "recursively copying entire directories"
verdict = "allow"
rationale = "Copies directory trees, increasing the scope of files transferred and potentially overwritten."
arity = "Boolean"

[[flag]]
applies_to = "scp"
flag = "-i"
translation_modifier = "using a specified private key file for authentication"
verdict = "allow"
rationale = "Selects an identity file; does not change the transfer's capabilities."
arity = "Boolean"

[[flag]]
applies_to = "scp"
flag = "-P"
translation_modifier = "connecting to a specified port"
verdict = "allow"
rationale = "Changes the target port; does not add destructive capability."
arity = "Boolean"

[[flag]]
applies_to = "scp"
flag = "-p"
translation_modifier = "preserving file timestamps and permissions"
verdict = "allow"
rationale = "Maintains original file metadata; does not change the transfer scope."
arity = "Boolean"

[[flag]]
applies_to = "scp"
flag = "-C"
translation_modifier = "compressing data during transfer"
verdict = "allow"
rationale = "Reduces bandwidth usage; does not change what is transferred."
arity = "Boolean"

[[flag]]
applies_to = "scp"
flag = "-l"
translation_modifier = "limiting the transfer bandwidth to a specified rate"
verdict = "allow"
rationale = "Throttles the transfer speed; a scope-reducing option."
arity = "Boolean"

[[flag]]
applies_to = "scp"
flag = "-3"
translation_modifier = "routing the transfer through the local machine when copying between two remote hosts"
verdict = "allow"
rationale = "Changes the transfer path; does not add destructive capability."
arity = "Boolean"

[[flag]]
applies_to = "scp"
flag = "-v"
translation_modifier = ""
verdict = "allow"
rationale = "Increases output verbosity for debugging; does not change transfer behavior."
arity = "Boolean"

[[flag]]
applies_to = "scp"
flag = "-q"
translation_modifier = ""
verdict = "allow"
rationale = "Suppresses progress output; does not change transfer behavior."
arity = "Boolean"

[[flag]]
applies_to = "scp"
flag = "-B"
translation_modifier = "running in batch mode without asking for passwords"
verdict = "allow"
rationale = "Disables interactive password prompts; fails if authentication requires a password."
arity = "Boolean"

[[flag]]
applies_to = "scp"
flag = "-O"
translation_modifier = "using the older SCP file transfer method instead of SFTP"
verdict = "allow"
rationale = "Switches the transfer protocol; does not change capabilities."
arity = "Boolean"

[[flag]]
applies_to = "scp"
flag = "-4"
translation_modifier = "using only IPv4 addresses"
verdict = "allow"
rationale = "Restricts the network protocol; does not change transfer capabilities."
arity = "Boolean"

[[flag]]
applies_to = "scp"
flag = "-6"
translation_modifier = "using only IPv6 addresses"
verdict = "allow"
rationale = "Restricts the network protocol; does not change transfer capabilities."
arity = "Boolean"

# ── Combos ───────────────────────────────────────────────────────────────────

[[combo]]
path = "scp -i"
translation = "Copy files between the local machine and a remote server over SSH, authenticating with a specified private key file."
verdict = "ask"
rationale = "Transfers files using key-based authentication, which may access privileged remote accounts."
risk_class = "net_egress"

[[combo]]
path = "scp -r"
translation = "Recursively copy entire directory trees between the local machine and a remote server over SSH."
verdict = "ask"
rationale = "Transfers full directory structures, increasing the volume of files that may be overwritten at the destination."
risk_class = "net_egress"
