# tools/erb.toml

[[command]]
path = "erb"
translation = "Process Embedded Ruby template files and print the result."
verdict = "allow"
rationale = "Reads templates and writes output to the terminal; does not modify files in place."

[[flag]]
applies_to = "erb"
flag = "-x"
translation_modifier = "printing the generated Ruby script instead of executing it"
verdict = "allow"
rationale = "Only outputs the script source; does not execute the template."

[[flag]]
applies_to = "erb"
flag = "-r"
translation_modifier = "loading an additional Ruby library before processing"
verdict = "allow"
rationale = "Loads and executes arbitrary Ruby code from a library."

[[flag]]
applies_to = "erb"
flag = "-T"
translation_modifier = "using a specific whitespace trim mode"
verdict = "allow"
rationale = "Only changes how whitespace is handled in template output."
