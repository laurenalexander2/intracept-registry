# tools/taskinfo.toml

[[command]]
path = "taskinfo"
translation = "Display information about running tasks and their resource usage."
verdict = "allow"
rationale = "Read-only display of task information; modifies nothing."

[[flag]]
applies_to = "taskinfo"
flag = "--all"
translation_modifier = "displaying information about all tasks"
verdict = "allow"
rationale = "Read-only display of all running task information."
