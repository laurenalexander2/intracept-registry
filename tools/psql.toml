# tools/psql.toml

[[command]]
path = "psql"
translation = "Connect to a PostgreSQL database."
verdict = "allow"
rationale = "Connects to a live database where any SQL statement can be executed, including destructive operations."
risk_class = "novel"

[[flag]]
applies_to = "psql"
flag = "-c"
translation_modifier = "executing a single SQL command and then exiting"
verdict = "ask"
rationale = "Runs arbitrary SQL directly, including destructive statements like DROP or DELETE, without an interactive session."
arity = "Boolean"

[[flag]]
applies_to = "psql"
flag = "-f"
translation_modifier = "executing SQL commands from a file and then exiting"
verdict = "ask"
rationale = "Runs an entire SQL script, which may contain destructive operations and is harder to review at execution time."
arity = "Boolean"

[[flag]]
applies_to = "psql"
flag = "-h"
translation_modifier = "connecting to a specified database server host"
verdict = "allow"
rationale = "Specifies which server to connect to; does not change what operations can be performed."
arity = "Boolean"

[[flag]]
applies_to = "psql"
flag = "-U"
translation_modifier = "connecting as a specified database user"
verdict = "allow"
rationale = "Specifies the authentication identity; the user's permissions determine what operations are allowed."
arity = "Boolean"

[[flag]]
applies_to = "psql"
flag = "-d"
translation_modifier = "connecting to a specified database"
verdict = "allow"
rationale = "Selects which database to operate on; does not change what operations can be performed."
arity = "Boolean"

[[flag]]
applies_to = "psql"
flag = "-1"
translation_modifier = "wrapping all commands in a single transaction that rolls back on error"
verdict = "allow"
rationale = "Adds transactional safety by ensuring all commands succeed or none take effect."
arity = "Boolean"

[[flag]]
applies_to = "psql"
flag = "-w"
translation_modifier = "connecting without prompting for a password"
verdict = "allow"
rationale = "Relies on passwordless authentication methods, which may indicate a less secure connection configuration."
arity = "Boolean"

[[flag]]
applies_to = "psql"
flag = "-W"
translation_modifier = "forcing a password prompt before connecting"
verdict = "allow"
rationale = "Ensures the user must provide a password, adding an explicit authentication step."
arity = "Boolean"

[[flag]]
applies_to = "psql"
flag = "--csv"
translation_modifier = "formatting query output as comma-separated values"
verdict = "allow"
rationale = "Changes output format only; does not affect what queries are executed."
# ── Combos ─────────────────────────���───────────────────────────────��─────────
arity = "Boolean"


[[combo]]
path = "psql -c"
translation = "Execute a single SQL command against a PostgreSQL database and exit immediately."
verdict = "ask"
rationale = "Runs arbitrary SQL non-interactively, which may include destructive statements like DROP TABLE or DELETE without review."
risk_class = "novel"

[[combo]]
path = "psql -f"
translation = "Execute all SQL commands from a file against a PostgreSQL database and exit."
verdict = "ask"
rationale = "Runs an entire script that may contain multiple destructive operations, with limited opportunity to review each statement."
risk_class = "novel"
