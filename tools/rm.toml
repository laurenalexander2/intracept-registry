# tools/rm.toml

[[command]]
path = "rm"
translation = "Delete files."
verdict = "allow"
rationale = "Removes a single named file; prompts for confirmation if the file is not writable."
tags.scope = "local"
tags.effect = ["delete"]
tags.reversibility = "difficult"
tags.target = ["filesystem"]
tags.safety_override = false

[[flag]]
applies_to = "rm"
flag = "-r"
translation_modifier = "recursively through all subdirectories"
verdict = "require_approval"
rationale = "Deletes entire directory trees, which can cause significant data loss if misapplied."
tag_modifiers.reversibility = "impossible"

[[flag]]
applies_to = "rm"
flag = "-R"
translation_modifier = "recursively through all subdirectories"
verdict = "require_approval"
rationale = "Equivalent to -r; deletes entire directory trees, which can cause significant data loss if misapplied."
tag_modifiers.reversibility = "impossible"

[[flag]]
applies_to = "rm"
flag = "-f"
translation_modifier = "without asking for confirmation"
verdict = "allow"
rationale = "Suppresses confirmation prompts and ignores nonexistent files; on a single file the blast radius is narrow, but it removes a safety check."
tag_modifiers.safety_override = true

[[flag]]
applies_to = "rm"
flag = "-rf"
translation_modifier = "recursively through all subdirectories without asking for confirmation"
verdict = "require_approval"
rationale = "Combines recursive traversal with suppressed prompts, enabling irreversible destruction of entire directory trees."
tag_modifiers.reversibility = "impossible"
tag_modifiers.safety_override = true

[[flag]]
applies_to = "rm"
flag = "-i"
translation_modifier = "prompting for confirmation before each file"
verdict = "allow"
rationale = "Adds an interactive confirmation step before every deletion, reducing the chance of accidental removal."

[[flag]]
applies_to = "rm"
flag = "-I"
translation_modifier = "prompting for confirmation once when deleting more than three files or removing directories recursively"
verdict = "allow"
rationale = "Provides a single batch confirmation prompt for bulk operations, offering meaningful protection with less interruption than -i."

[[flag]]
applies_to = "rm"
flag = "-d"
translation_modifier = "including empty directories"
verdict = "allow"
rationale = "Allows removal of directories in addition to regular files, expanding the scope of deletion."

[[flag]]
applies_to = "rm"
flag = "-v"
translation_modifier = ""
verdict = "allow"
rationale = "Displays each file as it is removed; does not change what is deleted."

[[flag]]
applies_to = "rm"
flag = "-W"
translation_modifier = "attempting to undelete the named files"
verdict = "allow"
rationale = "Recovers previously deleted files in a union file system; restores data rather than destroying it."
tag_modifiers.effect = ["write"]

[[flag]]
applies_to = "rm"
flag = "-x"
translation_modifier = "without crossing filesystem mount points"
verdict = "allow"
rationale = "Restricts recursive deletion to the same filesystem, preventing accidental removal of files on mounted volumes."

# ── Combos ───────────────────────────────────────────────────────────────────

[[combo]]
path = "rm -rf"
translation = "Recursively delete an entire directory tree and all its contents without prompting for confirmation, even for read-only files."
verdict = "require_approval"
rationale = "Silently and irreversibly destroys entire directory hierarchies with no confirmation or recovery mechanism."
tags.scope = "local"
tags.effect = ["delete"]
tags.reversibility = "impossible"
tags.target = ["filesystem"]
tags.safety_override = true

[[combo]]
path = "rm -r"
translation = "Recursively delete a directory and everything inside it, prompting for confirmation on read-only files."
verdict = "require_approval"
rationale = "Destroys entire directory trees, which is effectively irreversible without backups."
tags.scope = "local"
tags.effect = ["delete"]
tags.reversibility = "impossible"
tags.target = ["filesystem"]
tags.safety_override = false

[[combo]]
path = "rm -f"
translation = "Delete files without prompting for confirmation, silently ignoring files that do not exist."
verdict = "allow"
rationale = "Suppresses all confirmation prompts and errors for missing files, but the blast radius is limited to explicitly named files."
tags.scope = "local"
tags.effect = ["delete"]
tags.reversibility = "difficult"
tags.target = ["filesystem"]
tags.safety_override = true

[[combo]]
path = "rm -i"
translation = "Delete files, prompting for explicit confirmation before each individual file is removed."
verdict = "allow"
rationale = "Interactive confirmation before every deletion provides strong protection against accidental removal."
tags.scope = "local"
tags.effect = ["delete"]
tags.reversibility = "difficult"
tags.target = ["filesystem"]
tags.safety_override = false

[[combo]]
path = "rm -I -r"
translation = "Recursively delete a directory tree, prompting once for confirmation before proceeding with the bulk deletion."
verdict = "require_approval"
rationale = "Provides a single confirmation prompt before irreversibly destroying an entire directory hierarchy."
tags.scope = "local"
tags.effect = ["delete"]
tags.reversibility = "impossible"
tags.target = ["filesystem"]
tags.safety_override = false
