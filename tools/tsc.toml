# tools/tsc.toml

[[command]]
path = "tsc"
translation = "Compile TypeScript source code into JavaScript."
verdict = "allow"
rationale = "Compiles TypeScript files and writes JavaScript output to disk; a standard build step."
risk_class = "novel"

[[flag]]
applies_to = "tsc"
flag = "--noEmit"
translation_modifier = "checking types without writing any output files"
verdict = "allow"
rationale = "Read-only type checking that produces no output files."
arity = "Boolean"

[[flag]]
applies_to = "tsc"
flag = "--watch"
translation_modifier = "continuously recompiling when source files change"
verdict = "allow"
rationale = "Keeps the compiler running to rebuild on changes; does not add destructive capability."
arity = "Boolean"

[[flag]]
applies_to = "tsc"
flag = "--strict"
translation_modifier = "enabling all strict type-checking options"
verdict = "allow"
rationale = "Increases the strictness of type checking; does not change output behavior."
arity = "Boolean"

[[flag]]
applies_to = "tsc"
flag = "--outDir"
translation_modifier = "writing compiled output to a specified directory"
verdict = "allow"
rationale = "Changes where output files are written; does not add destructive capability."
arity = "Boolean"

[[flag]]
applies_to = "tsc"
flag = "--project"
translation_modifier = "using a specified tsconfig.json configuration file"
verdict = "allow"
rationale = "Selects which configuration to use; does not change the compiler's capabilities."
arity = "Boolean"

[[flag]]
applies_to = "tsc"
flag = "--declaration"
translation_modifier = "generating type declaration files alongside the JavaScript output"
verdict = "allow"
rationale = "Produces additional .d.ts files; does not change the compilation behavior."
arity = "Boolean"

[[flag]]
applies_to = "tsc"
flag = "--sourceMap"
translation_modifier = "generating source map files for debugging"
verdict = "allow"
rationale = "Produces additional .map files; does not change the compilation behavior."
arity = "Boolean"

[[flag]]
applies_to = "tsc"
flag = "--incremental"
translation_modifier = "saving build information to speed up subsequent compilations"
verdict = "allow"
rationale = "Writes a build info file for faster rebuilds; does not change compilation output."
arity = "Boolean"

# ── Combos ───────────────────────────────────────────────────────────────────

[[combo]]
path = "tsc --noEmit"
translation = "Type-check TypeScript source code without writing any compiled JavaScript output files."
verdict = "allow"
rationale = "Read-only validation commonly used in CI pipelines to catch type errors without producing build artifacts."
risk_class = "novel"

[[combo]]
path = "tsc --watch"
translation = "Compile TypeScript source code and continuously recompile whenever source files change."
verdict = "allow"
rationale = "Keeps the compiler running as a long-lived process that rebuilds on file changes, standard for development workflows."
risk_class = "novel"
