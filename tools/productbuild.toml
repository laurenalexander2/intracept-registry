# tools/productbuild.toml

[[command]]
path = "productbuild"
translation = "Build a macOS Installer product archive from component packages."
verdict = "allow"
rationale = "Creates a product archive file; does not install anything."
risk_class = "novel"

[[flag]]
applies_to = "productbuild"
flag = "--distribution"
translation_modifier = "using a distribution file to define the installer presentation and choices"
verdict = "allow"
rationale = "Controls the installer UI and package selection; does not modify packages."
arity = "Boolean"

[[flag]]
applies_to = "productbuild"
flag = "--package-path"
translation_modifier = "searching a specific directory for component packages"
verdict = "allow"
rationale = "Specifies where to find packages; does not modify them."
arity = "Boolean"

[[flag]]
applies_to = "productbuild"
flag = "--resources"
translation_modifier = "including localized resources such as license files and images"
verdict = "allow"
rationale = "Adds UI resources to the product archive; does not change package contents."
arity = "Boolean"

[[flag]]
applies_to = "productbuild"
flag = "--component"
translation_modifier = "packaging a specific application bundle into the product archive"
verdict = "allow"
rationale = "Includes a bundle; does not modify the bundle."
arity = "Boolean"

[[flag]]
applies_to = "productbuild"
flag = "--root"
translation_modifier = "packaging a destination root directory into the product archive"
verdict = "allow"
rationale = "Includes a directory tree; does not modify the source files."
arity = "Boolean"

[[flag]]
applies_to = "productbuild"
flag = "--package"
translation_modifier = "including an existing component package in the product archive"
verdict = "allow"
rationale = "Adds a pre-built package; does not modify it."
arity = "Boolean"

[[flag]]
applies_to = "productbuild"
flag = "--synthesize"
translation_modifier = "generating a distribution file instead of building a product archive"
verdict = "allow"
rationale = "Outputs a distribution file for customization; does not create a product archive."
arity = "Boolean"

[[flag]]
applies_to = "productbuild"
flag = "--product"
translation_modifier = "applying pre-install requirements from a property list"
verdict = "allow"
rationale = "Sets system requirements for installation; only affects metadata."
arity = "Boolean"

[[flag]]
applies_to = "productbuild"
flag = "--sign"
translation_modifier = "digitally signing the product archive with a developer identity"
verdict = "allow"
rationale = "Adds a signature for trust verification; does not change the archive contents."
arity = "Boolean"

[[flag]]
applies_to = "productbuild"
flag = "--keychain"
translation_modifier = "searching for the signing identity in a specific keychain"
verdict = "allow"
rationale = "Selects a non-default keychain; does not change the signing operation."
arity = "Boolean"

[[flag]]
applies_to = "productbuild"
flag = "--timestamp"
translation_modifier = "including a trusted timestamp with the signature"
verdict = "allow"
rationale = "Adds a timestamp for long-term signature validity; a security-enhancing option."
arity = "Boolean"

[[flag]]
applies_to = "productbuild"
flag = "--scripts"
translation_modifier = "including scripts for use by distribution commands"
verdict = "allow"
rationale = "Embedded scripts can run during installation and make arbitrary system changes."
arity = "Boolean"

[[flag]]
applies_to = "productbuild"
flag = "--plugins"
translation_modifier = "including installer plugin bundles"
verdict = "allow"
rationale = "Adds custom installer UI plugins; does not change package contents."
arity = "Boolean"

[[flag]]
applies_to = "productbuild"
flag = "--identifier"
translation_modifier = "setting a unique identifier for the product"
verdict = "allow"
rationale = "Labels the product for identification; does not change contents."
arity = "Boolean"

[[flag]]
applies_to = "productbuild"
flag = "--version"
translation_modifier = "setting the version number for the product"
verdict = "allow"
rationale = "Labels the product version; does not change contents."
arity = "Boolean"

[[flag]]
applies_to = "productbuild"
flag = "--quiet"
translation_modifier = ""
verdict = "allow"
rationale = "Only suppresses status messages on standard output."
arity = "Boolean"

[[flag]]
applies_to = "productbuild"
flag = "--component-compression"
translation_modifier = "controlling the compression algorithm for bundled components"
verdict = "allow"
rationale = "Affects archive size and compatibility; does not change the contents."
arity = "Boolean"
