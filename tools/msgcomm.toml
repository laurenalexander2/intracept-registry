# tools/msgcomm.toml — GNU gettext common message extractor

[[command]]
path = "msgcomm"
translation = "Find messages common to two or more translation catalog files."
verdict = "allow"
rationale = "Read-only extraction that outputs common messages."

[[flag]]
applies_to = "msgcomm"
flag = "--force"
translation_modifier = "overwriting existing output files"
verdict = "allow"
rationale = "Bypasses the overwrite prompt, silently replacing existing output files."
