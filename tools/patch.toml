# tools/patch.toml

[[command]]
path = "patch"
translation = "Apply a diff file to modify source files."
verdict = "allow"
rationale = "Modifies files on disk according to a patch file; changes can be reversed."

[[flag]]
applies_to = "patch"
flag = "-R"
translation_modifier = "reversing the patch to undo previously applied changes"
verdict = "allow"
rationale = "Undoes a patch application; safe if the patch was previously applied correctly."

[[flag]]
applies_to = "patch"
flag = "--dry-run"
translation_modifier = "simulating the patch without actually modifying any files"
verdict = "allow"
rationale = "No files are modified; only shows what would happen."

[[flag]]
applies_to = "patch"
flag = "-p"
translation_modifier = "stripping a specified number of leading path components from file names"
verdict = "allow"
rationale = "Adjusts path handling; does not change what modifications are applied."

[[flag]]
applies_to = "patch"
flag = "-b"
translation_modifier = "creating backup files before modifying originals"
verdict = "allow"
rationale = "Preserves original files as backups; a safety-enhancing option."

[[flag]]
applies_to = "patch"
flag = "-f"
translation_modifier = "without asking for confirmation and assuming all defaults"
verdict = "allow"
rationale = "Suppresses interactive prompts, which removes a safety check before applying changes."

[[flag]]
applies_to = "patch"
flag = "-s"
translation_modifier = "suppressing all output except error messages"
verdict = "allow"
rationale = "Only affects verbosity; does not change what modifications are applied."

[[flag]]
applies_to = "patch"
flag = "-i"
translation_modifier = "reading the patch from a specified file"
verdict = "allow"
rationale = "Only changes where the patch input is read from."

[[flag]]
applies_to = "patch"
flag = "-o"
translation_modifier = "writing the patched result to a specified file instead of modifying the original"
verdict = "allow"
rationale = "Preserves the original file by writing output elsewhere."

[[flag]]
applies_to = "patch"
flag = "-E"
translation_modifier = "deleting output files that become empty after patching"
verdict = "allow"
rationale = "Automatically removes files, which could cause data loss if the patch is incorrect."

[[flag]]
applies_to = "patch"
flag = "-N"
translation_modifier = "skipping patches that appear to be already applied or reversed"
verdict = "allow"
rationale = "Avoids reapplying changes; a safety-enhancing option."

[[flag]]
applies_to = "patch"
flag = "-d"
translation_modifier = "changing to a specified directory before applying the patch"
verdict = "allow"
rationale = "Only changes the working directory for path resolution."

[[flag]]
applies_to = "patch"
flag = "-l"
translation_modifier = "ignoring differences in whitespace when matching lines"
verdict = "allow"
rationale = "Makes matching more flexible; does not change what modifications are applied."
