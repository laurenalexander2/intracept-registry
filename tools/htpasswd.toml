# tools/htpasswd.toml

[[command]]
path = "htpasswd"
translation = "Create or update Apache HTTP server password files."
verdict = "allow"
rationale = "Modifies password files used for web server authentication."

[[flag]]
applies_to = "htpasswd"
flag = "-c"
translation_modifier = "creating a new password file, overwriting any existing one"
verdict = "require_approval"
rationale = "Destroys the existing password file and all its entries."

[[flag]]
applies_to = "htpasswd"
flag = "-D"
translation_modifier = "deleting the specified user from the password file"
verdict = "allow"
rationale = "Removes a user's authentication entry, which may lock them out of protected resources."

[[flag]]
applies_to = "htpasswd"
flag = "-v"
translation_modifier = "verifying a password instead of updating it"
verdict = "allow"
rationale = "Read-only verification that does not modify the password file."

[[flag]]
applies_to = "htpasswd"
flag = "-n"
translation_modifier = "printing the result to standard output instead of updating the file"
verdict = "allow"
rationale = "Does not modify any files; only outputs the result."

[[flag]]
applies_to = "htpasswd"
flag = "-b"
translation_modifier = "reading the password from the command line instead of prompting"
verdict = "allow"
rationale = "The password is visible in process listings and shell history."
