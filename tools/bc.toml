# tools/bc.toml

[[command]]
path = "bc"
translation = "Run an interactive calculator with unlimited precision."
verdict = "allow"
rationale = "Performs mathematical calculations and does not modify any files."

[[flag]]
applies_to = "bc"
flag = "-l"
translation_modifier = "loading the standard math library with extra functions"
verdict = "allow"
rationale = "Preloads math functions like sine and cosine; read-only computation."

[[flag]]
applies_to = "bc"
flag = "-i"
translation_modifier = "forcing interactive mode"
verdict = "allow"
rationale = "Enables interactive prompts; no effect on data or files."

[[flag]]
applies_to = "bc"
flag = "-q"
translation_modifier = "suppressing the startup banner"
verdict = "allow"
rationale = "Cosmetic change that hides the welcome message."

[[flag]]
applies_to = "bc"
flag = "-e"
translation_modifier = "evaluating the given expression directly"
verdict = "allow"
rationale = "Runs a calculation from the command line instead of interactively; read-only."

[[flag]]
applies_to = "bc"
flag = "-s"
translation_modifier = "restricting to the standard feature set only"
verdict = "allow"
rationale = "Disables non-standard extensions; limits functionality but modifies nothing."

[[flag]]
applies_to = "bc"
flag = "-w"
translation_modifier = "showing warnings for non-standard features"
verdict = "allow"
rationale = "Enables extra warning messages without changing computation behavior."
