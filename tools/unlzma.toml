# tools/unlzma.toml

[[command]]
path = "unlzma"
translation = "Decompress Lempel-Ziv-Markov compressed files."
verdict = "allow"
rationale = "Decompresses files creating the original output; non-destructive."

[[flag]]
applies_to = "unlzma"
flag = "--force"
translation_modifier = "overwriting existing output files without prompting"
verdict = "allow"
rationale = "Overwrites existing output files without confirmation; recoverable from backups."
