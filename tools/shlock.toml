# tools/shlock.toml

[[command]]
path = "shlock"
translation = "Create or verify a lock file for shell scripts."
verdict = "allow"
rationale = "Creates a small lock file containing a PID; trivially reversible by removing the file."

[[flag]]
applies_to = "shlock"
flag = "-f"
translation_modifier = "using a specified lock file path"
verdict = "allow"
rationale = "Names the lock file; required for operation."

[[flag]]
applies_to = "shlock"
flag = "-p"
translation_modifier = "storing a specified process ID in the lock file"
verdict = "allow"
rationale = "Writes a PID to the lock file; no destructive action."
