# tools/httpd.toml

[[command]]
path = "httpd"
translation = "Run the Apache HTTP web server."
verdict = "allow"
rationale = "Starts a network-accessible web server that serves files and executes server-side scripts."

[[flag]]
applies_to = "httpd"
flag = "-t"
translation_modifier = "testing the configuration file syntax without starting the server"
verdict = "allow"
rationale = "Read-only syntax check that does not start the server."

[[flag]]
applies_to = "httpd"
flag = "-k"
translation_modifier = "sending a control signal to a running server instance"
verdict = "allow"
rationale = "Can start, restart, or stop the web server process."

[[flag]]
applies_to = "httpd"
flag = "-X"
translation_modifier = "running in debug mode with a single worker process"
verdict = "allow"
rationale = "Only changes the server's process model for debugging purposes."
