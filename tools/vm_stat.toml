# tools/vm_stat.toml

[[command]]
path = "vm_stat"
translation = "Display virtual memory statistics for the system."
verdict = "allow"
rationale = "Read-only display of memory page statistics; modifies nothing."

[[flag]]
applies_to = "vm_stat"
flag = "-c"
translation_modifier = "stopping after a specified number of intervals"
verdict = "allow"
rationale = "Only limits how long the monitoring runs; read-only operation."
