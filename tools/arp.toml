# tools/arp.toml

[[command]]
path = "arp"
translation = "Display and modify the system table that maps network addresses to hardware addresses."
verdict = "allow"
rationale = "Can modify the system's address resolution table, which affects how network traffic reaches its destination."

[[flag]]
applies_to = "arp"
flag = "-a"
translation_modifier = "showing all entries in the table"
verdict = "allow"
rationale = "Read-only display of all cached address mappings."

[[flag]]
applies_to = "arp"
flag = "-d"
translation_modifier = "deleting an entry from the table"
verdict = "require_approval"
rationale = "Removes an address mapping, which can disrupt network connectivity to the affected host."

[[flag]]
applies_to = "arp"
flag = "-s"
translation_modifier = "adding a static entry to the table"
verdict = "allow"
rationale = "Creates a permanent address mapping that overrides automatic resolution and persists until manually removed."

[[flag]]
applies_to = "arp"
flag = "-S"
translation_modifier = "replacing any existing entry with a new static entry"
verdict = "allow"
rationale = "Deletes and recreates an address mapping, which temporarily disrupts connectivity to that host."

[[flag]]
applies_to = "arp"
flag = "-n"
translation_modifier = "showing addresses as numbers instead of resolving names"
verdict = "allow"
rationale = "Only changes output formatting; does not modify any data."

[[flag]]
applies_to = "arp"
flag = "-i"
translation_modifier = "limited to a specific network interface"
verdict = "allow"
rationale = "Narrows the scope of the operation to one interface; does not increase risk."

[[flag]]
applies_to = "arp"
flag = "-f"
translation_modifier = "reading multiple entries from a file"
verdict = "allow"
rationale = "Bulk-loads address mappings from a file, which could disrupt connectivity if entries are incorrect."
