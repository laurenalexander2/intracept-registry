# tools/tail.toml

# ── Base command ──────────────────────────────────────────────────────────────

[[command]]
path = "tail"
translation = "Display the last lines of a file."
verdict = "allow"
rationale = "Read-only display of file contents that modifies nothing."

# ── Line and byte selection ──────────────────────────────────────────────────

[[flag]]
applies_to = "tail"
flag = "-n"
translation_modifier = "showing a specified number of lines"
verdict = "allow"
rationale = "Changes how many lines are displayed; still read-only."

[[flag]]
applies_to = "tail"
flag = "-c"
translation_modifier = "showing a specified number of bytes instead of lines"
verdict = "allow"
rationale = "Changes the unit of output from lines to bytes; still read-only."

[[flag]]
applies_to = "tail"
flag = "-b"
translation_modifier = "showing a specified number of 512-byte blocks instead of lines"
verdict = "allow"
rationale = "Changes the unit of output to 512-byte blocks; still read-only."

# ── Following ────────────────────────────────────────────────────────────────

[[flag]]
applies_to = "tail"
flag = "-f"
translation_modifier = "continuously following new output as the file grows"
verdict = "allow"
rationale = "Keeps the stream open to display new lines as they are appended; still read-only."

[[flag]]
applies_to = "tail"
flag = "-F"
translation_modifier = "continuously following new output, reopening the file if it is rotated or renamed"
verdict = "allow"
rationale = "Like -f but handles log rotation by detecting inode changes; still read-only."

# ── Display order ────────────────────────────────────────────────────────────

[[flag]]
applies_to = "tail"
flag = "-r"
translation_modifier = "displaying lines in reverse order from the end of the file"
verdict = "allow"
rationale = "Reverses the output order; still read-only."
