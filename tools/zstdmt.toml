# tools/zstdmt.toml

[[command]]
path = "zstdmt"
translation = "Compress or decompress files using Zstandard with multi-threaded processing."
verdict = "allow"
rationale = "Creates compressed or decompressed output files; originals are unchanged by default."

[[flag]]
applies_to = "zstdmt"
flag = "--force"
translation_modifier = "overwriting existing output files without prompting"
verdict = "allow"
rationale = "Overwrites existing output files without confirmation; recoverable from backups."
