# tools/log.toml

[[command]]
path = "log"
translation = "Access the macOS unified logging system."
verdict = "allow"
rationale = "The bare command prints help text and modifies nothing."
risk_class = "novel"

[[command]]
path = "log show"
translation = "Display log messages from the system log or a log archive."
verdict = "allow"
rationale = "Read-only display of stored log entries; modifies nothing."
risk_class = "novel"

[[command]]
path = "log stream"
translation = "Watch new log messages in real time."
verdict = "allow"
rationale = "Read-only monitoring of live log entries; modifies nothing."
risk_class = "novel"

[[command]]
path = "log collect"
translation = "Gather system logs into an archive file for later analysis."
verdict = "allow"
rationale = "Creates a copy of log data; does not modify the original logs."
risk_class = "novel"

[[command]]
path = "log config"
translation = "Change the logging level or persistence settings for the system or a specific process."
verdict = "allow"
rationale = "Modifies which log messages are captured or retained, which can affect debugging and auditing."
risk_class = "novel"

[[command]]
path = "log erase"
translation = "Delete log data from the system."
verdict = "ask"
rationale = "Permanently removes log entries, destroying diagnostic and audit information."
risk_class = "novel"

[[command]]
path = "log stats"
translation = "Display a statistical breakdown of log data."
verdict = "allow"
rationale = "Read-only analysis of log storage; modifies nothing."
risk_class = "novel"

[[flag]]
applies_to = "log show"
flag = "--predicate"
translation_modifier = "filtering messages using a search expression"
verdict = "allow"
rationale = "Only narrows which log entries are displayed."
arity = "Boolean"

[[flag]]
applies_to = "log show"
flag = "--last"
translation_modifier = "showing only messages from a recent time period"
verdict = "allow"
rationale = "Only limits the time range displayed."
arity = "Boolean"

[[flag]]
applies_to = "log show"
flag = "--info"
translation_modifier = "including informational-level messages in the output"
verdict = "allow"
rationale = "Only adds more log entries to the display."
arity = "Boolean"

[[flag]]
applies_to = "log show"
flag = "--debug"
translation_modifier = "including debug-level messages in the output"
verdict = "allow"
rationale = "Only adds more log entries to the display."
arity = "Boolean"

[[flag]]
applies_to = "log show"
flag = "--process"
translation_modifier = "filtering to messages from a specific process"
verdict = "allow"
rationale = "Only narrows which log entries are displayed."
arity = "Boolean"

[[flag]]
applies_to = "log show"
flag = "--style"
translation_modifier = ""
verdict = "allow"
rationale = "Only changes the output format; no state modification."
arity = "Boolean"

[[flag]]
applies_to = "log show"
flag = "--start"
translation_modifier = "showing messages starting from a specific date and time"
verdict = "allow"
rationale = "Only limits the time range displayed."
arity = "Boolean"

[[flag]]
applies_to = "log show"
flag = "--end"
translation_modifier = "showing messages up to a specific date and time"
verdict = "allow"
rationale = "Only limits the time range displayed."
arity = "Boolean"

[[flag]]
applies_to = "log show"
flag = "--archive"
translation_modifier = "reading from a log archive file instead of the live system"
verdict = "allow"
rationale = "Only changes the data source; read-only operation."
arity = "Boolean"

[[flag]]
applies_to = "log show"
flag = "--signpost"
translation_modifier = "including performance signpost entries in the output"
verdict = "allow"
rationale = "Only adds more entries to the display."
arity = "Boolean"

[[flag]]
applies_to = "log stream"
flag = "--predicate"
translation_modifier = "filtering messages using a search expression"
verdict = "allow"
rationale = "Only narrows which log entries are displayed."
arity = "Boolean"

[[flag]]
applies_to = "log stream"
flag = "--level"
translation_modifier = "setting the minimum message level to display"
verdict = "allow"
rationale = "Only controls which severity levels are shown."
arity = "Boolean"

[[flag]]
applies_to = "log stream"
flag = "--process"
translation_modifier = "filtering to messages from a specific process"
verdict = "allow"
rationale = "Only narrows which log entries are displayed."
arity = "Boolean"

[[flag]]
applies_to = "log stream"
flag = "--style"
translation_modifier = ""
verdict = "allow"
rationale = "Only changes the output format; no state modification."
arity = "Boolean"

[[flag]]
applies_to = "log stream"
flag = "--timeout"
translation_modifier = "stopping the stream after a specified duration"
verdict = "allow"
rationale = "Only limits how long the stream runs."
arity = "Boolean"

[[flag]]
applies_to = "log collect"
flag = "--output"
translation_modifier = "saving the archive to a specified path"
verdict = "allow"
rationale = "Only controls where the archive file is written."
arity = "Boolean"

[[flag]]
applies_to = "log collect"
flag = "--last"
translation_modifier = "collecting only logs from a recent time period"
verdict = "allow"
rationale = "Only limits the time range collected."
arity = "Boolean"

[[flag]]
applies_to = "log collect"
flag = "--start"
translation_modifier = "collecting logs starting from a specific date and time"
verdict = "allow"
rationale = "Only limits the time range collected."
arity = "Boolean"

[[flag]]
applies_to = "log collect"
flag = "--size"
translation_modifier = "limiting the archive to a specified size"
verdict = "allow"
rationale = "Only limits the amount of data collected."
arity = "Boolean"

[[flag]]
applies_to = "log config"
flag = "--status"
translation_modifier = "displaying the current logging settings instead of changing them"
verdict = "allow"
rationale = "Read-only display of configuration; modifies nothing."
arity = "Boolean"

[[flag]]
applies_to = "log config"
flag = "--reset"
translation_modifier = "reverting logging settings to their defaults"
verdict = "allow"
rationale = "Changes logging configuration, which may stop capturing messages that were previously being recorded."
arity = "Boolean"

[[flag]]
applies_to = "log config"
flag = "--mode"
translation_modifier = "setting the logging level or persistence mode"
verdict = "allow"
rationale = "Changes which messages are captured or persisted, affecting diagnostic capabilities."
arity = "Boolean"

[[flag]]
applies_to = "log config"
flag = "--subsystem"
translation_modifier = "targeting a specific application or framework subsystem"
verdict = "allow"
rationale = "Only scopes the configuration change to a particular subsystem."
arity = "Boolean"

[[flag]]
applies_to = "log erase"
flag = "--all"
translation_modifier = "deleting all log data including fault and error records"
verdict = "ask"
rationale = "Permanently destroys all system log data, eliminating any diagnostic or audit trail."
arity = "Boolean"

[[flag]]
applies_to = "log erase"
flag = "--ttl"
translation_modifier = "deleting only time-limited log content"
verdict = "ask"
rationale = "Permanently removes a subset of log data that may be needed for diagnostics."
arity = "Boolean"
