# tools/mongosh.toml

[[command]]
path = "mongosh"
translation = "Connect to a MongoDB database."
verdict = "allow"
rationale = "Connects to a live database where any command can be executed, including destructive operations like dropDatabase."

[[flag]]
applies_to = "mongosh"
flag = "--host"
translation_modifier = "connecting to a specified database server host"
verdict = "allow"
rationale = "Specifies which server to connect to; does not change what operations can be performed."

[[flag]]
applies_to = "mongosh"
flag = "--port"
translation_modifier = "connecting on a specified port"
verdict = "allow"
rationale = "Specifies which port to connect on; does not change what operations can be performed."

[[flag]]
applies_to = "mongosh"
flag = "--username"
translation_modifier = "authenticating as a specified user"
verdict = "allow"
rationale = "Specifies the authentication identity; the user's permissions determine what operations are allowed."

[[flag]]
applies_to = "mongosh"
flag = "--password"
translation_modifier = "authenticating with a specified password"
verdict = "allow"
rationale = "Provides authentication credentials for the connection."

[[flag]]
applies_to = "mongosh"
flag = "--eval"
translation_modifier = "executing a specified JavaScript expression and then exiting"
verdict = "require_approval"
rationale = "Runs arbitrary database commands directly, including destructive operations like drop or deleteMany."

[[flag]]
applies_to = "mongosh"
flag = "--file"
translation_modifier = "executing JavaScript commands from a file and then exiting"
verdict = "require_approval"
rationale = "Runs an entire script that may contain destructive operations and is harder to review at execution time."

[[flag]]
applies_to = "mongosh"
flag = "--authenticationDatabase"
translation_modifier = "authenticating against a specified database"
verdict = "allow"
rationale = "Selects which database holds the user credentials; does not change what operations can be performed."

[[flag]]
applies_to = "mongosh"
flag = "--tls"
translation_modifier = "connecting over an encrypted TLS connection"
verdict = "allow"
rationale = "Enables transport encryption; does not affect command capabilities."

[[flag]]
applies_to = "mongosh"
flag = "--quiet"
translation_modifier = ""
verdict = "allow"
rationale = "Suppresses startup messages and connection information; cosmetic only."

[[flag]]
applies_to = "mongosh"
flag = "--nodb"
translation_modifier = "starting without connecting to any database"
verdict = "allow"
rationale = "Launches the shell without a database connection; no data can be modified until a connection is made."

[[flag]]
applies_to = "mongosh"
flag = "--shell"
translation_modifier = "entering interactive mode after running a file or eval command"
verdict = "allow"
rationale = "Keeps the session open for interactive use; does not change what commands are available."
