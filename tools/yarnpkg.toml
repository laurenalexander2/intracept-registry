# tools/yarnpkg.toml

[[command]]
path = "yarnpkg"
translation = "Run the Yarn JavaScript package manager."
verdict = "allow"
rationale = "Installs, updates, and removes npm packages; modifies node_modules and lockfiles."
risk_class = "novel"

[[flag]]
applies_to = "yarnpkg"
flag = "--all"
translation_modifier = "applying the operation to all workspaces"
verdict = "allow"
rationale = "Widens scope to every workspace in the project."
arity = "Boolean"
[[flag]]
applies_to = "yarnpkg"
flag = "--force"
translation_modifier = "refetching all packages even if already downloaded"
verdict = "allow"
rationale = "Forces re-download of all packages, bypassing cache."
arity = "Boolean"
[[flag]]
applies_to = "yarnpkg"
flag = "--recursive"
translation_modifier = "recursively through all workspace dependencies"
verdict = "allow"
rationale = "Processes dependencies across all workspaces."
arity = "Boolean"
[[flag]]
applies_to = "yarnpkg"
flag = "--reset"
translation_modifier = "resetting the lockfile and regenerating it from scratch"
verdict = "allow"
rationale = "Deletes and recreates the lockfile; may change resolved dependency versions."
arity = "Boolean"
