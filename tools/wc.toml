# tools/wc.toml

[[command]]
path = "wc"
translation = "Count lines, words, and bytes in files."
verdict = "allow"
rationale = "Read-only operation that displays counts without modifying any files."

[[flag]]
applies_to = "wc"
flag = "-l"
translation_modifier = "counting only lines"
verdict = "allow"
rationale = "Restricts output to line counts; still read-only."

[[flag]]
applies_to = "wc"
flag = "-w"
translation_modifier = "counting only words"
verdict = "allow"
rationale = "Restricts output to word counts; still read-only."

[[flag]]
applies_to = "wc"
flag = "-c"
translation_modifier = "counting only bytes"
verdict = "allow"
rationale = "Restricts output to byte counts; still read-only."

[[flag]]
applies_to = "wc"
flag = "-m"
translation_modifier = "counting only characters"
verdict = "allow"
rationale = "Restricts output to character counts, which may differ from byte counts for multibyte encodings; still read-only."

[[flag]]
applies_to = "wc"
flag = "-L"
translation_modifier = "showing only the length of the longest line"
verdict = "allow"
rationale = "Reports the longest line length instead of standard counts; still read-only."
