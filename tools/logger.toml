# tools/logger.toml

[[command]]
path = "logger"
translation = "Write a message to the system log."
verdict = "allow"
rationale = "Adds an entry to the system log; does not modify files or processes."

[[flag]]
applies_to = "logger"
flag = "-p"
translation_modifier = "using a specific facility and priority level"
verdict = "allow"
rationale = "Only changes the syslog facility and priority of the message."

[[flag]]
applies_to = "logger"
flag = "-t"
translation_modifier = "tagging the log entry with a specific label"
verdict = "allow"
rationale = "Only changes the tag attached to the log message."
