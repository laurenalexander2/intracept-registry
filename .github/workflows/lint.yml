name: Lint TOML registry

on:
  pull_request:
    paths:
      - 'tools/**/*.toml'
      - 'tools/lint.py'
      - 'tools/build-index.py'
      - 'registry.json'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run registry linter
        run: python tools/lint.py tools/

      - name: Run lint + build-index tests
        run: python -m pytest tools/ -v

      - name: Verify registry.json is in sync with tools/*.toml (TD-H4)
        run: python tools/build-index.py --check
